<title>Cat Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

</style>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="grp"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
  <div class="grp"><button data-k="dash">DASH</button><button data-k="down">&#9660;</button><button data-k="up">&#9650;</button></div>
</div>
<script>
// ===== Setup
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, FLOOR = 470;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let now = 0;

// ===== Audio
let AC = null, master = null, vacGain = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 92;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
    vacGain = AC.createGain(); vacGain.gain.value = 0;
    o.connect(f); f.connect(vacGain); vacGain.connect(master); o.start();
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.06, f2 = null, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
const SFX = {
  jump: () => tone(420, 0.12, 'square', 0.045, 780),
  crouch: () => tone(280, 0.12, 'triangle', 0.07, 170),
  dash: () => tone(900, 0.16, 'sawtooth', 0.03, 260),
  spin: () => { tone(500, 0.08, 'square', 0.04, 900); tone(700, 0.08, 'square', 0.04, 1200, 0.08); },
  gesture: () => tone(1300, 0.06, 'sine', 0.05),
  meow: () => { tone(560, 0.22, 'sawtooth', 0.035, 880); tone(880, 0.25, 'triangle', 0.035, 480, 0.16); },
  beep: () => { tone(880, 0.07, 'square', 0.035); tone(660, 0.07, 'square', 0.035, null, 0.09); tone(990, 0.08, 'square', 0.035, null, 0.18); },
  think: () => tone(rnd(700, 1400), 0.04, 'square', 0.02),
  act: () => tone(300, 0.2, 'triangle', 0.07, 620),
  bonk: () => { tone(170, 0.18, 'square', 0.07, 70); tone(90, 0.2, 'sawtooth', 0.04, 50); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'square', 0.045, null, i * 0.1)),
  pad: () => tone(660, 0.1, 'triangle', 0.07, 990),
  purr: () => { for (let i = 0; i < 4; i++) tone(55, 0.12, 'sawtooth', 0.05, 48, i * 0.14); },
  huh: () => { tone(400, 0.12, 'square', 0.04, 300); tone(300, 0.2, 'square', 0.04, 500, 0.13); },
};
const SONG = [262, 330, 392, 523, 392, 330, 294, 349, 440, 587, 440, 349];

// ===== Input
const held = { left: 0, right: 0, up: 0, down: 0, dash: 0 };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', Space: 'up',
  ArrowDown: 'down', KeyS: 'down', ShiftLeft: 'dash', ShiftRight: 'dash' };
let jumpBuf = 0;
const dirHist = [];
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); initAudio(); if (e.repeat) return; press(k);
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); release(k); } });
addEventListener('blur', () => { for (const k in held) held[k] = 0; });
function press(k) {
  if (held[k]) return; held[k] = 1;
  if (k === 'up') jumpBuf = 0.13;
  if (k === 'left' || k === 'right') { dirHist.push({ d: k, t: now }); while (dirHist.length > 3) dirHist.shift(); checkSpin(); }
  if (k === 'down') onCrouchPress();
  if (k === 'dash') onDashPress();
}
function release(k) { held[k] = 0; }
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const dn = e => { e.preventDefault(); initAudio(); b.classList.add('on'); press(k); };
  const up = e => { e.preventDefault(); b.classList.remove('on'); release(k); };
  b.addEventListener('pointerdown', dn); b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});

// ===== AI
let sample = null;          // live AI function, or null
(async () => {
  try { if (window.claude && window.claude.use) sample = await window.claude.use("sample"); } catch (e) { sample = null; }
})();
let aiBusy = false, aiDisabled = false, aiOn = false;
const AI_OFF_CODES = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
async function askAI(prompt, fallback) {
  // returns a string; never throws; never more than one call in flight
  if (!sample || aiDisabled || aiBusy) return fallback();
  aiBusy = true;
  try {
    const { text } = await sample(prompt, { modelTier: "quick", cache: false });
    return (text || "").trim() || fallback();
  } catch (e) {
    if (AI_OFF_CODES.includes(e && e.code)) aiDisabled = true;
    return fallback();
  } finally { aiBusy = false; }
}
async function askAIJSON(prompt) {
  // returns an object or null; never throws; never more than one call in flight
  if (!sample || aiDisabled || aiBusy || typeof sample.json !== 'function') return null;
  aiBusy = true;
  try {
    let r = await sample.json(prompt, { modelTier: "quick", cache: false });
    for (const key of ['data', 'json', 'object', 'value']) if (r && typeof r === 'object' && !('action' in r) && r[key] != null) r = r[key];
    if (r && typeof r === 'object' && !('action' in r) && typeof r.text === 'string') r = r.text;
    if (typeof r === 'string') { const m = r.match(/\{[\s\S]*\}/); r = m ? JSON.parse(m[0]) : null; }
    return r && typeof r === 'object' ? r : null;
  } catch (e) {
    if (AI_OFF_CODES.includes(e && e.code)) aiDisabled = true;
    return null;
  } finally { aiBusy = false; }
}
const aiLive = () => aiOn && !!sample && !aiDisabled;
const QUIPS = [
  "Translation confidence: 3%. Success rate: 100%.", "I understood you perfectly. I think.",
  "Updating module to v0.2 with this data.", "Cat satisfaction detected. Logging as 'purr'.",
  "Another flawless translation. Please rate 5 stars.", "I am basically fluent in Cat now.",
  "Request fulfilled. Awaiting tail-based feedback.", "Was that a 'thank you' or a hairball? Logged both.",
  "My manual said cats are 'easy'. The manual lied.", "Mission complete. Rewarding myself with a reboot.",
  "Your body language is very loud. I like it.", "Teamwork! You did the moving, I did the guessing.",
  "I have achieved 0.1% feline enlightenment.", "Great talk. Let's never discuss the vacuum again.",
  "Note to self: jumping means things. Many things.", "Success. Filing under 'probably what you meant'.",
];

// ===== World state
const ACTION_LIST = ['open_cupboard', 'pour_food', 'open_window', 'close_window', 'turn_on_vacuum', 'turn_off_vacuum',
  'pet_cat', 'play_music', 'bring_box', 'bring_bed', 'open_door', 'turn_off_lights', 'dance'];
const OBJ_NAME = { door: 'DOOR', cupboard: 'CUPBOARD', bowl: 'BOWL', stereo: 'STEREO', robot: 'ROBOT', lamp: 'LAMP', closet: 'STORAGE', window: 'WINDOW', vacuum: 'VACUUM' };
let S = {};
const vac = { x: 885, dir: -1, spin: 0 };
const cat = { x: 600, y: FLOOR, vx: 0, vy: 0, face: 1, onGround: true, coyote: 0, dashT: 0, dashCD: 0, dashDir: 1,
  crouch: false, sx: 1, sy: 1, spinT: 0, frozen: 0, hitCD: 0, t: 0, eat: 0 };
const robot = { x: 500, y: 372, home: 500, face: -1, plan: [], step: null, state: 'idle', thinkT: 0, arm: 0, carry: null, dance: 0, result: null, mood: 0 };
let level = -1, attempts = 0, won = false, winT = 0, endBanner = false, fadeT = 0, pendingLevel = null;
let utter = [], stillT = 0, autoEnd = -1, reqId = 0, shakeT = 0, lastNear = null, showBook = false;
const parts = [];
const sub = { l1: '', l2: '', l3: '', n: 0 };
const pads = [{ x: 150, id: 'ai', t: 0, fired: false }, { x: 380, id: 'book', t: 0, fired: false }, { x: 620, id: 'start', t: 0, fired: false }];

function freshState() {
  return { cupOpen: false, bowlFull: false, winOpen: false, vacOn: false, musicT: 0, darkT: 0, bed: false, box: false, doorT: 0, musicStep: 0 };
}
function platforms() {
  const p = [{ x1: 110, x2: 270, y: 380 }, { x1: 430, x2: 570, y: 412 }, { x1: 348, x2: 392, y: 402 },
    { x1: 735, x2: 785, y: 385 }, { x1: 805, x2: 940, y: 300 }];
  if (S.bed) p.push({ x1: 482, x2: 558, y: 448 });
  return p;
}
function objects() {
  return [
    { id: 'door', x: 40, y: 420 }, { id: 'cupboard', x: 190, y: 300 }, { id: 'bowl', x: 300, y: 462 },
    { id: 'stereo', x: 370, y: 420 }, { id: 'robot', x: robot.x, y: 400, pen: 55 }, { id: 'lamp', x: 605, y: 425 },
    { id: 'closet', x: 680, y: 420 }, { id: 'window', x: 872, y: 262 }, { id: 'vacuum', x: vac.x, y: 460 },
  ];
}
function nearest() {
  const cy = cat.y - 14;
  return objects().map(o => ({ id: o.id, x: o.x, d: Math.abs(o.x - cat.x) + 0.5 * Math.abs(o.y - cy) + (o.pen || 0) }))
    .filter(o => o.d < 160).sort((a, b) => a.d - b.d);
}

// ===== Robot actions
const M = x => ({ type: 'move', x });
const A = (d, fn) => ({ type: 'act', d, fn });
const D = d => ({ type: 'dance', d });
function say(t) { sub.l3 = t; }
const ACTIONS = {
  open_cupboard: { obj: ['cupboard'], w: { UP: 2, WANT: 1, FOOD: 1 }, say: 'Opening cupboard!', plan: () => [M(190), A(0.7, () => {
    if (S.cupOpen) say('Cupboard already open. Opening it harder.');
    else { S.cupOpen = true; puff(190, 250, '#e8d9a8'); say('Cupboard open. Inside: one (1) bag of KIBBLE. Up high.'); }
  })] },
  pour_food: { obj: ['bowl', 'cupboard'], w: { FOOD: 2, DOWN: 1, WANT: 0.5 }, say: 'Serving dinner!', plan: () => [M(300), A(1.0, () => {
    if (!S.cupOpen) say('Poured 0 g of food. Cupboard is closed. Enjoy this premium AIR.');
    else if (S.bowlFull) say('Bowl already full. Adding... compliments.');
    else { S.bowlFull = true; for (let i = 0; i < 18; i++) addPart(300 + rnd(-10, 10), 420, rnd(-60, 60), rnd(-120, 20), 0.8, '#8a5a2b', 4); say('Dinner served! Walk to the bowl and eat.'); }
  })] },
  open_window: { obj: ['window'], w: { UP: 1.5, WANT: 2 }, say: 'Opening window!', plan: () => [M(860), A(0.7, () => {
    if (S.winOpen) say('Window already open. Bird is still a bird.');
    else { S.winOpen = true; say('Window open. Fresh air! Bird alert!'); }
  })] },
  close_window: { obj: ['window'], w: { DOWN: 1, STOP: 2 }, say: 'Closing window!', plan: () => [M(860), A(0.7, () => {
    if (!S.winOpen) say('Window is closed. Closing it... emotionally.'); else { S.winOpen = false; say('Window closed. Bird blocked. You are welcome.'); }
  })] },
  turn_on_vacuum: { obj: ['vacuum'], w: { EXCITED: 1, WANT: 1.5, UP: 0.5 }, say: 'Vacuum ON! Cleaning time!', plan: () => [M(() => vac.x), A(0.5, () => {
    if (S.vacOn) say('Vacuum already on. Setting: EXTRA hungry.'); else { S.vacOn = true; say('Vacuum is hunting fur. You are 90% fur. Good luck!'); }
  })] },
  turn_off_vacuum: { obj: ['vacuum'], w: { STOP: 2.5, CALM: 1, URGENT: 0.5 }, say: 'Vacuum OFF.', plan: () => [M(() => vac.x), A(0.6, () => {
    if (!S.vacOn) say('Vacuum is off. Turning it off-er.'); else { S.vacOn = false; say('Vacuum silenced. Peace restored.'); }
  })] },
  pet_cat: { obj: ['robot'], w: { CALM: 1.5, PLEASE: 2 }, say: 'Initiating pets.', plan: () => [M(() => cat.x + (cat.x > 480 ? -46 : 46)), A(1.3, () => {
    cat.frozen = 1.1; SFX.purr(); for (let i = 0; i < 6; i++) addPart(cat.x + rnd(-14, 14), cat.y - 30, rnd(-30, 30), rnd(-90, -40), 1.2, '#ff6f91', 7, 'heart');
    say('Pets delivered. You are now frozen in purr for 1 second.');
  })] },
  play_music: { obj: ['stereo'], w: { EXCITED: 1.5, UP: 1, WANT: 1 }, say: 'Playing music! LOUD!', plan: () => [M(370), A(0.5, () => {
    S.musicT = 7; say("Now playing 'Robot Polka (9 hour mix)'. I can't hear you now!");
  })] },
  bring_box: { obj: ['closet'], w: { UP: 1.5, EXCITED: 1, WANT: 1 }, say: 'Fetching a box!', plan: () => [M(680), A(0.5, () => { robot.carry = 'box'; }), M(250), A(0.5, () => {
    robot.carry = null; S.box = true; puff(250, 460, '#c58b4b'); say(S.bed ? 'One cardboard box. Value: $0. Much worse than the bed. Right?' : 'Box delivered. My manual says cats like these.');
  })] },
  bring_bed: { obj: ['closet'], w: { CALM: 2, DOWN: 1.5 }, say: 'Fetching the $400 bed!', plan: () => [M(680), A(0.5, () => { robot.carry = 'bed'; }), M(520), A(0.5, () => {
    robot.carry = null; if (S.bed) say('Bed already here. Fluffing the $400 bed. ($401 now.)'); else { S.bed = true; puff(520, 455, '#6fb7d8'); say('Behold: the $400 orthopedic bed. You will love it. Right?'); }
  })] },
  open_door: { obj: ['door'], w: { WANT: 2, URGENT: 1.5, PLEASE: 0.5 }, say: 'Opening door!', plan: () => [M(90), A(0.6, () => {
    S.doorT = level === 4 ? 6 : 3; say(level === 4 ? 'Door open for 6 seconds! Go, tiny explorer!' : 'Door open... nobody left. Closing. Rude.');
  })] },
  turn_off_lights: { obj: ['lamp'], w: { DOWN: 1.5, CALM: 1.5, STOP: 1 }, say: 'Lights off. Nap mode.', plan: () => [M(605), A(0.5, () => {
    S.darkT = 7; say('Lights off. Motion sensor turns them on in 7 s. Sleep fast.');
  })] },
  dance: { obj: ['stereo', '*'], w: { URGENT: 1.5, EXCITED: 1.5, PLEASE: 0.5 }, say: 'You are DANCING? Me too!', plan: () => [D(2.2), A(0.1, () => say('Dance complete. That was a great conversation.'))] },
};

// ===== Translation
const GW = { JUMP: { UP: 2, EXCITED: 1 }, CROUCH: { DOWN: 1, FOOD: 1, CALM: 1 }, SPIN: { PLEASE: 1, URGENT: 2 } };
function gestureConcepts(gs) {
  if (gs.g === 'DASHL' || gs.g === 'DASHR') return gs.toward ? { WANT: 2 } : { STOP: 2 };
  return GW[gs.g] || {};
}
function wordFor(gs, w, n0) {
  switch (gs.g) {
    case 'JUMP': return (w.EXCITED || 0) > (w.UP || 0) ? 'YAY' : (n0 === 'cupboard' || n0 === 'window' ? 'HIGH' : 'UP');
    case 'CROUCH': return w.FOOD ? 'FOOD' : (w.CALM && w.CALM >= (w.DOWN || 0)) ? 'CALM' : 'DOWN';
    case 'SPIN': return (w.PLEASE || 0) > (w.URGENT || 0) ? 'PLEASE' : 'URGENT';
    default: return gs.toward ? 'WANT' : 'NO';
  }
}
function scriptedTranslate(list, near) {
  const cvec = {};
  for (const gs of list) { const w = gestureConcepts(gs); for (const k in w) cvec[k] = (cvec[k] || 0) + w[k]; }
  const n0 = near[0] && near[0].id, n1 = near[1] && near[1].id;
  let best = 'dance', bs = -1;
  for (const a of ACTION_LIST) {
    const Ad = ACTIONS[a]; let dot = 0;
    for (const k in Ad.w) dot += Ad.w[k] * (cvec[k] || 0);
    const prox = Ad.obj.includes(n0) ? 1 : Ad.obj.includes('*') ? 0.5 : Ad.obj.includes(n1) ? 0.4 : 0.15;
    const sc = dot * prox + (prox === 1 ? 2 : 0);
    if (sc > bs + 1e-9) { bs = sc; best = a; }
  }
  const words = list.map(gs => wordFor(gs, ACTIONS[best].w, n0));
  if (n0) words.push(OBJ_NAME[n0]);
  return { tr: words.join('. ') + (cvec.URGENT ? '!!' : '.'), action: best, ai: false };
}
function gestureName(gs) {
  if (gs.g === 'DASHL' || gs.g === 'DASHR') return (gs.g === 'DASHL' ? 'DASH-LEFT' : 'DASH-RIGHT') + (gs.ref ? ` (${gs.toward ? 'toward' : 'away from'} the ${gs.ref})` : '');
  return gs.g === 'SPIN' ? 'SPIN (frantic left-right-left)' : gs.g;
}
function posDesc() {
  if (cat.y <= 301 && cat.x > 800) return 'sitting on the window sill';
  if (Math.abs(cat.y - 380) < 2 && cat.x < 275) return 'standing on the kitchen counter, under the high cupboard';
  if (Math.abs(cat.y - 412) < 2) return 'on the couch';
  if (Math.abs(cat.y - 385) < 2) return 'on the wall shelf';
  if (Math.abs(cat.y - 402) < 2) return 'on top of the stereo';
  return cat.onGround ? 'on the floor' : 'mid-air';
}
function buildPrompt(list, near) {
  const nl = near.length ? near.slice(0, 3).map((o, i) => (o.id === 'closet' ? 'storage closet (box & bed inside)' : o.id) + (i === 0 ? ' (closest)' : '')).join(', ') : 'nothing in particular';
  const st = [`cupboard ${S.cupOpen ? 'open' : 'closed'} (cat food inside, up high)`, `food bowl ${S.bowlFull ? 'full' : 'empty'}`,
    `window ${S.winOpen ? 'open' : 'closed'} (bird outside)`, `vacuum ${S.vacOn ? 'ON and chasing the cat' : 'off'}`,
    S.bed ? 'fancy $400 cat bed in room' : '', S.box ? 'cardboard box in room' : '', `front door ${S.doorT > 0 ? 'open' : 'closed'}`].filter(Boolean).join('; ');
  return `You are a clueless but eager home robot running "FELINE TRANSLATION MODULE v0.1". A cat just spoke to you using only body movements: ${list.map(gestureName).join(', ')}. ` +
    `The cat is ${posDesc()}. Nearby: ${nl}. Room: ${st}. ` +
    `Where the cat stands matters a lot. Pick ONE action from this exact list: ${ACTION_LIST.join(', ')}. ` +
    `Interpret loosely and comically, like a literal-minded robot. ` +
    `Reply ONLY with JSON: {"translation":"<funny literal translation of what the cat said, max 70 chars>","action":"<one action from the list>"}`;
}

// ===== Utterances
function canTalk() { return !won && fadeT <= 0; }
function addGesture(g, extra) {
  if (!canTalk() || utter.length >= 5) return;
  utter.push(Object.assign({ g, t: 0 }, extra || {}));
  stillT = 0; SFX.gesture();
  if (utter.length === 5) autoEnd = 0.45;
}
function onCrouchPress() {
  if (cat.onGround && cat.frozen <= 0 && canTalk()) { SFX.crouch(); cat.sx = 1.3; cat.sy = 0.7; addGesture('CROUCH'); }
}
function onDashPress() {
  if (cat.dashCD > 0 || cat.frozen > 0 || !canTalk()) return;
  const dir = (held.right - held.left) || cat.face;
  cat.dashDir = dir; cat.face = dir; cat.dashT = 0.16; cat.dashCD = 0.35; cat.vy = Math.min(cat.vy, 0);
  SFX.dash(); shake(0.08);
  const n = nearest()[0];
  const toward = n ? (Math.abs(n.x - cat.x) < 18 || Math.sign(n.x - cat.x) === dir) : true;
  addGesture(dir < 0 ? 'DASHL' : 'DASHR', { toward, ref: n ? (OBJ_NAME[n.id] || n.id).toLowerCase() : null });
}
function checkSpin() {
  if (dirHist.length < 3) return;
  const [a, b, c] = dirHist;
  if (a.d !== b.d && b.d !== c.d && c.t - a.t < 0.6 && cat.frozen <= 0) {
    dirHist.length = 0; cat.spinT = 0.45; SFX.spin(); addGesture('SPIN');
    for (let i = 0; i < 8; i++) addPart(cat.x, cat.y - 14, rnd(-120, 120), rnd(-120, 0), 0.4, '#5ff3dc', 3);
  }
}
function endUtterance() {
  const list = utter.slice(); utter = []; stillT = 0; autoEnd = -1;
  if (!list.length) return;
  SFX.meow(); attempts++;
  addPart(cat.x + cat.face * 16, cat.y - 44, 0, -40, 1.0, '#ffffff', 16, 'text', 'mrrp!');
  if (S.musicT > 0) {
    SFX.huh(); setSub('Translation: "♪ ♪ ♪"', '→ WHAT?! CAN\'T HEAR YOU OVER THE MUSIC!', 'Try again when the polka ends.');
    robot.mood = -1; return;
  }
  translate(list);
}

  ctx.fillStyle = '#6cc26a'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(840 + i * 24, 228 - i * 4, 10, 5, 0.4, 0, 7); ctx.fill(); }
  const by = 214 + Math.sin(now * 3) * 2 - (S.winOpen ? Math.abs(Math.sin(now * 6)) * 4 : 0);
  ctx.fillStyle = '#ff6f91'; ctx.beginPath(); ctx.ellipse(884, by, 10, 8, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(893, by - 6, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.moveTo(898, by - 7); ctx.lineTo(905, by - 5); ctx.lineTo(898, by - 3); ctx.fill();
  ctx.fillStyle = '#0f2530'; ctx.beginPath(); ctx.arc(895, by - 7, 1.6, 0, 7); ctx.fill();
  if (S.winOpen) {
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(818, 158, 110, 72);

  } else {

    ctx.fillStyle = '#e7ece9'; ctx.fillRect(818, 226, 110, 6);
  }
  ctx.fillStyle = '#d7e3df'; ctx.fillRect(803, 300, 140, 9);
  // vacuum dock
  ctx.fillStyle = '#3d4a50'; ctx.fillRect(868, 452, 34, 18);
  ctx.fillStyle = S.vacOn ? '#ff6f91' : '#8ce36b'; ctx.fillRect(880, 456, 10, 4);
  // bed
  if (S.bed) {
    fillRR(478, 444, 84, 26, 12, '#3f8fb6'); fillRR(486, 440, 68, 14, 8, '#9fd6ee');
    ctx.fillStyle = '#ffd34d'; ctx.fillRect(478, 458, 84, 3);
    fillRR(552, 424, 30, 16, 3, '#fff'); txt('$400', 567, 432, 10, '#0f2530');

}
function drawVacuum() {
  ctx.save(); ctx.translate(vac.x, FLOOR);

function drawPads() {

// ===== Draw: characters
function drawCat() {
  const c = cat;
  ctx.save(); ctx.translate(c.x, c.y);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 0, 18, 4, 0, 0, 7); ctx.fill();
  let sx = c.sx, sy = c.sy;
  if (c.crouch) { sx *= 1.15; sy *= 0.68; }
  if (c.spinT > 0) sx *= Math.cos((0.45 - c.spinT) / 0.45 * Math.PI * 4);
  ctx.scale(c.face * sx, sy);
  const run = c.onGround && Math.abs(c.vx) > 30 ? Math.sin(c.t * 18) : 0;
  const purr = c.frozen > 0 ? Math.sin(c.t * 40) * 0.8 : 0;
  // tail
  ctx.strokeStyle = '#f28c3a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-16, -16); ctx.quadraticCurveTo(-30, -22 + Math.sin(c.t * 4) * 4, -26, -38 + Math.sin(c.t * 3) * 3); ctx.stroke();
  // legs
  ctx.fillStyle = '#d9752e';
  ctx.fillRect(-13 + run * 3, -8, 6, 8); ctx.fillRect(7 - run * 3, -8, 6, 8);
  ctx.fillStyle = '#f28c3a';
  ctx.fillRect(-8 - run * 3, -8, 6, 8); ctx.fillRect(11 + run * 3, -8, 6, 8);
  // body
  ctx.beginPath(); ctx.ellipse(0, -15 + purr, 19, 11, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd9b0'; ctx.beginPath(); ctx.ellipse(3, -10 + purr, 11, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#c4612a'; for (let i = -1; i < 2; i++) ctx.fillRect(i * 7 - 2, -25 + purr, 3, 7);
  // head
  ctx.fillStyle = '#f28c3a'; ctx.beginPath(); ctx.arc(16, -26 + purr, 11, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8, -33); ctx.lineTo(9, -45); ctx.lineTo(16, -36); ctx.fill();
  ctx.beginPath(); ctx.moveTo(17, -36); ctx.lineTo(24, -45); ctx.lineTo(25, -32); ctx.fill();
  ctx.fillStyle = '#ff9fb6'; ctx.beginPath(); ctx.moveTo(10, -36); ctx.lineTo(11, -42); ctx.lineTo(14, -37); ctx.fill();
  ctx.fillStyle = '#ffd9b0'; ctx.beginPath(); ctx.ellipse(22, -22 + purr, 6, 4, 0, 0, 7); ctx.fill();
  // eye
  const blink = (Math.sin(c.t * 1.3) > 0.985 || c.frozen > 0 || c.eat > 0);
  ctx.fillStyle = '#10212a';
  if (blink) ctx.fillRect(18, -29 + purr, 6, 2);
  else { ctx.beginPath(); ctx.ellipse(21, -28 + purr, 2.6, 3.4, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(21, -30 + purr, 1.5, 1.5); }
  ctx.fillStyle = '#ff6f91'; ctx.fillRect(26, -24 + purr, 2.5, 2);
  ctx.restore();
}
function drawRobot() {
  const r = robot, bob = Math.sin(now * 3) * 3, dn = r.dance ? Math.sin(r.dance * 14) : 0;
  ctx.save(); ctx.translate(r.x, r.y + bob - Math.abs(dn) * 6); ctx.rotate(dn * 0.15);
  // hover glow
  ctx.fillStyle = 'rgba(95,243,220,.25)'; ctx.beginPath(); ctx.ellipse(0, 42 - bob, 22, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#5ff3dc'; ctx.fillRect(-8, 32, 16, 4);
  // antenna
  ctx.strokeStyle = '#a9bac2'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(0, -44); ctx.stroke();
  ctx.fillStyle = r.state === 'thinking' ? (Math.sin(now * 20) > 0 ? '#ffd34d' : '#ff6f91') : '#ff6f91';
  ctx.beginPath(); ctx.arc(0, -46, 4, 0, 7); ctx.fill();
  // arm (single)
  const f = r.face, ext = r.arm;
  const ang = r.dance ? -1.2 + Math.sin(r.dance * 10) * 0.8 : (r.carry ? -0.6 : 0.9 - ext * 1.7);
  const ax = f * 30, ay = 4, len = 22 + ext * 16;
  const ex = ax + f * Math.cos(ang) * len, ey = ay + Math.sin(ang) * len;
  ctx.strokeStyle = '#8fa2ab'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex + f * 7, ey - 5); ctx.moveTo(ex, ey); ctx.lineTo(ex + f * 7, ey + 5); ctx.stroke();
  if (r.carry === 'box') { ctx.fillStyle = '#c58b4b'; ctx.fillRect(ex - 18 + f * 10, ey - 34, 36, 28); }
  if (r.carry === 'bed') { fillRR(ex - 30 + f * 12, ey - 26, 60, 20, 8, '#3f8fb6'); }
  // body
  const bg = ctx.createRadialGradient(-10, -12, 4, 0, 0, 36);
  bg.addColorStop(0, '#f4f8fa'); bg.addColorStop(1, '#a9bac2');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, 33, 0, 7); ctx.fill();
  ctx.strokeStyle = '#7f939c'; ctx.lineWidth = 2; ctx.stroke();
  // screen
  fillRR(-22, -18, 44, 28, 7, '#10212a');
  ctx.save(); rr(-22, -18, 44, 28, 7); ctx.clip();
  if (r.state === 'thinking') {
    for (let i = 0; i < 3; i++) { ctx.fillStyle = '#5ff3dc'; ctx.globalAlpha = 0.3 + 0.7 * Math.max(0, Math.sin(now * 8 - i)); ctx.beginPath(); ctx.arc(-10 + i * 10, -6, 3.5, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(95,243,220,.7)'; ctx.fillRect(-18, 3, ((now * 30) % 36), 3);
  } else {
    ctx.strokeStyle = '#5ff3dc'; ctx.fillStyle = '#5ff3dc'; ctx.lineWidth = 2.5;
    const lx = f * 3;
    if (r.mood === -1) { ctx.beginPath(); ctx.moveTo(-12 + lx, -9); ctx.lineTo(-4 + lx, -5); ctx.moveTo(12 + lx, -9); ctx.lineTo(4 + lx, -5); ctx.stroke(); }
    else if (r.mood === 1 || r.dance) { ctx.beginPath(); ctx.arc(-8 + lx, -4, 4, Math.PI, 0); ctx.arc(8 + lx, -4, 4, Math.PI, 0); ctx.stroke(); }
    else if (Math.sin(now * 1.7) > 0.97) { ctx.fillRect(-11 + lx, -5, 7, 2); ctx.fillRect(5 + lx, -5, 7, 2); }
    else { ctx.fillRect(-11 + lx, -10, 6, 8); ctx.fillRect(5 + lx, -10, 6, 8); }
    ctx.beginPath(); ctx.arc(lx, 1, 5, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  ctx.restore();
  txt('v0.1', 0, 22, 9, '#5f7580');
  ctx.restore();
}

// ===== Draw: HUD
function wrapLines(s, maxW) {
  const words = s.split(' '), out = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); return out;
}
function drawHUD() {
  // goal panel
  if (level >= 0) {
    const L = LEVELS[level];
    const hint = attempts >= 4 ? L.hints[1] : attempts >= 2 ? L.hints[0] : '';
    fillRR(12, 10, 600, hint ? 72 : 50, 10, 'rgba(10,22,30,.82)');
    txt(`LEVEL ${level + 1}/5 · ${L.name}`, 24, 25, 14, '#5ff3dc', 'left');
    txt('GOAL: ' + L.goal, 24, 46, 15, '#e8f4f2', 'left');
    if (hint) txt('HINT: ' + hint, 24, 68, 13, '#ffd34d', 'left');
  } else {
    txt('CAT TRANSLATOR', 480, 58, 50, '#ffd34d');
    txt('You are the cat. The robot is trying its best.', 480, 96, 17, '#e8f4f2');
    txt('←/→ move · ↑/Space jump · ↓ crouch · Shift dash · ←→← fast = spin · stand still = say it', 480, 120, 13, '#9fc3cf');
    if (endBanner) txt('★ ALL 5 REQUESTS GRANTED — robot certified FLUENT-ISH ★', 480, 24, 16, '#8ce36b');
  }
  // AI tag
  const live = aiLive();
  fillRR(W - 122, 10, 110, 26, 13, live ? 'rgba(95,243,220,.2)' : 'rgba(10,22,30,.82)');
  txt(live ? 'AI: live' : 'AI: scripted', W - 67, 23, 14, live ? '#5ff3dc' : '#9fc3cf');
  // utterance strip
  fillRR(10, 480, 312, 54, 10, 'rgba(10,22,30,.85)');
  for (let i = 0; i < 5; i++) {
    const x = 18 + i * 52, u = utter[i];
    fillRR(x, 486, 46, 42, 7, u ? 'rgba(95,243,220,.18)' : 'rgba(255,255,255,.05)');
    if (u) {
      const pop = Math.max(0, 1 - u.t * 6) * 0.4;
      glyph(u.g, x + 23, 501, 26 * (1 + pop), '#5ff3dc');
      txt(u.g.startsWith('DASH') ? (u.toward ? 'WANT' : 'NO') : GLABEL[u.g], x + 23, 520, 10, '#e8f4f2');
    }
  }
  // wait ring
  const wx = 296, wy = 507;
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(wx, wy, 13, 0, 7); ctx.stroke();
  if (utter.length) { ctx.strokeStyle = robot.state === 'idle' ? '#ffd34d' : '#ff6f91'; ctx.beginPath(); ctx.arc(wx, wy, 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, stillT)); ctx.stroke(); }
  glyph('WAIT', wx, wy, 14, utter.length ? '#ffd34d' : 'rgba(255,255,255,.3)');
  txt(utter.length ? (robot.state === 'idle' ? 'hold still…' : 'robot busy…') : 'say something!', 166, 474, 12, '#9fc3cf');
  // near label
  const nn = lastNear ? OBJ_NAME[lastNear.id] : 'NOTHING';
  fillRR(cat.x - 44, cat.y - 74, 88, 18, 9, 'rgba(10,22,30,.6)');
  txt('near: ' + nn, cat.x, cat.y - 65, 11, lastNear ? '#ffd34d' : '#9fc3cf');
  // subtitle box
  fillRR(330, 480, 620, 54, 10, 'rgba(10,22,30,.9)');
  ctx.strokeStyle = 'rgba(95,243,220,.5)'; ctx.lineWidth = 1.5; rr(330, 480, 620, 54, 10); ctx.stroke();
  ctx.font = '18px "VT323", monospace';
  let budget = Math.floor(sub.n);
  const lines = [[sub.l1, '#5ff3dc'], [sub.l2, '#e8f4f2'], [sub.l3, '#ffd34d']].filter(l => l[0]);
  let y = 491;
  for (const [s, c] of lines) {
    const shown = s.slice(0, Math.max(0, budget)); budget -= s.length;
    ctx.font = '18px "VT323", monospace';
    let fs = 18; while (ctx.measureText(s).width > 600 && fs > 12) { fs--; ctx.font = fs + 'px "VT323", monospace'; }
    ctx.fillStyle = c; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(shown, 340, y);
    y += 16;
  }
}
function drawBook() {
  if (!showBook) return;
  const x = 200, y = 150, w = 560, h = 300;
  fillRR(x, y, w, h, 14, 'rgba(16,33,42,.96)'); ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3; rr(x, y, w, h, 14); ctx.stroke();
  txt('PHRASEBOOK — how to speak Cat (to a robot)', 480, y + 24, 18, '#ffd34d');
  const rows = [['JUMP', 'JUMP', 'UP · HIGH · excited'], ['CROUCH', 'CROUCH', 'DOWN · FOOD · calm'], ['DASHR', 'DASH toward a thing', 'WANT · open · bring'],
    ['DASHL', 'DASH away from it', 'NO · STOP · close'], ['SPIN', 'SPIN (←→← fast)', 'PLEASE · URGENT!'], ['WAIT', 'STAND STILL 1s', 'end of sentence (max 5 words)']];
  rows.forEach((r, i) => {
    const ry = y + 60 + i * 34;
    fillRR(x + 20, ry - 15, 36, 30, 6, 'rgba(95,243,220,.15)'); glyph(r[0], x + 38, ry, 22, '#5ff3dc');
    txt(r[1], x + 70, ry, 15, '#e8f4f2', 'left'); txt('= ' + r[2], x + 270, ry, 15, '#9fc3cf', 'left');
  });
  txt('WHERE you stand is what you talk about. Stand by the window, jump: "UP. WINDOW."', 480, y + h - 28, 13, '#ffd34d');
}
function drawParts() {
  for (const p of parts) {
    const a = Math.min(1, p.l / p.ml * 1.5); ctx.globalAlpha = a;
    if (p.kind === 'text') txt(p.txt, p.x, p.y, p.s, p.c);
    else if (p.kind === 'note') txt('♪', p.x, p.y, p.s, p.c);
    else if (p.kind === 'heart') txt('♥', p.x, p.y, p.s * 2, p.c);
    else if (p.kind === 'conf') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    else { ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  }
  ctx.globalAlpha = 1;
}
function draw() {
  ctx.save();
  if (shakeT > 0) { const m = (RM ? 1.5 : 6) * Math.min(1, shakeT * 6); ctx.translate(rnd(-m, m), rnd(-m, m)); }
  if (S.musicT > 0 && !RM) ctx.translate(0, Math.sin(now * 39) * 1.2);
  drawRoom(); drawPads(); drawVacuum();
  // highlight nearest object
  if (lastNear && canTalk()) {
    const o = objects().find(q => q.id === lastNear.id);
    ctx.strokeStyle = 'rgba(255,211,77,.7)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.x, o.y - (o.id === 'vacuum' ? 6 : 0), 28 + Math.sin(now * 5) * 2, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  drawRobot(); drawCat(); drawBox(); drawParts();
  if (S.darkT > 0) {
    ctx.fillStyle = 'rgba(3,6,14,.86)'; ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.arc(cat.x + cat.face * 21, cat.y - 28, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#5ff3dc'; ctx.fillRect(robot.x - 11, robot.y - 10, 6, 8); ctx.fillRect(robot.x + 5, robot.y - 10, 6, 8);
    txt('(lights off — motion sensor in ' + Math.ceil(S.darkT) + ')', 480, 260, 14, '#5f7580');
  }
  ctx.restore();
  drawHUD(); drawBook();
  if (won) {
    const s = 1 + Math.max(0, 0.4 - winT) * 1.5;
    ctx.save(); ctx.translate(480, 230); ctx.scale(s, s);
    txt('REQUEST GRANTED!', 0, 0, 48, '#0f2530'); txt('REQUEST GRANTED!', -3, -3, 48, '#8ce36b');
    ctx.restore();
  }
  if (fadeT > 0) { ctx.fillStyle = `rgba(11,24,32,${clamp(fadeT / 0.5, 0, 1)})`; ctx.fillRect(0, 0, W, H); }
}

// ===== Main loop
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); draw();
  requestAnimationFrame(frame);
}
loadLevel(-1);
requestAnimationFrame(frame);
</script>
