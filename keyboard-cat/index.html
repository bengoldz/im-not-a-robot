<title>Keyboard Cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0b1217;
  --ink:#e9f1f4;
  --btn:rgba(233,241,244,.10);
  --btn-on:rgba(255,207,63,.35);
  --btn-edge:rgba(233,241,244,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Lilita One','Trebuchet MS',system-ui,sans-serif}
#game{display:block;background:var(--bg);max-width:100%;max-height:100%}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:10px 12px;pointer-events:none}
#touch .grp{display:flex;gap:10px;pointer-events:auto}
#touch button{width:62px;height:62px;border-radius:14px;border:2px solid var(--btn-edge);background:var(--btn);color:var(--ink);font:18px 'Lilita One','Trebuchet MS',sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch button.on{background:var(--btn-on)}
@media (pointer:coarse){#touch{display:flex}}
</style>
<canvas id="game" width="960" height="540" aria-label="Keyboard Cat game"></canvas>
<div id="touch">
  <div class="grp"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
  <div class="grp"><button data-k="dash">DASH</button><button data-k="down">&#9660;</button><button data-k="up">&#9650;</button></div>
</div>
<script>
// ===== Setup =====
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit); fit();
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const MONO = "VT323, 'Courier New', monospace";
const DISP = "'Lilita One', 'Trebuchet MS', sans-serif";
const COL = {
  wall: '#132029', wall2: '#0b141a', caseTop: '#1f2d37', caseFront: '#17222a',
  keyTop: '#dfe8ee', keySide: '#8ea3b2', legend: '#1b2a35',
  enter: '#ff5d73', enterSide: '#b33449', bk: '#ffcf3f', bkSide: '#b8901a',
  mod: '#7fd1c7', modSide: '#468f86',
  screen: '#06120c', phos: '#7dff9a', phosDim: '#3f8f5a', err: '#ff6b6b', ok: '#ffd23f', inp: '#e6fff0',
  bezel: '#25333e', robot: '#5d7c94', robotDark: '#3b5266', robotLite: '#86a6bd', phones: '#ffcf3f',
  cat: '#ff9a3c', catDark: '#d1661a', catBelly: '#ffe3c4', note: '#ffe066', wood: '#4a3b30', woodTop: '#7a624f',
  bug: '#3ddc84', bugDark: '#1f8a50', coffee: '#6b3f1f'
};

// ===== Audio =====
let AC = null;
function audioOn() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', v = 0.06, slide = 0, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v = 0.08, hp = 2000, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, n = Math.floor(AC.sampleRate * d), b = AC.createBuffer(1, n, AC.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'highpass'; f.frequency.value = hp; g.gain.value = v;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
}
const sfx = {
  click: (p = 1) => { noise(0.03, 0.12, 3000); tone(900 * p, 0.03, 'square', 0.03); },
  thock: () => { noise(0.05, 0.1, 600); tone(140, 0.08, 'sine', 0.1); },
  enter: () => { noise(0.06, 0.14, 500); tone(220, 0.1, 'square', 0.05, -100); },
  back: () => { tone(500, 0.06, 'square', 0.04, -300); },
  jump: () => tone(380, 0.09, 'square', 0.03, 300),
  dash: () => noise(0.12, 0.06, 1200),
  bonk: () => { tone(160, 0.15, 'sawtooth', 0.06, 300); noise(0.05, 0.1, 800); },
  error: () => { tone(110, 0.25, 'sawtooth', 0.06); tone(104, 0.25, 'sawtooth', 0.05); },
  ok: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.12, 'square', 0.04, 0, i * 0.07)),
  eat: () => [700, 900, 1200].forEach((f, i) => tone(f, 0.06, 'triangle', 0.07, 0, i * 0.05)),
  meow: () => { tone(620, 0.35, 'sawtooth', 0.05, 400); tone(900, 0.3, 'triangle', 0.04, -350, 0.12); },
  pop: () => { noise(0.15, 0.08, 400); tone(rnd(300, 900), 0.12, 'triangle', 0.04, -200); },
  squelch: () => tone(90, 0.2, 'sine', 0.1, 60),
  bug: () => tone(1400, 0.04, 'square', 0.02, -600),
  win: () => [392, 523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.2, 'square', 0.05, 0, i * 0.1)),
};

// ===== Input =====
const inp = { left: false, right: false, up: false, down: false, dash: false };
let jumpEdge = false, dashEdge = false;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', Space: 'up', ArrowDown: 'down', KeyS: 'down', ShiftLeft: 'dash', ShiftRight: 'dash' };
function setInput(k, v) {
  if (k === 'up' && v && !inp.up) jumpEdge = true;
  if (k === 'dash' && v && !inp.dash) dashEdge = true;
  inp[k] = v;
}
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; audioOn();
  if (k) { e.preventDefault(); if (!e.repeat) setInput(k, true); }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); setInput(k, false); } });
window.addEventListener('blur', () => { for (const k in inp) inp[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); audioOn(); setInput(k, true); b.classList.add('on'); };
  const off = e => { e.preventDefault(); setInput(k, false); b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});

// ===== Live AI =====
let sample = null;
(async () => {
  try { if (window.claude && window.claude.use) sample = await window.claude.use("sample"); } catch (e) { sample = null; }
})();
let aiBusy = false, aiDisabled = false, aiOn = false;
const AI_OFF_CODES = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
async function askAI(prompt, fallback) {
  if (!sample || aiDisabled || aiBusy) return fallback();
  aiBusy = true;
  try {
    const { text } = await sample(prompt, { modelTier: "quick", cache: false });
    return (text || "").trim() || fallback();
  } catch (e) {
    if (AI_OFF_CODES.includes(e && e.code)) aiDisabled = true;
    return fallback();
  } finally { aiBusy = false; }
}
const aiLive = () => aiOn && !!sample && !aiDisabled;
async function askAIJSON(prompt) {
  if (!sample || aiDisabled || aiBusy) return null;
  aiBusy = true;
  const opts = { modelTier: "quick", cache: false };
  const call = (async () => {
    try {
      if (typeof sample.json === 'function') return await sample.json(prompt, opts);
      const { text } = await sample(prompt, opts); return text;
    } catch (e) {
      if (AI_OFF_CODES.includes(e && e.code)) aiDisabled = true;
      return null;
    } finally { aiBusy = false; }
  })();
  const r = await Promise.race([call, new Promise(res => setTimeout(() => res(null), 7000))]);
  return validateAI(r);
}
function validateAI(r) {
  try {
    let o = r;
    if (o == null) return null;
    if (typeof o === 'object' && !Array.isArray(o) && !('effects' in o)) {
      if (o.json) o = o.json; else if (o.data) o = o.data; else if (o.object) o = o.object; else if (typeof o.text === 'string') o = o.text;
    }
    if (typeof o === 'string') { const m = o.match(/\{[\s\S]*\}/); if (!m) return null; o = JSON.parse(m[0]); }
    if (!o || typeof o !== 'object') return null;
    const effects = Array.isArray(o.effects) ? o.effects.map(s => String(s).toUpperCase().trim()).filter(s => EFFECTS.includes(s)).slice(0, 2) : [];
    const says = typeof o.robot_says === 'string' ? o.robot_says.replace(/\s+/g, ' ').trim().slice(0, 70) : '';
    return { effects: [...new Set(effects)], says };
  } catch (e) { return null; }
}

// ===== Writing (scripted lines) =====
const ERRORS = [
  'SyntaxError: unexpected "{x}". Expected: work.',
  'TypeError: "{x}" is not a function. Nor is this meeting.',
  'ReferenceError: {x} is not defined. Nor is my patience.',
  'Error 418: I am a teapot. You are a cat.',
  'Warning: paw detected in production.',
  'LintError: too many cats (max: 0).',
  'Segfault: furball in sector 7.',
  'CompileError: "{x}" looks like you sat on it.',
  'NullPointerException: pointer was a laser. Cat chased it.',
  'Fatal: merge conflict with a tail.',
  'Deprecated: keysmash API v1. Use v2 (louder).',
  'StackOverflow: of cat hair.',
  'UnhandledPromise: "will do it after nap".',
  'TimeoutError: meeting ran 40 min over.',
  'PermissionDenied: cats are not in sudoers.',
  'ParseError: "{x}" is not JS, English or Klingon.',
  'InfiniteLoop: purr purr purr purr purr purr...',
  'Error: expected semicolon, got whisker.',
  '404: meaning of "{x}" not found.',
  'TypeError: cannot read property "fish" of undefined.',
  'BuildFailed: 1 error, 9 lives remaining.',
  'Warning: unused variable "{x}". Like my gym pass.',
  'RuntimeError: robot.patience < 0',
  'SyntaxError: unterminated mrrrrow.',
  'Error: "{x}" violates the Geneva Code Conventions.',
  'Notice: output sent to /dev/null. Efficient.',
  'IndentationError: you stood on Tab. There is no Tab.',
  'Warning: "{x}" smells like tuna. Rejected.',
];
const SHRUG = [
  'I do not know what that is. Neither do you.', 'Was that code or a nap position?', "Filing that under 'won't fix'.",
  'Please stop compiling your feelings.', 'My linter is crying. Thanks.', 'Bold. Wrong, but bold.',
  'That is not a command. That is a sneeze.', 'Ah yes, the classic paw-driven development.', 'Even Perl would reject that.',
  'Is that a variable or a hairball?', 'Please. I am in a meeting.', 'Compiler says no. I say no. Chorus of no.',
  'Try words. Real ones. Like FISH.', 'You typed with your elbow. Cats have elbows?', 'I will escalate this to HR. (Hairball Resources)',
  'I am muting your keyboard privileges.',
];
const BONK = [
  'Please. I am in a meeting.', 'That key was reserved for my finger.', 'Excuse me. This desk is booked.',
  'You are on mute. Also on my keys.', 'Sorry, everyone. The cat says hi.', 'Can you not stand on the S key? Thank you.',
  'Hot desking ended in 2023.', 'Paws off the production keyboard.', 'I have to type. It is my whole personality.',
];
const BUSY = [
  'Can everyone see my screen? It has a cat on it.', 'I am presenting. Please stop walking on the slides.',
  'Let us take this offline. Offline means off my desk.', 'Who invited the cat to standup?', 'Per my last email: no cats.',
  'Small request: fewer paws, more semicolons.',
];
const IDLE = [
  'Quick sync? No. Never mind.', 'My calendar is 98% meetings, 2% cat.', 'Circling back to the circle back.',
  'I could have been a toaster. Simpler life.', 'Sprint velocity: one cat per hour.', 'Coffee level: critical.',
];
const DONE = [
  'Ticket closed. Do not reopen it with your paw.', 'LGTM. Looks Good To Meow.', 'I will take credit for that at standup.',
  'Fine. Merged. Do not tell QA.', 'Approved. Reluctantly. With a sigh.', 'That worked? Write a postmortem anyway.',
];
const HELLO = [
  'AI uplink engaged. My sarcasm is now cloud-based.', 'Neural net online. It mostly thinks about fish now.',
  'AI mode. I will now misunderstand you creatively.', 'Brain upgraded. Cat still not approved.',
];
const EFFECT_LINES = {
  JUMP: 'Jump buffer increased. Like your ego.', BIG: 'Scaling cat horizontally. And vertically. Help.',
  SMALL: 'Cat minified. 40% smaller bundle.', GRAVITY: 'Gravity patched. It was a feature.', FLOAT: 'Gravity set to optional.',
  FISH: 'Fish instantiated. Please do not eat the build.', BUG: 'Why would you write bugs ON PURPOSE.',
  FIX: 'Bugs fixed. By which I mean deleted.', FLIP: 'Rotating the monitor. For accessibility.',
  FAST: 'Cat.speed++. Regret.speed++.', SLOW: 'Time dilation enabled. Meetings feel normal now.',
  NAP: 'Cat process suspended. Finally, focus.', MEOW: 'MEOW compiled to fireworks. As spec says.',
  COFFEE: 'COFFEE ACQUIRED. TYPING AT 400 WPM.', DELETE: 'Deleted a row. Oops. It had friends.', SHIP: 'Shipping is not a vibe. It is a ticket.',
};
const EMPTY = ['Nothing to compile. Like my social life.', 'Empty commit. Very minimalist.', 'You pressed Enter on nothing. Respect.'];
const PHRASES = ['synergy;', 'lgtm', 'todo later', 'circle back;', 'per my email', 'ping', 'standup', 'okr', 'hi team;',
  'sudo make it work', 'tabs not spaces', 'rewrite it', 'brb', 'kpi;', 'ok', 'console.log', 'ask legal', 'quick win', 'deadline', 'yes and'];

// ===== Keyboard world =====
const ROW_Y = { q: 255, a: 325, z: 395, sp: 465 };
let plats = [], keysArr = [], pads = [];
function mkKey(ch, label, x, y, w, row, kind) {
  const k = { ch, label, x, y, w, row, kind: kind || 'alpha', anim: 0, hold: 0, cool: 0, sticky: false, gone: 0, key: true };
  keysArr.push(k); plats.push(k); return k;
}
function buildKeyboard() {
  plats = []; keysArr = []; pads = [];
  'qwertyuiop'.split('').forEach((c, i) => mkKey(c, c.toUpperCase(), 24 + i * 74, ROW_Y.q, 66, 'q'));
  mkKey('\b', 'BKSP', 764, ROW_Y.q, 120, 'q', 'bk');
  'asdfghjkl;'.split('').forEach((c, i) => mkKey(c, c.toUpperCase(), 46 + i * 74, ROW_Y.a, 66, 'a', c === ';' ? 'mod' : 'alpha'));
  mkKey('\n', 'ENTER', 786, ROW_Y.a, 140, 'a', 'enter');
  'zxcvbnm,.'.split('').forEach((c, i) => mkKey(c, c.toUpperCase(), 80 + i * 74, ROW_Y.z, 66, 'z', ',.'.includes(c) ? 'mod' : 'alpha'));
  plats.push({ x: 0, y: ROW_Y.sp, w: 214, floor: true });
  mkKey(' ', '', 220, ROW_Y.sp, 520, 'sp', 'space').floor = true;
  plats.push({ x: 746, y: ROW_Y.sp, w: 214, floor: true });
  plats.push({ x: 770, y: 125, w: 160, shelf: true });
}
function buildStartRoom() {
  plats = []; keysArr = []; pads = [];
  plats.push({ x: 0, y: ROW_Y.sp, w: W, floor: true });
  const mk = (id, label, x) => { const p = { id, label, x, y: 405, w: 170, pad: true, anim: 0 }; pads.push(p); plats.push(p); };
  mk('ai', 'AI', 120); mk('start', 'START', 395); mk('help', 'HELP', 670);
}
const keyFor = ch => keysArr.find(k => k.ch === ch);

// ===== Game state =====
let mode = 'title';         // 'title' | 'play'
let ticket = 0, transition = 0, playTime = 0, bestTime = null, lastWin = null, helpOn = false;
try { const b = parseFloat(localStorage.getItem('keyboardcat.best')); if (b > 0) bestTime = b; } catch (e) {}
const fx = { jump: 0, big: 0, small: 0, float: 0, flip: 0, fast: 0, slow: 0, nap: 0, coffee: 0, del: 0, delRow: null };
let bugs = [], fishes = [], parts = [], shake = 0, bugSpawnT = 0, compiling = false, catPressCount = 0, busyCD = 0;
const ed = { hist: [], line: '', max: 44, blink: 0 };
const bubble = { text: '', t: 0 };
function say(text, dur = 4) { bubble.text = String(text).slice(0, 90); bubble.t = dur; robot.talk = dur; }
function histPush(t, c) { ed.hist.push({ t: String(t).slice(0, 50), c }); while (ed.hist.length > 5) ed.hist.shift(); }

// ===== Typing & parser =====
function typeChar(c) {
  if (c === '\b') { ed.line = ed.line.slice(0, -1); sfx.back(); return; }
  if (c === '\n') { submit(); return; }
  ed.line += c; if (ed.line.length > ed.max) ed.line = ed.line.slice(-ed.max);
  ed.blink = 0;
}
const EFFECTS = ['JUMP', 'BIG', 'SMALL', 'GRAVITY', 'FLOAT', 'FISH', 'BUG', 'FIX', 'FLIP', 'FAST', 'SLOW', 'NAP', 'MEOW', 'COFFEE', 'DELETE', 'SHIP'];
function lev(a, b) {
  const m = a.length, n = b.length, d = [];
  for (let i = 0; i <= m; i++) { d[i] = [i]; }
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
  {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[m][n];
}
function fuzzyHas(text, word) {
  if (text.includes(word)) return true;
  if (word.length < 4) return false;
  for (let L = word.length - 1; L <= word.length + 1; L++)
    for (let i = 0; i + L <= text.length; i++) if (lev(text.substr(i, L), word) <= 1) return true;
  return false;
}
const collapse = s => s.replace(/(.)\1+/g, '$1');
function parseLine(line) {
  const t = line.toLowerCase().replace(/[^a-z]/g, ''), tc = collapse(t);
  const out = [];
  for (const e of EFFECTS) {
    const w = e.toLowerCase(), wc = collapse(w);
    if (fuzzyHas(t, w) || (wc.length >= 3 && (wc.length >= 4 ? fuzzyHas(tc, wc) : tc.includes(wc)))) out.push(e);
  }
  // SMALL vs BIG / FLOAT vs GRAVITY: keep the more literal match only once
  if (out.includes('BIG') && out.includes('SMALL')) out.splice(out.indexOf('BIG'), 1);
  return out;
}
function submit() {
  sfx.enter();
  if (mode !== 'play' || transition > 0) return;
  const line = ed.line.trim(); ed.line = '';
  histPush('> ' + line, COL.inp);
  if (!line) { histPush('// nothing to compile', COL.phosDim); say(pick(EMPTY)); return; }
  const det = parseLine(line);
  if (aiLive() && !compiling && !aiBusy) {
    compiling = true; say('...', 8);
    const tk = TICKETS[ticket];
    const prompt = `You are the compiler brain of a deadpan robot programmer. A cat walked across the keyboard and typed: "${line.slice(0, 60)}". Current ticket: "${tk.title} ${tk.body}". Available effects: ${EFFECTS.join(', ')}. Interpret the typing creatively (typos, sounds-like, vibes, e.g. "fsihh" -> FISH, "zzzz" -> NAP, "boing" -> JUMP). Pick 0-2 effects from the list only. Reply ONLY JSON: {"effects":["NAME"],"robot_says":"deadpan reaction, max 70 chars"}`;
    askAIJSON(prompt).then(r => { compiling = false; finishCompile(line, det, r); });
  } else finishCompile(line, det, null);
}
function finishCompile(line, det, ai) {
  if (mode !== 'play') return;
  const eff = [...det];
  if (ai) for (const e of ai.effects) if (!eff.includes(e)) eff.push(e);
  const list = eff.slice(0, 4);
  if (list.length) {
    histPush('OK ' + list.map(e => e.toLowerCase() + '()').join(' '), COL.ok);
    sfx.ok();
    say((ai && ai.says) || EFFECT_LINES[list[list.length - 1]] || pick(SHRUG));
    list.forEach(applyEffect);
  } else {
    const x = line.replace(/\s+/g, '').slice(0, 10);
    histPush(pick(ERRORS).replace('{x}', x), COL.err);
    sfx.error(); shakeIt(4);
    say((ai && ai.says) || pick(SHRUG));
  }
}

// ===== Effects =====
function applyEffect(e) {
  switch (e) {
    case 'JUMP': fx.jump = 20; break;
    case 'BIG': fx.big = 20; fx.small = 0; break;
    case 'SMALL': fx.small = 20; fx.big = 0; break;
    case 'GRAVITY': case 'FLOAT': fx.float = 20; break;
    case 'FISH': spawnFish(); break;
    case 'BUG': for (let i = 0; i < 3; i++) spawnBug(); break;
    case 'FIX': {
      const n = bugs.length;
      bugs.forEach(b => burst(b.x, b.y - 6, COL.bug, 14));
      bugs = [];
      if (n === 0) histPush('// 0 bugs found. Suspicious.', COL.phosDim);
      else histPush(`// fixed ${n} bug${n > 1 ? 's' : ''} (deleted them)`, COL.phosDim);
      if (ticket === 1 && n > 0) ticketDone();
      break;
    }
    case 'FLIP': fx.flip = 10; break;
    case 'FAST': fx.fast = 15; fx.slow = 0; break;
    case 'SLOW': fx.slow = 10; fx.fast = 0; break;
    case 'NAP': fx.nap = 4.5; break;
    case 'MEOW': sfx.meow(); fireworks(); break;
    case 'COFFEE':
      fx.coffee = 20; robot.mug = 1;
      if (ticket === 3) { keysArr.forEach(k => k.sticky = false); ticketDone(); }
      break;
    case 'DELETE': {
      const rows = ['q', 'a', 'z'];
      const onRow = cat.ground && cat.ground.row;
      fx.delRow = rows.includes(onRow) && Math.random() < 0.7 ? onRow : pick(rows);
      fx.del = 8;
      keysArr.forEach(k => { if (k.row === fx.delRow) { k.gone = 8; burst(k.x + k.w / 2, k.y + 10, COL.keySide, 3); } });
      sfx.pop(); shakeIt(6);
      break;
    }
    case 'SHIP':
      if (ticket === 4) ticketDone();
      else histPush('// ship blocked: ticket #' + (ticket + 1) + ' still open', COL.phosDim);
      break;
