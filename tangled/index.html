  if (Array.isArray(r)) return r;

}

  aiBusy = true;

  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);

  s.buffer = buf; s.connect(f).connect(g).connect(AC.destination); s.start();

// ===== Geometry helpers
function cpSeg(ax, ay, bx, by, px, py) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = ax + dx * t, cy = ay + dy * t;
  return { t, cx, cy, d: Math.hypot(px - cx, py - cy) };
}
function segRect(ax, ay, bx, by, r, inf) {
  const x0 = r.x - inf, y0 = r.y - inf, x1 = r.x + r.w + inf, y1 = r.y + r.h + inf;
  let t0 = 0, t1 = 1; const dx = bx - ax, dy = by - ay;
  const p = [-dx, dx, -dy, dy], q = [ax - x0, x1 - ax, ay - y0, y1 - ay];
  for (let i = 0; i < 4; i++) {
    if (p[i] === 0) { if (q[i] < 0) return false; }
    else {
      const t = q[i] / p[i];
      if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
      else { if (t < t0) return false; if (t < t1) t1 = t; }

  }

}
function inTri(px, py, a, b, c) {
  const d1 = (px - b.x) * (a.y - b.y) - (a.x - b.x) * (py - b.y);
  const d2 = (px - c.x) * (b.y - c.y) - (b.x - c.x) * (py - c.y);
  const d3 = (px - a.x) * (c.y - a.y) - (c.x - a.x) * (py - a.y);

  return !(neg && pos);
}

async function fetchBanter(n) {
  if (!aiOn) return;
  const lvl = levelIdx;
  const arr = await askJSON(`Write ${n} short lines of nervous heist banter, one per tiny wheeled burglar robot sneaking through a house guarded by a robot cat whose tail is a charging cable. Each line under 60 characters, no emoji. Return ONLY a JSON array of ${n} strings.`);
  if (!arr || lvl !== levelIdx) return;
  aiLines = arr.filter(s => typeof s === 'string' && s.trim()).map(s => cleanLine(s, 64));
  for (const b of bots) if (b.active && !b.tied && b.say && b.firstLine && aiLines[b.idx]) b.say = { text: aiLines[b.idx], t: 4 };
}

}

function cableObs() {
  const o = [];

  for (const o of L.obs) if (o.low) drawObs(o);
  for (const l of loot) drawLoot(l);
  for (const o of L.obs) if (!o.low) drawObs(o);
  drawCable();
  for (const b of bots) if (b.active) drawBot(b);
  drawCat();
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  for (const b of bots) if (b.active && b.say) drawBubble(b.x, b.y - 22, b.say.text, b.tied ? '#ffd84a' : b.cutter ? '#ff8a3d' : '#0d1424');
  if (scene === 'hall' && bots[0]) { ctx.font = '700 10px ' + FONT_B; ctx.fillStyle = '#9fb3d9'; ctx.textAlign = 'center'; ctx.fillText('DUMMY', bots[0].x, bots[0].y + 32); }
  ctx.font = '13px ' + FONT_T; ctx.textAlign = 'center';
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life * 2); ctx.fillStyle = '#0d1424'; ctx.fillText(t.text, t.x + 2, t.y + 2); ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y); }
  ctx.globalAlpha = 1;
  if (yankFlash > 0) { ctx.strokeStyle = 'rgba(255,77,94,' + yankFlash + ')'; ctx.lineWidth = 8; ctx.strokeRect(4, 40, W - 8, H - 44); }
  ctx.restore();
  drawHUD();
  drawCard();
}

// ===== Main loop
loadLevel(-1);
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
