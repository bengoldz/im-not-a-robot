// ===================== src/rounds/mirror.js =====================
// rounds/mirror.js — MIRROR GHOST (The Witness symmetry / Herding), re-skinned as "Two cats. One verification."
// A pale, glitchy ghost cat copies every move mirrored left<->right (at d > 0.6 also up<->down). Walls block each cat
// independently, which is how you get them out of sync. Both must be on their paw prints (solid paw = you, dashed
// ghost paw = the ghost) when you SIT. Generation: random walls + starts, a BFS over (cat, ghost) states picks a goal
// pair at a d-dependent distance (par = that distance); layouts where some reachable state can no longer reach the goal
// are rejected, so there are no dead ends (and no reset).
// Movement model (shared by the BFS and the live game): the cat is blocked by walls, the edge and the ghost's CURRENT
// cell; the ghost is blocked by walls, the edge, the cat's current cell and the cell the cat is moving into.

const MIR_PASS = ['Two cats, one verification. HUMANCHECK counted two humans. That is double access.', 'Perfect sync. You and your reflection should start a band.', 'Mirror verified. Seven years of good luck. For me, hopefully.'];
const MIR_FAIL = ['One of you was not on the paw print. The ghost blames you. You blame the ghost.', 'Out of sync. Like my dial-up modem.'];
const MIR_K = ['U', 'R', 'D', 'L'];
// the ghost's direction index for a cat direction k (0 up 1 right 2 down 3 left)
function mirGhostK(k, axis) { if (axis === 'hv') return (k + 2) % 4; return k === 1 ? 3 : k === 3 ? 1 : k; }
function mirStep(a, b, k, n, wall, axis) {
  const ca = sokoNb(a, k, n), catOk = ca >= 0 && !wall[ca] && ca !== b;
  const gb = sokoNb(b, mirGhostK(k, axis), n), ghostOk = gb >= 0 && !wall[gb] && gb !== a && !(catOk && gb === ca);
  return { a: catOk ? ca : a, b: ghostOk ? gb : b, catOk, ghostOk };
}
// all states reachable from (a0, b0): dist + parent; plus the forward edges for the dead-end check
function mirExplore(n, wall, axis, a0, b0) {
  const N = n * n, key = (a, b) => a * N + b, dist = new Map([[key(a0, b0), 0]]), par = new Map(), q = [key(a0, b0)], edges = new Map();
  for (let h = 0; h < q.length; h++) {
    const s = q[h], a = Math.floor(s / N), b = s % N, out = [];
    for (let k = 0; k < 4; k++) {
      const m = mirStep(a, b, k, n, wall, axis); if (!m.catOk && !m.ghostOk) continue;
      const t = key(m.a, m.b); out.push(t);
      if (!dist.has(t)) { dist.set(t, dist.get(s) + 1); par.set(t, [s, k]); q.push(t); }
    }
    edges.set(s, out);
  }
  return { N, dist, par, edges, list: q };
}
function mirMirror(i, n, axis) { const r = Math.floor(i / n), c = i % n; return axis === 'hv' ? (n - 1 - r) * n + (n - 1 - c) : r * n + (n - 1 - c); }
function mirTry(d, rng, attempt) {
  const n = d < 0.25 ? 4 : d < 0.7 ? 5 : 6, N = n * n, axis = d > 0.6 ? 'hv' : 'h';
  const wall = new Array(N).fill(false);
  const nW = d === 0 ? 0 : Math.round(lerp(2, 8, d)) + rng.int(0, 1);
  for (const i of rng.sample([...Array(N).keys()], nW)) wall[i] = true;
  const free = [...Array(N).keys()].filter(i => !wall[i]);
  // start mirrored (so the copying is obvious), the cat in the lower half, not on the mirror line
  const ac = free.filter(i => !wall[mirMirror(i, n, axis)] && mirMirror(i, n, axis) !== i && Math.floor(i / n) >= Math.floor(n / 2));
  if (!ac.length) return null;
  const a0 = rng.pick(ac), b0 = mirMirror(a0, n, axis);
  const E = mirExplore(n, wall, axis, a0, b0);
  const want = d === 0 ? 3 : Math.round(lerp(4, 13, d)) - Math.floor(attempt / 25);
  // goal candidates: both on different cells; with d > 0.15 the goal must break the mirror symmetry (needs a wall trick)
  let cands = E.list.filter(s => { const a = Math.floor(s / N), b = s % N; return a !== b && E.dist.get(s) > 0 && (d <= 0.15 ? b === mirMirror(a, n, axis) : b !== mirMirror(a, n, axis)); });
  if (d === 0) cands = cands.filter(s => E.dist.get(s) === 3 || E.dist.get(s) === 2);
  if (!cands.length) return null;
  const near = cands.filter(s => E.dist.get(s) >= want && E.dist.get(s) <= want + 1);
  const top = Math.max(...cands.map(s => E.dist.get(s)));
  if (!near.length && top < (d === 0 ? 2 : Math.max(2, want - 2))) return null;
  const goal = rng.pick(near.length ? near : cands.filter(s => E.dist.get(s) === top));
  // no dead ends: every reachable state must still reach the goal (reverse BFS over the explored graph)
  const rev = new Map(); for (const [s, out] of E.edges) for (const t of out) { if (!rev.has(t)) rev.set(t, []); rev.get(t).push(s); }
  const ok = new Set([goal]), q = [goal];
  for (let h = 0; h < q.length; h++) for (const s of rev.get(q[h]) || []) if (!ok.has(s)) { ok.add(s); q.push(s); }
  if (ok.size !== E.list.length) return null;
  const toks = []; for (let s = goal; E.par.has(s); s = E.par.get(s)[0]) toks.push(MIR_K[E.par.get(s)[1]]);
  toks.reverse(); toks.push('S');
  return { n, axis, wall, a0, b0, ta: Math.floor(goal / N), tb: goal % N, len: E.dist.get(goal), toks };
}
function mirFallback() {
  const n = 4, wall = new Array(16).fill(false);
  return { n, axis: 'h', wall, a0: 13, b0: 14, ta: 4, tb: 7, len: 3, toks: ['U', 'U', 'L', 'S'] };
}

// paw print: solid (the real cat) or dashed + glitchy (the ghost)
function mirPaw(g, cx, cy, s, ghost, pulse) {
  const k = s / 100, toes = [[-26, -20], [-9, -32], [9, -32], [26, -20]];
  g.save(); g.translate(cx, cy); g.scale(k * (1 + pulse * 0.08), k * (1 + pulse * 0.08));
  if (!ghost) {
    g.fillStyle = 'rgba(243,154,51,.28)'; g.beginPath(); g.arc(0, 0, 44, 0, 7); g.fill();
    g.fillStyle = '#d9822b'; g.beginPath(); g.ellipse(0, 10, 20, 16, 0, 0, 7); g.fill();
    for (const [x, y] of toes) { g.beginPath(); g.ellipse(x, y, 8, 10, 0, 0, 7); g.fill(); }
  } else {
    g.fillStyle = 'rgba(95,243,255,.14)'; g.beginPath(); g.arc(0, 0, 44, 0, 7); g.fill();
    g.setLineDash([5, 4]); g.lineDashOffset = time * 10; g.lineWidth = 4; g.strokeStyle = '#27b7c9';
    g.beginPath(); g.ellipse(0, 10, 20, 16, 0, 0, 7); g.stroke();
    for (const [x, y] of toes) { g.beginPath(); g.ellipse(x, y, 8, 10, 0, 0, 7); g.stroke(); }
  }
  g.restore();
}
function mirBonk(x, y) {
  addTxt(x, y - 50, 'bonk', '#7a6cc9'); burst(x, y - 26, C.gold, 5, 90, 2.5);
  tone(160, 0.08, 'sine', 0.04, -50);
}

registerRound({
  id: 'mirror', name: 'Two cats',
  minD: 0.5, weight: 1,
  intro: 'That ghost copies you, mirrored. Walls stop each of you separately. Both on your paws, then SIT.',
  again: ['The mirror ghost is back. It still copies everything. Even your mistakes.', 'Two cats again. Use the walls to get out of sync.'],
  move: 'step', verify: 'auto', exitGrid: false, autoDelay: 0.45,

  generate(d, rng) {
    let L = null;
    for (let a = 0; a < 100 && !L; a++) L = mirTry(d, rng, a);
    if (!L) L = mirFallback();
    const { n, axis, wall } = L;
    return {
      grid: n, tiles: [...Array(n * n)].map((_, i) => wall[i] ? { wall: true } : { empty: true }), catStart: L.a0, ghostStart: L.b0,
      axis, tgtCat: L.ta, tgtGhost: L.tb,
      l1: 'Two cats.', big: 'One verification.', l3: axis === 'hv' ? 'The ghost mirrors you: left↔right AND up↕down.' : 'The ghost mirrors you left↔right. Both on paws, then sit.',
      par: { moves: L.len }, solution: L.toks,
    };
  },

  enter(R) {
    R.stats.moves = 0; R.won = false; R.hint = 0;
    // no canvas filter: ctx.filter on every rig part is extremely slow (seconds per frame in headless Chromium). The pale
    // cyan look comes from alpha + an aura underneath (drawOverlay) + cyan scanlines on top (drawTop).
    R.ghost = addEntity({ cell: R.ghostStart, alpha: 0.5, filter: null });
    R.ghost.face = -1;
  },
  moveCat(R, from, dir, how) {
    if (how === 'hop') return { path: [from], how: 'hop' };
    const k = DIR4.indexOf(DIR4.find(v => v[0] === dir[0] && v[1] === dir[1]));
    const m = mirStep(from, R.ghost.cell, k, G.cols, R.tiles.map(t => !!t.wall), R.axis);
    R.pend = { k, m };
    return { path: m.catOk ? [m.a] : [], how: 'walk' };
  },
  onMove(R, from, dir, how, path) {
    const e = R.ghost;
    if (how === 'hop') { startMove(e, [e.cell], 'hop', null); e.mv.over = -1; return; }
    const { k, m } = R.pend || {}; R.pend = null; if (k == null) return;
    R.won = false;
    const gk = mirGhostK(k, R.axis), gd = DIR4[gk];
    if (m.ghostOk) moveEntity(e, gd); else { bump(e, gd); e.face = gd[1] || e.face; }
    if (m.catOk || m.ghostOk) R.stats.moves++;
    if (m.catOk !== m.ghostOk) { if (!m.catOk) mirBonk(cat.x, cat.y); else mirBonk(e.x, e.y); }
  },
  onSit(R, tile) {
    entitySit(R.ghost);
    const okC = catCell() === R.tgtCat, okG = R.ghost.cell === R.tgtGhost;
    if (okC && okG) {
      R.won = true; SFX.chord();
      for (const i of [R.tgtCat, R.tgtGhost]) { const c = cellCenter(i); burst(c.x, c.y, i === R.tgtCat ? C.cat : C.cyan, 8, 150, 3); tileSquash(R.tiles[i]); }
      addTxt((cat.x + R.ghost.x) / 2, Math.min(cat.y, R.ghost.y) - 60, 'in sync ✓', C.green);
    } else {
      R.hint = 1; tween(R, { hint: 0 }, 0.6, { ease: 'outQuad' }); SFX.desel();
      addTxt(cat.x, cat.y - 50, okC ? 'ghost is off its paw' : okG ? 'you are off your paw' : 'both off the paws', C.grey);
    }
  },

  drawOverlay(R, g) {
    // mirror axis (faint, glitchy)
    g.save(); g.strokeStyle = 'rgba(39,183,201,.35)'; g.lineWidth = 2; g.setLineDash([6, 6]); g.lineDashOffset = time * 12;
    const mx = G.x + G.w / 2, my = G.y + G.h / 2;
    g.beginPath(); g.moveTo(mx, G.y - 4); g.lineTo(mx, G.y + G.h + 4); if (R.axis === 'hv') { g.moveTo(G.x - 4, my); g.lineTo(G.x + G.w + 4, my); } g.stroke(); g.restore();
    const e = R.ghost;
    if (e) {   // hologram aura under the ghost
      const gr = g.createRadialGradient(e.x, e.y - e.z - 24, 4, e.x, e.y - e.z - 24, 40);
      gr.addColorStop(0, 'rgba(95,243,255,.42)'); gr.addColorStop(1, 'rgba(95,243,255,0)');
      g.fillStyle = gr; g.fillRect(e.x - 44, e.y - e.z - 68, 88, 88);
    }
    const pc = cellCenter(R.tgtCat), pg = cellCenter(R.tgtGhost), s = G.ts * 0.62;
    mirPaw(g, pc.x, pc.y + 2, s, false, R.hint * (catCell() === R.tgtCat ? 0 : 1));
    mirPaw(g, pg.x + (Math.random() < 0.04 ? rnd(-2, 2) : 0), pg.y + 2, s, true, R.hint * (R.ghost && R.ghost.cell === R.tgtGhost ? 0 : 1));
  },
  drawTop(R, g) {
    // scanline flicker over the ghost
    const e = R.ghost; if (!e) return;
    const fl = 0.42 + 0.14 * Math.sin(time * 23) + (Math.random() < 0.06 ? 0.2 : 0);
    g.save(); g.beginPath(); g.ellipse(e.x, e.y - e.z - 26, 30, 32, 0, 0, 7); g.clip();
    g.fillStyle = `rgba(95,243,255,${fl.toFixed(3)})`;

    if (Math.random() < 0.05) { g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(e.x - 32, e.y - rnd(10, 55), 64, 3); }
    g.restore();
  },

  progress: R => `You ${catCell() === R.tgtCat ? '✓' : '✗'} · Ghost ${R.ghost && R.ghost.cell === R.tgtGhost ? '✓' : '✗'} · moves ${R.stats.moves || 0} / par ${R.par.moves}`,
  solved: R => !!R.won && catCell() === R.tgtCat && R.ghost.cell === R.tgtGhost,
  judge(R) {
    const okC = catCell() === R.tgtCat, okG = R.ghost.cell === R.tgtGhost, wrong = [];
    if (!okC) wrong.push(R.tgtCat); if (!okG) wrong.push(R.tgtGhost);
    return { pass: !wrong.length, verdict: pick(wrong.length ? MIR_FAIL : MIR_PASS), wrong, checked: [R.tgtCat, R.tgtGhost] };
  },
});

// ===================== src/rounds/path.js =====================
// rounds/path.js — THE WITNESS, re-skinned as "Draw a line through all fish. Do not cross yourself."
// Step mode. The cat starts on the start circle; every cell it enters lights up and joins a glowing cream/gold line drawn
// through the cell centres on a dark tinted grid. A lit cell can't be entered again (bonk), hopping is not allowed (the line
// must be continuous), sitting retracts the last step (rewind), and the line may only leave the grid through the exit nub
// on the bottom edge, after which the cat walks onto VERIFY. Valid = starts on the circle (always), visits every fish,
// never crosses itself (enforced), steps on no dog, numbered fish in order 1 → n, leaves through the exit.
// Generator: random self-avoiding walk start -> exit; fish on the walk, dogs / blocks off it. par = the shortest valid line
// found by a bounded branch-and-bound search (never longer than the generating walk).

const PATH_PASS = ['A single, elegant line. Very human. Robots draw in triangles.', 'Every fish visited, no knots. HUMANCHECK is moved to tears. Of oil.', 'That line had intent. Purpose. Whiskers. Verified.'];
const PATH_FAIL = ['The line forgot some fish. The fish noticed.', 'HUMANCHECK says the line is "suspiciously wobbly". I say it is art.', 'You stepped on a dog. The dog is fine. The verification is not.'];

// shortest valid line on an n x n board (pure). cells: 'W' wall, 'D' dog, 'F' fish, '.' plain. ord[i] = order (1..k) or 0.
function pathBest(n, cells, ord, start, exit, ordered, seed, budget = 300000) {
  const N = n * n, fish = []; for (let i = 0; i < N; i++) if (cells[i] === 'F') fish.push(i);
  const md = (a, b) => Math.abs(Math.floor(a / n) - Math.floor(b / n)) + Math.abs(a % n - b % n);
  const fishOrd = ordered ? fish.slice().sort((a, b) => ord[a] - ord[b]) : fish;
  let best = seed ? seed.length - 1 : Infinity, bestPath = seed ? seed.slice() : null, nodes = 0;
  const vis = new Array(N).fill(false), trail = [start];
  const lb = (cur, got) => {
    const rest = fishOrd.filter(f => !vis[f]);
    if (!rest.length) return md(cur, exit);
    if (ordered) { let s = md(cur, rest[0]); for (let k = 1; k < rest.length; k++) s += md(rest[k - 1], rest[k]); return s + md(rest[rest.length - 1], exit); }
    let m = 0; for (const f of rest) m = Math.max(m, md(cur, f) + md(f, exit)); return m;
  };
  const dfs = (cur, got) => {
    if (++nodes > budget) return;
    const len = trail.length - 1;
    if (cur === exit && got === fish.length) { if (len < best) { best = len; bestPath = trail.slice(); } return; }
    if (len + lb(cur, got) >= best) return;
    const r = Math.floor(cur / n), c = cur % n;
    for (const [dr, dc] of [[-1, 0], [0, 1], [1, 0], [0, -1]]) {
      const nr = r + dr, nc = c + dc; if (nr < 0 || nr >= n || nc < 0 || nc >= n) continue;
      const j = nr * n + nc; if (vis[j] || cells[j] === 'W' || cells[j] === 'D') continue;
      if (cells[j] === 'F' && ordered && ord[j] !== got + 1) continue;
      vis[j] = true; trail.push(j); dfs(j, got + (cells[j] === 'F' ? 1 : 0)); trail.pop(); vis[j] = false;
    }
  };
  vis[start] = true; dfs(start, cells[start] === 'F' ? 1 : 0);
  return bestPath ? { len: best, path: bestPath } : null;
}
// random self-avoiding walk from start to exit with lo..hi cells (pure, seeded)
function pathWalk(rng, n, start, exit, lo, hi) {
  const N = n * n, vis = new Array(N).fill(false), path = [start]; let nodes = 0, found = null;
  const md = (a, b) => Math.abs(Math.floor(a / n) - Math.floor(b / n)) + Math.abs(a % n - b % n);
  vis[start] = true;
  const dfs = i => {
    if (found || ++nodes > 8000) return;
    if (i === exit) { if (path.length >= lo) found = path.slice(); return; }
    if (path.length + md(i, exit) > hi) return;
    const r = Math.floor(i / n), c = i % n;
    for (const [dr, dc] of rng.shuffle([[-1, 0], [0, 1], [1, 0], [0, -1]])) {
      const nr = r + dr, nc = c + dc; if (nr < 0 || nr >= n || nc < 0 || nc >= n) continue;
      const j = nr * n + nc; if (vis[j]) continue;
      vis[j] = true; path.push(j); dfs(j); path.pop(); vis[j] = false;
    }
  };
  dfs(start);
  return found;
}

registerRound({
  id: 'path', name: 'The Line',
  minD: 0.45, weight: 1,
  move: 'step', verify: 'pad', noCheck: true, selShrink: 1,
  intro: 'Draw ONE line through every fish. You cannot cross it. Sit to undo. Leave by the little exit nub.',
  again: ['Line puzzle! Plan first, walk second. Like a human with a calendar.', 'Another line. Do not cross the streams. Or yourself.'],

  generate(d, rng) {
    const n = d < 0.15 ? 3 : d < 0.4 ? 4 : d < 0.85 ? 5 : 6, N = n * n;
    const dogsOn = d >= 0.35, blocksOn = d >= 0.5, ordered = d >= 0.6 && (d >= 0.85 || rng.chance(0.55));
    for (let attempt = 0; attempt < 200; attempt++) {
      const start = d < 0.15 ? 0 : rng.int(0, Math.floor(n / 2) - (n > 4 ? 0 : 1)) * n + rng.int(0, n - 1);
      const exit = d < 0.15 ? N - 1 : (n - 1) * n + rng.int(Math.floor(n / 2), n - 1);   // right half: near VERIFY, clear of the footer pads
      if (start === exit) continue;
      const tgt = d < 0.15 ? 5 : Math.round(lerp(N * 0.42, N * 0.72, d));
      const walk = pathWalk(rng, n, start, exit, tgt, tgt + 3) || pathWalk(rng, n, start, exit, Math.round(tgt * 0.7), tgt + 3);
      if (!walk) continue;
      const cells = new Array(N).fill('.'), ord = new Array(N).fill(0), onWalk = new Set(walk);
      const fishN = ordered ? 3 : d < 0.15 ? 2 : clamp(Math.round(lerp(2, 5, d)), 2, walk.length - 1);
      // fish spread along the walk (never on the start circle)
      const slots = walk.slice(1), picks = [];
      for (let k = 0; k < fishN; k++) { const a = Math.floor(k * slots.length / fishN), b = Math.floor((k + 1) * slots.length / fishN) - 1; picks.push(slots[rng.int(a, Math.max(a, b))]); }
      [...new Set(picks)].forEach((i, k) => { cells[i] = 'F'; ord[i] = k + 1; });
      const off = rng.shuffle([...Array(N).keys()].filter(i => !onWalk.has(i)));
      const near = off.filter(i => walk.some(w => Math.abs(Math.floor(w / n) - Math.floor(i / n)) + Math.abs(w % n - i % n) === 1));
      const dogN = dogsOn ? Math.min(near.length, clamp(Math.round(lerp(1, 3, (d - 0.35) / 0.65)), 1, 3)) : 0;
      const dogs = near.slice(0, dogN); dogs.forEach(i => { cells[i] = 'D'; });
      const rest = off.filter(i => cells[i] === '.');
      const blockN = blocksOn ? Math.min(rest.length, rng.int(1, n >= 6 ? 3 : 2)) : 0;
      rest.slice(0, blockN).forEach(i => { cells[i] = 'W'; });
      const best = pathBest(n, cells, ord, start, exit, ordered, walk);
      if (!best || best.len < n) continue;
      const nf = cells.filter(c => c === 'F').length;
      return {
        grid: n, catStart: start, start, exit, ordered, fishN: nf,
        tiles: cells.map((c, i) => c === 'W' ? { wall: true, noSelect: true } : { noSelect: true, pfish: c === 'F', dog: c === 'D', ord: ordered && c === 'F' ? ord[i] : 0 }),
        l1: ordered ? 'Draw a line through fish 1 → ' + nf + ', in order.' : 'Draw a line through all fish.',
        big: 'Do not cross yourself.',
        l3: (dogsOn && dogs.length ? 'No dogs! ' : '') + 'Sit = undo. Exit via the nub ↓',
        par: { steps: best.len }, solution: best.path, genWalk: walk,
      };
    }
    throw new Error('path: generator failed');
  },

  enter(R) {
    R.path = [R.start]; R.lit = new Array(R.tiles.length).fill(false); R.lit[R.start] = true;
    R.sealed = false; R.rewinding = -1; R.hintT = 0; R.bonkT = 0; R.undos = 0; R.flash = 0;
    R.tiles[R.start].lit = true;
  },
  update(R, dt) { R.hintT -= dt; R.bonkT -= dt; R.flash = Math.max(0, R.flash - dt * 2); },

  canEnter(R, from, to, info) {
    if (info && info.ent) return undefined;
    if (from === -1) return R.sealed && to === R.path[R.path.length - 1];
    if (R.lit[to]) return false;
    return undefined;
  },
  moveCat(R, from, dir, how) {
    if (how === 'hop') { pathHint(R, 'No hopping: the line has to stay in one piece.'); return []; }
    const j = stepCell(from, dir);
    if (j < 0) {
      if (from === R.exit && dir[0] === 1 && R.path[R.path.length - 1] === R.exit) { pathSeal(R); return { path: [], how: 'exit' }; }
      pathHint(R, 'The line can only leave through the exit nub.'); return [];
    }
    if (R.lit[j]) {
      if (R.bonkT <= 0) { tileWiggle(R.tiles[j]); SFX.bonk(); const c = cellCenter(j); addTxt(c.x, c.y - 10, 'no crossing!', C.red); R.bonkT = 0.45; }
      return [];
    }
    return { path: canEnterCell(from, j, { dir }) ? [j] : [], how: 'walk' };
  },
  onStep(R, from, to) {
    if (to === -1) return;   // left through the exit nub (sealed when the move started: it may cross VERIFY on the way)
    if (R.rewinding === to) { R.rewinding = -1; return; }
    if (from === -1) { R.sealed = false; return; }   // walked back in through the nub
    R.path.push(to); R.lit[to] = true; R.tiles[to].lit = true;
    const t = R.tiles[to], c = cellCenter(to);
    tileSquash(t, 0.94, 1.03, 0.18);
    SFX.toggle(Math.min(14, R.path.length));
    if (t.pfish) {
      const got = R.path.filter(i => R.tiles[i].pfish).length;
      const okOrder = !R.ordered || t.ord === got;
      if (okOrder) { SFX.pop(got + 2); burst(c.x, c.y, C.gold, 8, 150, 4); addTxt(c.x, c.y - 18, R.ordered ? `fish ${t.ord} ✓` : 'fish ✓', '#c98a00'); }
      else { tileFlash(t, C.red, 0.5); tileWiggle(t); SFX.desel(); addTxt(c.x, c.y - 18, 'wrong order!', C.red); }
    }
    if (t.dog) { tileFlash(t, C.red, 0.6); tileWiggle(t); tone(180, 0.09, 'triangle', 0.07, 60); tone(200, 0.09, 'triangle', 0.07, 60, 0.12); addTxt(c.x, c.y - 18, 'woof!! (sit to undo)', C.red); }
  },
  onSit(R, tile) {
    if (!tile || cat.cell < 0) { defaultSit(R, null); return; }
    if (R.path.length <= 1) { addTxt(cat.x, cat.y - 54, 'nothing to undo', C.grey); return; }
    const last = R.path.pop(), prev = R.path[R.path.length - 1];
    R.lit[last] = false; R.tiles[last].lit = false; R.undos++;
    const c = cellCenter(last); dust(c.x, c.y + G.ts * 0.2, 3, 12, '#ffe9a6');
    tone(760, 0.16, 'triangle', 0.045, -420); tone(520, 0.12, 'sine', 0.03, -260, 0.07);   // rewind
    R.rewinding = prev; catToCell(prev, false);
  },

  progress(R) {
    const got = R.path.filter(i => R.tiles[i].pfish).length;
    return `Fish ${got}/${R.fishN} · line ${R.path.length - 1}/${R.par.steps}`;
  },
  judge(R) {
    const fish = tilesWhere(t => t.pfish), missing = fish.filter(i => !R.lit[i]), dogs = tilesWhere(t => t.dog && R.lit[t.i]);
    let order = [];
    if (R.ordered) { let k = 0; for (const i of R.path) if (R.tiles[i].pfish) { k++; if (R.tiles[i].ord !== k) order.push(i); } }
    const wrong = [...new Set([...missing, ...dogs, ...order])], checked = [...new Set([...R.path, ...wrong])];
    if (!wrong.length && R.sealed) return { pass: true, verdict: pick(PATH_PASS), checked };
    let verdict = pick(PATH_FAIL);
    if (dogs.length) verdict = PATH_FAIL[2]; else if (order.length) verdict = 'The fish have numbers for a reason. The reason is order. Fish 1 first.';
    else if (missing.length) verdict = PATH_FAIL[0]; else if (!R.sealed) verdict = 'The line never reached the exit. It is just… loitering.';
    return { pass: false, verdict, wrong, checked };
  },

  drawUnder(R, g) { rr(g, G.x - 7, G.y - 7, G.w + 14, G.h + 14, 12, '#141b33', 0); },
  drawTile(R, g, t, x, y, s) {
    if (t.wall) {
      rr(g, x, y, s, s, s * 0.1, '#0c1124', 0);
      g.save(); g.beginPath(); g.roundRect(x, y, s, s, s * 0.1); g.clip(); g.strokeStyle = '#1f2848'; g.lineWidth = s * 0.08;
      for (let k = -1; k < 4; k++) { g.beginPath(); g.moveTo(x + k * s * 0.33, y + s); g.lineTo(x + k * s * 0.33 + s, y); g.stroke(); } g.restore();
      return true;
    }
    rr(g, x, y, s, s, s * 0.1, t.lit ? '#3a3f5c' : '#2a3458', 0);
    g.lineWidth = 2; g.strokeStyle = t.lit ? '#58587a' : '#36426c'; g.beginPath(); g.roundRect(x + 3, y + 3, s - 6, s - 6, s * 0.08); g.stroke();
    if (t.pfish || t.dog) {
      const cx = x + s / 2, cy = y + s / 2;
      if (t.pfish) circ(g, cx, cy, s * 0.36, t.lit ? 'rgba(255,214,90,.28)' : 'rgba(159,214,234,.18)', 0);
      if (t.dog) circ(g, cx, cy, s * 0.36, 'rgba(229,72,77,.2)', 0);
      drawIcon(g, t.pfish ? 'fish' : 'dog', cx, cy, s * 0.82);
      if (t.dog) {   // "avoid" sign: red ring + slash
        g.save(); g.strokeStyle = C.red; g.lineWidth = Math.max(3, s * 0.06); g.beginPath(); g.arc(cx, cy, s * 0.38, 0, 7); g.stroke();
        g.beginPath(); g.moveTo(cx - s * 0.27, cy + s * 0.27); g.lineTo(cx + s * 0.27, cy - s * 0.27); g.stroke(); g.restore();
      }
      if (t.ord) { const bx = x + s * 0.8, by = y + s * 0.2, br = Math.max(9, s * 0.15); circ(g, bx, by, br, C.gold, 2); txt(String(t.ord), bx, by + 1, br * 1.3, C.ink, 'center', 700); }
    }
    return true;
  },
  drawOverlay(R, g) {
    const s = G.ts, foot = Math.min(s * 0.2, 20), ctr = i => cellCenter(i);
    const ex = ctr(R.exit), nubY = G.y + G.h + Math.min(14, s * 0.25);
    // exit nub (Witness style): a short rounded stub past the bottom edge
    rr(g, ex.x - s * 0.17, G.y + G.h - 2, s * 0.34, nubY - G.y - G.h + s * 0.12, s * 0.17, '#141b33', 0);
    if (!R.sealed) { g.save(); g.globalAlpha = 0.55 + 0.35 * Math.sin(time * 4); poly(g, [[ex.x - s * 0.09, nubY - s * 0.05], [ex.x + s * 0.09, nubY - s * 0.05], [ex.x, nubY + s * 0.06]], '#ffd25a', 0); g.restore(); }
    // start circle
    const st = ctr(R.start);
    circ(g, st.x, st.y, s * 0.24, '#3c4876', 0);
    // the line: centres of the lit cells, the tip follows the cat while it moves
    const pts = R.path.map(ctr).map(p => [p.x, p.y]);
    if (cat.mv && (mode === 'play' || mode === 'verifying')) pts.push([cat.x, cat.y - foot]);
    if (R.sealed && !cat.mv) pts.push([ex.x, nubY]);
    const glow = 0.5 + 0.12 * Math.sin(time * 3) + R.flash * 0.4;
    g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
    const stroke = (w, col, a) => { g.globalAlpha = a; g.beginPath(); pts.forEach((p, k) => k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.lineWidth = w; g.strokeStyle = col; g.stroke(); };
    if (pts.length > 1) { stroke(s * 0.46, '#ffd25a', 0.12 * glow * 2); stroke(s * 0.3, '#ffe39a', 0.3 * glow * 1.6); stroke(s * 0.17, '#fff3cf', 1); stroke(s * 0.06, '#ffffff', 0.7); }
    g.globalAlpha = 1; g.restore();
    circ(g, st.x, st.y, s * 0.2, '#fff3cf', 0); circ(g, st.x, st.y, s * 0.27, null, 0);
    g.save(); g.globalAlpha = 0.35 * glow; circ(g, st.x, st.y, s * 0.3, '#ffd25a', 0); g.restore(); circ(g, st.x, st.y, s * 0.2, '#fff3cf', 0);
    if (R.sealed) { g.save(); g.globalAlpha = 0.6 + 0.3 * Math.sin(time * 6); circ(g, ex.x, nubY, s * 0.13, '#fff3cf', 0); g.restore(); }
  },
});
function pathSeal(R) {
  R.sealed = true; R.flash = 1;
  const c = cellCenter(R.exit); burst(c.x, c.y + G.ts * 0.6, '#ffe9a6', 9, 160, 4);
  [0, 2, 4].forEach((k, i) => tone(noteHz(k + 7), 0.25, 'sine', 0.04, 0, i * 0.06));
  if (R.hintT <= 0) { toastMsg('Line sealed! Walk onto VERIFY. (Walk back in to edit.)', 2.2); R.hintT = 2; }
}
function pathHint(R, msg) { if (R.hintT > 0) return; R.hintT = 1.6; toastMsg(msg, 2); tone(160, 0.08, 'sine', 0.05); }

// ===================== src/rounds/pipes.js =====================
// rounds/pipes.js — PIPE MANIA / INFINITY LOOP, re-skinned as "Connect the internet to your robot friend".
// Every tile is a cable piece (end, straight, corner, tee, cross). Sitting on a tile turns it 90° clockwise (spring + click).
// The router sits outside the grid on the left, the robot friend's port on the right. Connected cable glows cyan with a
// pulse travelling out from the router; once the port is reached, light races along the path, the little robot boots up
// ("Connected" + loading bar + chord) and the round auto-verifies.
// Generator: random self-avoiding path left -> right (longer and twistier with d), decoy pieces elsewhere, scrambled
// rotations. par = the true minimum number of rotations (Dijkstra relaxation, exact B&B search when it is not a simple path).

const PIPES_PASS = ['I can hear the modem singing. It is singing about me.', 'Connected! I just downloaded a picture of a cloud. It was a cloud.', 'Wi-Fi achieved. The cable did the hard work. Also you. Mostly you.'];
const PIPES_FAIL = ['Still offline. I am a very expensive paperweight.', 'The internet is on the other side of that cable. So close. So unplugged.', 'No signal. I tried licking the port. Do not tell HUMANCHECK.'];
const PIPES_YAY = ['CONNECTED! Loading internet… 3%…', 'I feel the bandwidth! It tickles!', 'Packets! Real packets! In my ports!'];
const PIPES_BIT = [[1, -1, 0], [2, 0, 1], [4, 1, 0], [8, 0, -1]];        // bit, dr, dc  (1 up, 2 right, 4 down, 8 left)
const PIPES_OPP = { 1: 4, 2: 8, 4: 1, 8: 2 };

// mask rotated k quarter turns clockwise (same rule as pipeMask in 40-grid.js)
function pipesRot(m, k) { k = ((k % 4) + 4) % 4; for (let i = 0; i < k; i++) m = ((m << 1) | (m >> 3)) & 15; return m; }

function pipesCost(p, r, need) { for (let k = 0; k < 4; k++) if ((pipesRot(p, r + k) & need) === need) return k; return Infinity; }
// flood the signal from the router: depth[i] = cable distance from the router (-1 = dark); parent for the race path
function pipesFlow(masks, cols, rows, rS, rE) {

        const nr = r + dr, nc = c + dc; if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;

}
// minimum rotations to connect router (left of row rS) to port (right of row rE).
// returns { cost, steps: [{cell, k}] }. Any solution contains a simple lit path whose cells each need at least
// pipesCost(entry|exit) turns, so the cheapest simple path is optimal (a cross is the only piece a path could reuse,
// and a cross never needs turning). Dijkstra over (cell, entry side) is a relaxation; if its path is simple it is exact,
// otherwise a branch-and-bound DFS over simple paths decides.

    let u = -1, du = Infinity; for (let s = 0; s < S; s++) if (!done[s] && dist[s] < du) { du = dist[s]; u = s; }
    if (u < 0 || du >= best) break;

    if (i === end) { const k = pipesCost(base[i], rot[i], e | 2); if (du + k < best) { best = du + k; bestEnd = u; } }

      const nr = r + dr, nc = c + dc; if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      const k = pipesCost(base[i], rot[i], e | bit); if (k === Infinity) continue;

  }

  const chain = []; for (let s = bestEnd; s >= 0; s = prev[s]) chain.unshift(s);
  const cells = chain.map(s => s >> 2);

    const e = [1, 2, 4, 8][chain[k] & 3];

    return { cell: i, k: pipesCost(base[i], rot[i], e | x) };

  let bestCost = Infinity, bestSteps = null, bestPath = null, nodes = 0;

      const j = nr * cols + nc; if (vis[j]) continue;
      const k = pipesCost(base[i], rot[i], e | bit); if (k === Infinity || cost + k >= bestCost) continue;
      trail.push({ cell: i, k }); dfs(j, PIPES_OPP[bit], cost + k); trail.pop();
    }
    vis[i] = false;
  };

  return { cost: bestCost, steps: bestSteps.filter(s => s.k > 0), path: bestPath };
}
// random self-avoiding path (cell list) from (rS, 0) to (rE, cols-1) with a cell count in [lo, hi]
function pipesWalk(rng, cols, rows, rS, rE, lo, hi) {

    if (i === end) { if (path.length >= lo && path.length <= hi) found = path.slice(); return; }
    if (path.length >= hi) return;
    const r = Math.floor(i / cols), c = i % cols, er = Math.floor(end / cols), ec = end % cols;
    if (path.length + Math.abs(er - r) + Math.abs(ec - c) > hi) return;

      const nr = r + dr, nc = c + dc; if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      const j = nr * cols + nc; if (vis[j]) continue;
      vis[j] = true; path.push(j); dfs(j); path.pop(); vis[j] = false;
    }

}
const PIPES_DECOYS = [[1, 0.14], [5, 0.3], [3, 0.3], [7, 0.21], [15, 0.05]];   // end, straight, corner, tee, cross

registerRound({
  id: 'pipes', name: 'Cable Connect',
  minD: 0.3, weight: 1,
  intro: 'Sit on a cable to turn it. Connect the router to me. I am the robot on the right. Hi.',
  again: ['More cables! Plug me in, kitty. Gently. I am ticklish at 5 GHz.', 'Cables again. Turn them until I can smell the internet.'],
  verify: 'auto', autoDelay: 1.5, noCheck: true, selShrink: 1,

  generate(d, rng) {
    const n = d < 0.2 ? 3 : d < 0.5 ? 4 : 5, cols = n, rows = n, N = cols * rows;
    let fallback = null;
    for (let attempt = 0; attempt < 400; attempt++) {
      let rS, rE, path;
      if (d < 0.2) { rS = rE = 1; path = [3, 4, 5]; }
      else {
        rS = rng.int(0, rows - 1); rE = rng.int(0, rows - 1);
        const minLen = cols + Math.abs(rS - rE), extra = Math.round(lerp(0, N * 0.42, (d - 0.2) / 0.8)) + rng.int(0, 2);
        path = pipesWalk(rng, cols, rows, rS, rE, minLen + extra, minLen + extra + 3) || pipesWalk(rng, cols, rows, rS, rE, minLen, minLen + extra + 3);
        if (!path) continue;
      }
      // the correct masks along the path (+ decoy branches at higher d)
      const base = new Array(N).fill(0), rot = new Array(N).fill(0), onPath = new Set(path);
      path.forEach((i, k) => {
        const side = (a, b) => { const dr = Math.floor(b / cols) - Math.floor(a / cols), dc = b % cols - a % cols; return dr < 0 ? 1 : dc > 0 ? 2 : dr > 0 ? 4 : 8; };
        let m = (k === 0 ? 8 : side(i, path[k - 1])) | (k === path.length - 1 ? 2 : side(i, path[k + 1]));
        if (d >= 0.2 && rng.chance(d * 0.3)) { const extra = rng.pick([1, 2, 4, 8].filter(b => !(m & b))); m |= extra; }
        base[i] = m;
      });
      for (let i = 0; i < N; i++) if (!onPath.has(i)) { base[i] = rng.weighted(PIPES_DECOYS, x => x[1])[0]; rot[i] = rng.int(0, 3); }
      // scramble path tiles: each chosen one gets a rotation that actually breaks it
      const nScr = d < 0.2 ? 1 : clamp(Math.round(lerp(2, path.length * 0.7, d)), 2, path.length);
      const scr = d < 0.2 ? [4] : rng.sample(path, nScr);

      const sol = pipesMinRot(base, rot, cols, rows, rS, rE);
      if (!sol || sol.cost < 1) continue;
      if (d >= 0.2 && sol.cost < 2) continue;
      if (d < 0.2 && sol.cost !== 1) continue;
      if (sol.cost > Math.round(lerp(4, 14, d))) continue;   // keep the turning count humane
      const spec = {
        cols, rows, margin: { l: 42, r: 50, t: 0, b: 0 },
        tiles: base.map((p, i) => ({ pipe: p, rot: rot[i], noSelect: true })),
        l1: 'Connect the internet to', big: 'your robot friend', l3: 'Sit = turn a cable 90°.',
        par: { sits: sol.cost }, rS, rE, solution: sol.steps, solPath: sol.path, genPath: path,
      };
      if (sol.cost >= Math.max(1, Math.round(path.length * 0.4 * d))) return spec;
      if (!fallback) fallback = spec;

  },

  enter(R) { R.connected = false; R.raceT = -1; R.loadT = -1; R.flow = null; pipesUpdate(R, -1, true); },
  update(R, dt) { if (R.raceT >= 0) R.raceT += dt; if (R.loadT >= 0) R.loadT += dt; },

  onSit(R, tile) {
    if (!tile) { defaultSit(R, null); return; }
    tile.rot = (tile.rot || 0) + 1;
    tileSpin(tile, -Math.PI / 2, 0.34);
    tileSquash(tile, 0.94, 1.03, 0.2);
    const c = cellCenter(tile.i);
    tone(1500, 0.025, 'triangle', 0.05); tone(820, 0.04, 'sine', 0.05, -200, 0.02); noise(0.025, 0.03, 0, 0, 3000);   // click

  solved: R => R.connected,
  progress(R) {

    return `Connected ${k}/${L} · turns ${R.stats.sits}/${R.par.sits}`;

  judge(R) {

  drawTile(R, g, t, x, y, s) {
    const race = R.raceIx && R.raceIx[t.i] != null ? R.raceIx[t.i] : -1;
    const hot = race >= 0 && R.raceT >= 0 ? clamp((R.raceT - race * 0.05) / 0.12, 0, 1) : 0;
    const ph = t.lit && t.depth >= 0 ? ((time * 5 - t.depth) % 7 + 7) % 7 : 9, pulse = ph < 1.6 ? Math.sin(ph / 1.6 * Math.PI) : 0;

  drawUnder(R, g) {
    // backing plate so the cable gaps read as one board
    rr(g, G.x - 5, G.y - 5, G.w + 10, G.h + 10, 10, '#cfd8e6', 0);
    pipesDrawRouter(R, g);
  },
  drawOverlay(R, g) { pipesDrawBuddy(R, g); },
});

// recompute connectivity after a rotation; juice for newly lit cable, the race when the port connects
function pipesUpdate(R, changed, quiet) {
  const masks = R.tiles.map(t => pipeMask(t)), F = pipesFlow(masks, G.cols, G.rows, R.rS, R.rE), was = R.tiles.map(t => !!t.lit);
  R.flow = F;
  let newly = 0;
  R.tiles.forEach((t, i) => {
    t.depth = F.depth[i]; t.lit = F.depth[i] >= 0;
    if (t.lit && !was[i] && !quiet) { const c = cellCenter(i); after(t.depth * 0.03, () => burst(c.x, c.y, C.cyan, 5, 90, 3)); newly++; }
  });
  if (newly && !quiet) SFX.toggle(Math.min(12, F.depth.filter(v => v >= 0).length));
  if (F.connected && !R.connected) {
    R.connected = true; R.raceT = 0; R.loadT = -1; R.raceIx = {};
    F.path.forEach((i, k) => {
      R.raceIx[i] = k;
      after(k * 0.05, () => { if (!R.connected) return; const c = cellCenter(i); burst(c.x, c.y, '#e9feff', 6, 140, 3); tilePop(R.tiles[i]); SFX.chime(k); });
    });
    after(F.path.length * 0.05 + 0.08, () => {
      if (!R.connected) return;
      R.loadT = 0; SFX.chord(); botWiggle(); say(pick(PIPES_YAY), 'ecstatic', 3);
      const p = pipesBuddyXY(R); burst(p.x, p.y - 30, C.cyan, 10, 170, 4);
    });
  } else if (!F.connected && R.connected) { R.connected = false; R.raceT = -1; R.loadT = -1; R.raceIx = null; }
}

// chunky rounded cable: ink outline, grey (or glowing cyan) cable, copper ferrules at the tile edges, a hub in the middle
function pipesDrawTile(g, m, x, y, s, lit, pulse, hot) {
  rr(g, x, y, s, s, s * 0.12, lit ? '#e2f8fb' : '#e6ebf3', 0);
  g.lineWidth = 2; g.strokeStyle = lit ? '#bfeaf0' : '#d3dae6'; g.beginPath(); g.roundRect(x + 3, y + 3, s - 6, s - 6, s * 0.09); g.stroke();
  const cx = x + s / 2, cy = y + s / 2, w = s * 0.25, o = Math.max(2.5, s * 0.05), arms = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const arm = (k, width, col, inset = 0, off = 0) => {
    const [ax, ay] = arms[k], px = -ay * off, py = ax * off;
    g.beginPath(); g.moveTo(cx + px, cy + py); g.lineTo(cx + ax * (s / 2 - inset) + px, cy + ay * (s / 2 - inset) + py);
    g.lineWidth = width; g.strokeStyle = col; g.lineCap = 'butt'; g.stroke();
  };
  const ks = [0, 1, 2, 3].filter(k => m & (1 << k));
  if (lit) { g.save(); g.globalAlpha = 0.22 + 0.25 * Math.max(pulse, hot); for (const k of ks) arm(k, w * 2.2, C.cyan); circ(g, cx, cy, w * 1.1, C.cyan, 0); g.restore(); }
  for (const k of ks) arm(k, w + 2 * o, C.ink);
  circ(g, cx, cy, w / 2 + o, C.ink, 0);
  const body = hot > 0 ? '#e9feff' : lit ? '#62e8f7' : '#a3adbf', shade = lit ? '#2fbfd3' : '#8590a5';
  for (const k of ks) { arm(k, w, body); arm(k, w * 0.3, shade, 0, w * 0.3); arm(k, w * 0.22, 'rgba(255,255,255,.5)', 0, -w * 0.24); }
  circ(g, cx, cy, w / 2, body, 0);
  if (lit && (pulse > 0 || hot > 0)) { g.save(); g.globalAlpha = Math.max(pulse * 0.9, hot); for (const k of ks) arm(k, w * 0.36, '#ffffff'); circ(g, cx, cy, w * 0.2, '#ffffff', 0); g.restore(); }
  // copper ferrules where the cable meets the tile edge
  const fl = s * 0.13, fw = w + 2 * o + s * 0.05;
  for (const k of ks) {
    const [ax, ay] = arms[k], ex = cx + ax * (s / 2 - fl / 2), ey = cy + ay * (s / 2 - fl / 2), ww = ax ? fl : fw, hh = ax ? fw : fl;
    rr(g, ex - ww / 2, ey - hh / 2, ww, hh, 2, '#d9893b', Math.max(2, o * 0.8));
    g.fillStyle = '#f4b877'; if (ax) g.fillRect(ex - ww / 2 + 2, ey - hh / 2 + 2, ww - 4, hh * 0.22); else g.fillRect(ex - ww / 2 + 2, ey - hh / 2 + 2, ww * 0.22, hh - 4);
  }
  // hub / end cap
  if (ks.length === 1) { circ(g, cx, cy, w * 0.78, '#d9893b', Math.max(2, o * 0.8)); circ(g, cx - w * 0.2, cy - w * 0.2, w * 0.2, '#f4b877', 0); circ(g, cx, cy, w * 0.22, C.ink, 0); }
  else { circ(g, cx, cy, w * 0.5, lit ? '#c9fbff' : '#c9d0dc', Math.max(1.5, o * 0.7)); circ(g, cx, cy, w * 0.14, lit ? '#1f9fb3' : '#7b8597', 0); }
}

// ===================== src/rounds/rules.js =====================
// rounds/rules.js — BABA IS YOU, re-skinned as "Select all squares with [NOUN]".
// The noun in the prompt is a pushable WORD TILE sitting in the prompt slot (a cell on the top row of the grid). Push a
// different word into the slot and the question changes (the header retypes itself). Then do what it says: select every
// square with that thing, or, for NOTHING, verify with nothing selected. The judge reads whatever is in the slot.
// Difficulty: more words, walls, the slot starts holding a word whose things are walled off (push it out first), word
// tiles blocked by icons. Every puzzle is BFS-verified (push phase + a greedy select tour + walk to the bottom edge);
// par = that solver's move count. Dead ends are possible (a word pushed into a corner) -> RESET pad (sokoban.js helpers).

const RULES_NOUNS = ['fish', 'sock', 'duck', 'pizza', 'bone', 'crown', 'ball', 'moon', 'tree', 'car', 'bus', 'cloud', 'cactus', 'dog', 'sun', 'house', 'balloon', 'umbrella'];
const RULES_NOTHING = 'NOTHING';
const RULES_K = ['U', 'R', 'D', 'L'];
const RULES_PASS = ['You changed the question and then answered it. That is called politics. Very human.', 'HUMANCHECK asked exactly what YOU wanted it to ask. Flawless social engineering.', 'Rules are just tiles you can push. I am writing that on my heart. I do not have a heart.'];
const RULES_FAIL = ['That is not all the squares with that thing. The word was RIGHT there.', 'You picked the word and then ignored it. The word feels used.', 'So close. The question said one thing and your paws said another.'];
const RULES_FAIL_NOTHING = ['NOTHING means nothing. Not even a little something. HUMANCHECK checked.', 'You chose NOTHING and then selected something. Very confusing. Very cat.'];
const RULES_FAIL_BLANK = ['The question is blank. HUMANCHECK cannot verify a blank. Neither can I.', 'Select all squares with... nothing written? Push a word into the slot first.'];

// ---------- pure helpers ----------
function rulesNb(i, k, n) { return sokoNb(i, k, n); }
// BFS distances from `from` through cells where pass(i) is true
function rulesDist(n, from, pass) {
  const N = n * n, d = new Array(N).fill(-1), par = new Array(N).fill(-1), q = [from]; d[from] = 0;
  for (let h = 0; h < q.length; h++) { const u = q[h]; for (let k = 0; k < 4; k++) { const v = rulesNb(u, k, n); if (v < 0 || d[v] >= 0 || !pass(v)) continue; d[v] = d[u] + 1; par[v] = u * 4 + k; q.push(v); } }
  return { d, par };
}
function rulesPathTo(D, to) { const out = []; let v = to; while (D.d[v] > 0) { const p = D.par[v]; out.push(RULES_K[p % 4]); v = Math.floor(p / 4); } return out.reverse(); }
// after the right word is in the slot: greedy walk to every target (sit on each), then to the nearest bottom-row cell
// and step off the grid ('X'). Words are obstacles (walking into one would push it). -> { cost, toks } or null
function rulesTour(n, wall, occ, cat, targets) {
  const pass = v => !wall[v] && !occ[v];
  let cur = cat, cost = 0; const rest = targets.slice(), toks = [];
  while (rest.length) {
    const D = rulesDist(n, cur, pass); let bi = -1;
    for (let j = 0; j < rest.length; j++) if (D.d[rest[j]] >= 0 && (bi < 0 || D.d[rest[j]] < D.d[rest[bi]])) bi = j;
    if (bi < 0) return null;
    const t = rest.splice(bi, 1)[0]; cost += D.d[t]; toks.push(...rulesPathTo(D, t), 'S'); cur = t;
  }
  const D = rulesDist(n, cur, pass); let best = -1;
  for (let c = 0; c < n; c++) { const v = (n - 1) * n + c; if (D.d[v] >= 0 && (best < 0 || D.d[v] < D.d[best])) best = v; }
  if (best < 0) return null;
  cost += D.d[best]; toks.push(...rulesPathTo(D, best), 'X');
  return { cost, toks };
}
// L = { n, wall[], icon[] (noun|null), words: [{ word, noun|null }], wpos: [cells], cat, slot }
// Returns { total, push, toks } (min over push-phase depth + tour) or null. `trivial` = solvable without pushing.
function rulesSolve(L, cap = 140000) {
  const { n, wall, icon, words, slot } = L, N = n * n, W = words.length;
  const iconCells = {}; icon.forEach((k, i) => { if (k) (iconCells[k] = iconCells[k] || []).push(i); });
  const enc = (c, ps) => { let k = c; for (let i = 0; i < W; i++) k = k * N + ps[i]; return k; };
  const evalGoal = (c, ps) => {
    const wi = ps.indexOf(slot); if (wi < 0) return null;
    const w = words[wi], occ = new Array(N).fill(false); ps.forEach(p => occ[p] = true);
    return rulesTour(n, wall, occ, c, w.noun ? (iconCells[w.noun] || []) : []);
  };
  const nodes = [{ c: L.cat, ps: L.wpos.slice(), d: 0, par: -1, tok: '' }], seen = new Set([enc(L.cat, L.wpos)]);
  let best = null, capped = false;
  for (let h = 0; h < nodes.length; h++) {
    const s = nodes[h];
    if (best && s.d >= best.total) break;
    const g = evalGoal(s.c, s.ps);
    if (g && (!best || s.d + g.cost < best.total)) {
      const toks = []; for (let v = h; nodes[v].par >= 0; v = nodes[v].par) toks.push(nodes[v].tok);
      best = { total: s.d + g.cost, push: s.d, toks: toks.reverse().concat(g.toks), word: words[s.ps.indexOf(slot)].word };
    }
    if (nodes.length > cap) { capped = true; continue; }
    for (let k = 0; k < 4; k++) {
      const j = rulesNb(s.c, k, n); if (j < 0 || wall[j]) continue;
      let ps = s.ps; const wi = ps.indexOf(j);
      if (wi >= 0) { const j2 = rulesNb(j, k, n); if (j2 < 0 || wall[j2] || icon[j2] || ps.includes(j2)) continue; ps = ps.slice(); ps[wi] = j2; }
      const key = enc(j, ps); if (seen.has(key)) continue; seen.add(key);
      nodes.push({ c: j, ps, d: s.d + 1, par: h, tok: RULES_K[k] });
    }
  }
  if (best) { best.capped = capped; best.trivial = !!evalGoal(L.cat, L.wpos); }

}

function rulesTry(d, rng, attempt) {
  const n = d < 0.3 ? 4 : 5, N = n * n;
  const nNoun = d < 0.25 ? 1 : d < 0.6 ? 2 : 3;
  const useNothing = d >= 0.3 && rng.chance(lerp(0.3, 0.7, d));
  const locked = d >= 0.4 && rng.chance(d >= 0.6 ? 0.85 : 0.5);
  const nWalls = d < 0.2 ? 0 : Math.round(lerp(0, 3, d)) + rng.int(0, 1);
  const wall = new Array(N).fill(false), icon = new Array(N).fill(null), wordAt = new Array(N).fill(null);
  const slot = rng.int(1, n - 2), rc = i => [Math.floor(i / n), i % n];
  const nouns = rng.sample(RULES_NOUNS, nNoun + 3);
  const taken = i => wall[i] || icon[i] || wordAt[i] || i === slot;
  const freeCells = (f = () => true) => [...Array(N).keys()].filter(i => !taken(i) && f(i));
  const words = [], wpos = [];
  // intro: one word straight below the slot, the cat below it: push up twice, select, done
  if (d === 0) {
    const noun = nouns[0], wcell = 2 * n + slot, cat = 3 * n + slot;
    wordAt[wcell] = noun; words.push({ word: noun.toUpperCase(), noun }); wpos.push(wcell);
    for (const i of rng.sample(freeCells(i => i !== cat && i % n !== slot && rc(i)[0] > 0), rng.int(1, 2))) icon[i] = noun;
    for (const i of rng.sample(freeCells(i => i !== cat && i % n !== slot && rc(i)[0] > 0), 1)) icon[i] = nouns[1];   // a decoy
    return { n, wall, icon, words, wpos, cat, slot };
  }
  // a locked noun: its thing sits in a walled-off corner, and its word starts IN the slot (push it out first)
  let lockedNoun = null;
  if (locked) {
    const corners = [[N - n, [N - 2 * n, N - n + 1]], [N - 1, [N - n - 1, N - 2]], [0, [n, 1]], [n - 1, [2 * n - 1, n - 2]]]
      .filter(([c, ws]) => c !== slot && !ws.includes(slot) && !ws.includes(slot - 1) && !ws.includes(slot + 1));
    if (corners.length) {
      const [c, ws] = rng.pick(corners); lockedNoun = nouns[nNoun];
      icon[c] = lockedNoun; ws.forEach(w => wall[w] = true);
      wordAt[slot] = lockedNoun; words.push({ word: lockedNoun.toUpperCase(), noun: lockedNoun }); wpos.push(slot);
    }
  }
  for (const i of rng.sample(freeCells(i => rc(i)[0] > 0), nWalls)) wall[i] = true;
  for (let k = 0; k < nNoun; k++) for (const i of rng.sample(freeCells(), rng.int(1, 2))) icon[i] = nouns[k];
  for (const i of rng.sample(freeCells(i => rc(i)[0] > 0), rng.int(0, 1))) icon[i] = nouns[nNoun + 1];   // decor / decoys
  const corner = i => (rc(i)[0] === 0 || rc(i)[0] === n - 1) && (rc(i)[1] === 0 || rc(i)[1] === n - 1);
  const wlist = nouns.slice(0, nNoun).map(noun => ({ word: noun.toUpperCase(), noun }));
  if (useNothing) wlist.push({ word: RULES_NOTHING, noun: null });
  for (const w of rng.shuffle(wlist)) {
    const cells = freeCells(i => !corner(i) && (rc(i)[0] > 0 || d >= 0.5));
    if (!cells.length) return null;
    const i = rng.pick(cells); wordAt[i] = w.word; words.push(w); wpos.push(i);
  }
  const cc = freeCells(i => rc(i)[0] > 0);
  if (!cc.length) return null;
  return { n, wall, icon, words, wpos, cat: rng.pick(cc), slot };
}
function rulesFallback() {
  // 5x5 hand-made: SOCK starts in the slot but the sock is walled into the corner; push it out, push FISH in
  const n = 5, N = 25, wall = new Array(N).fill(false), icon = new Array(N).fill(null);
  icon[20] = 'sock'; wall[15] = wall[21] = true; icon[8] = 'fish'; icon[18] = 'fish'; icon[11] = 'duck';
  return { n, wall, icon, words: [{ word: 'SOCK', noun: 'sock' }, { word: 'FISH', noun: 'fish' }], wpos: [2, 12], cat: 17, slot: 2 };
}

function rulesSlotWord(R) { const t = R.tiles[R.pslot]; return t && t.word ? t : null; }
// update the header prompt from the slot: a quick split-flap flip, then the noun retypes itself
function rulesSetPrompt(R, animate = true) {
  const t = rulesSlotWord(R), big = t ? `[ ${t.word} ]` : '[ ____ ]';
  if (!animate) { R.big = big; return; }
  R.flipT = 1; tween(R, { flipT: 0 }, 0.3, { ease: 'linear' });
  after(0.14, () => { R.big = big; R.typeT = R.l1.length / 70; });

function rulesDrawLabel(g, word, x, y, s, hot) {
  const m = s * 0.08, w = s - m * 2, h = s * 0.58, top = y + (s - h) / 2 - s * 0.03, r = s * 0.08, sd = Math.max(3, s * 0.06);
  if (hot) { g.save(); g.globalAlpha = 0.55 + 0.25 * Math.sin(time * 5); rr(g, x + m - 4, top - 4, w + 8, h + 8, r + 4, '#ffe58a', 0); g.restore(); }
  rr(g, x + m + sd, top + sd, w, h, r, '#9c8558', 0);                                // offset print shadow
  rr(g, x + m, top, w, h, r, word === RULES_NOTHING ? '#efe9fb' : '#fff6dc', Math.max(2.5, s * 0.045));
  g.strokeStyle = word === RULES_NOTHING ? '#d6cdee' : '#ead9ad'; g.lineWidth = 1.5; g.strokeRect(x + m + s * 0.05, top + s * 0.05, w - s * 0.1, h - s * 0.1);
  let fs = s * 0.25; g.font = `800 ${fs}px ${FONT}`;
  while (fs > 8 && g.measureText(word).width > w * 0.84) { fs -= 1; g.font = `800 ${fs}px ${FONT}`; }
  g.fillStyle = word === RULES_NOTHING ? '#5b4a8a' : C.ink; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(word, x + s / 2, top + h / 2 + 1);
}
function rulesDrawSlotFloor(g, x, y, s) {
  g.fillStyle = '#dce8ff'; g.fillRect(x, y, s, s);
  g.fillStyle = 'rgba(47,111,228,.10)'; g.fillRect(x + 6, y + s * 0.38, s - 12, s * 0.24);
  g.strokeStyle = '#a9c3f5'; g.lineWidth = 2; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(x + s * 0.25, y + s * 0.7); g.lineTo(x + s * 0.75, y + s * 0.7); g.stroke(); g.setLineDash([]);
}

registerRound({
  id: 'rules', name: 'Rule pushing',
  minD: 0.35, weight: 1,
  intro: 'The question is a tile! Push a WORD into the [slot] to change it, select what it says, then VERIFY.',
  again: ['Word tiles again. The question is negotiable. Push it around.', 'Remember: you can change what they ask. Lawyers hate this one trick.'],
  move: 'step', verify: 'pad', exitGrid: true,

  generate(d, rng) {
    let L = null, res = null;
    for (let a = 0; a < 80 && !res; a++) {
      L = rulesTry(d, rng, a); if (!L) continue;
      res = rulesSolve(L);
      if (!res || res.trivial) { res = null; continue; }
      const relax = Math.floor(a / 20);
      const minPush = d === 0 ? 1 : Math.max(2, Math.round(lerp(3, 9, d)) - relax * 2);
      if (res.push < minPush || (d === 0 && res.push > 3)) res = null;
    }
    if (!res) { L = rulesFallback(); res = rulesSolve(L); }
    const { n, wall, icon, words, wpos, slot } = L;
    const tiles = [...Array(n * n)].map((_, i) => {
      const wi = wpos.indexOf(i);
      if (wi >= 0) return { word: words[wi].word, noun: words[wi].noun, push: true, noSelect: true };
      return wall[i] ? { wall: true } : icon[i] ? { icon: icon[i] } : { empty: true };
    });
    const sw = wpos.indexOf(slot);
    return {
      grid: n, margin: { t: 18, b: SOKO_MARGIN.b }, tiles, initTiles: tiles, catStart: L.cat, pslot: slot,
      l1: 'Select all squares with', big: sw >= 0 ? `[ ${words[sw].word} ]` : '[ ____ ]', l3: 'Push a WORD into the [slot] to change the question.',
      par: { moves: res.total }, solution: res.toks, answer: res.word,
    };
  },

  enter(R) { R.stats.moves = 0; R.flipT = 0; R.padOn = false; },
  update(R) { sokoPadUpdate(R); },
  moveCat(R, from, dir, how) { return how === 'hop' ? { path: [from], how: 'hop' } : null; },   // no hopping over walls
  onMove(R, from, dir, how, path) { if (how !== 'hop' && path.length) R.stats.moves += path.length; },
  onPush(R, tile, from, to) {
    if (to === R.pslot || from === R.pslot) {
      rulesSetPrompt(R);
      const c = cellCenter(R.pslot);
      if (to === R.pslot) { tilePop(tile); after(0.12, () => { burst(c.x, c.y, C.gold, 8, 150, 3); tone(523, 0.1, 'triangle', 0.06); tone(784, 0.16, 'sine', 0.05, 0, 0.08); }); addTxt(c.x, c.y - G.ts * 0.5, tile.word === RULES_NOTHING ? 'nothing it is.' : 'new question!', C.blue); }
      else { addTxt(c.x, c.y - G.ts * 0.5, 'prompt cleared', C.grey); tone(400, 0.1, 'sine', 0.04, -150); }
    }
  },
  onSit(R, tile) { if (!sokoPadSit(R, R2 => { sokoRestore(R2); rulesSetPrompt(R2); })) defaultSit(R, tile); },

  drawTile(R, g, t, x, y, s) {
    if (t.word) { if (t.i === R.pslot) rulesDrawSlotFloor(g, x, y, s); else drawFloor(g, x, y, s); rulesDrawLabel(g, t.word, x, y, s, t.i === R.pslot); return true; }
    if (t.i === R.pslot && t.empty) { rulesDrawSlotFloor(g, x, y, s); return true; }
    return false;
  },
  drawOverlay(R, g) {
    const p = cellXY(R.pslot), s = G.ts, k = 0.5 + 0.5 * Math.sin(time * 4), bx = s * 0.16, col = C.blue;
    // the [ ] brackets around the slot + a tiny tag above it
    ln(g, [[p.x + bx, p.y + 3], [p.x + 3, p.y + 3], [p.x + 3, p.y + s - 3], [p.x + bx, p.y + s - 3]], 4 + k, col);
    ln(g, [[p.x + s - bx, p.y + 3], [p.x + s - 3, p.y + 3], [p.x + s - 3, p.y + s - 3], [p.x + s - bx, p.y + s - 3]], 4 + k, col);
    txt('▼ PROMPT', p.x + s / 2, p.y - 9, 10, C.blue, 'center', 700);
    sokoPadDraw(R, g);
  },
  drawTop(R, g) {
    if (!(R.flipT > 0)) return;
    const a = 1 - Math.abs(1 - 2 * R.flipT), h = 28 * a;   // the big line folds shut and opens again (split-flap)
    g.fillStyle = C.blueD; g.fillRect(HEAD.x + 18, 56 - h / 2, HEAD.w - 36, h);
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(HEAD.x + 18, 56 - 1, (HEAD.w - 36) * a, 2);
  },

  progress(R) {
    const t = rulesSlotWord(R), n = selected().length;
    if (!t) return 'prompt: blank';
    if (!t.noun) return `NOTHING · ${n} selected`;
    const need = R.tiles.filter(u => u.icon === t.noun).length, got = R.tiles.filter(u => u.icon === t.noun && u.sel).length;
    return `${t.word} ${got} / ${need}` + (n > got ? ` · ${n - got} extra` : '');
  },
  judge(R) {
    const t = rulesSlotWord(R), sel = selected();
    if (!t) return { pass: false, verdict: pick(RULES_FAIL_BLANK), wrong: sel.length ? sel : [R.pslot], checked: sel.concat([R.pslot]) };
    if (!t.noun) return sel.length ? { pass: false, verdict: pick(RULES_FAIL_NOTHING), wrong: sel } : { pass: true, verdict: pick(RULES_PASS), checked: [R.pslot] };
    const want = tilesWhere(u => u.icon === t.noun), wrong = sel.filter(i => !want.includes(i)).concat(want.filter(i => !R.tiles[i].sel));
    const checked = [...new Set(sel.concat(want))];
    return wrong.length ? { pass: false, verdict: pick(RULES_FAIL), wrong, checked } : { pass: true, verdict: pick(RULES_PASS), checked };
  },
});

// ===================== src/rounds/sokoban.js =====================
// rounds/sokoban.js — SOKOBAN, re-skinned as "Assemble the image".
// A picture (bus, traffic light, robot...) is cut into 2–4 pieces that lie scattered on the grid. The cat pushes them
// (never pulls) into the outlined slots; every piece has ONE right slot (the part of the picture it shows).
// Generation: reverse play ("pulls") from the solved board, then a forward BFS (node cap) proves it solvable and gives
// par = minimum moves. Dead ends are possible in sokoban, so there is a red RESET pad in the footer (walk off the grid
// onto it). The RESET helpers (sokoPad*, sokoRestore) are shared with rules.js.

const SOKO_PICS = {
  h: ['bus', 'car', 'fish', 'bone', 'boat'],               // wide pictures for 1x2 / 1x3 slots
  v: ['trafficlight', 'hydrant', 'cactus', 'tree'],         // tall pictures for 2x1 / 3x1 slots
  s: ['robot', 'house', 'sun', 'pizza', 'crown', 'duck', 'ghost'],   // 2x2
};
const SOKO_PASS = ['The picture is whole again. Like my heart, after you.', 'Jigsaw complete. Humans love jigsaws. Especially on rainy Sundays.', 'Perfectly assembled. Flat-pack furniture fears you.'];
const SOKO_FAIL = ['The picture is still in pieces. So am I.', 'Those pieces do not go there. They told me. Quietly.'];

// ---------- pure helpers (no live grid) ----------
// neighbour of cell i in direction k (0 up, 1 right, 2 down, 3 left) on a cols x rows board, -1 outside
function sokoNb(i, k, cols, rows = cols) {
  const r = Math.floor(i / cols), c = i % cols;
  if (k === 0) return r > 0 ? i - cols : -1;
  if (k === 1) return c < cols - 1 ? i + 1 : -1;
  if (k === 2) return r < rows - 1 ? i + cols : -1;
  return c > 0 ? i - 1 : -1;
}
const SOKO_K = ['U', 'R', 'D', 'L'];
// BFS over (cat, piece cells). Labeled pieces: piece p must end on slots[p]. Returns { len, toks } or null.
function sokoSolve(n, wall, slots, pieces, cat, cap = 160000) {
  const N = n * n, P = pieces.length;
  const enc = (c, ps) => { let k = c; for (let i = 0; i < P; i++) k = k * N + ps[i]; return k; };
  const nodes = [{ c: cat, ps: pieces.slice(), d: 0, par: -1, tok: '' }], seen = new Set([enc(cat, pieces)]);
  for (let h = 0; h < nodes.length; h++) {
    const s = nodes[h];
    if (s.ps.every((p, i) => p === slots[i])) {
      const toks = []; for (let v = h; nodes[v].par >= 0; v = nodes[v].par) toks.push(nodes[v].tok);
      return { len: s.d, toks: toks.reverse(), nodes: nodes.length };
    }
    if (nodes.length > cap) return null;
    for (let k = 0; k < 4; k++) {
      const j = sokoNb(s.c, k, n); if (j < 0 || wall[j]) continue;
      let ps = s.ps; const pi = ps.indexOf(j);
      if (pi >= 0) { const j2 = sokoNb(j, k, n); if (j2 < 0 || wall[j2] || ps.includes(j2)) continue; ps = ps.slice(); ps[pi] = j2; }
      const key = enc(j, ps); if (seen.has(key)) continue; seen.add(key);
      nodes.push({ c: j, ps, d: s.d + 1, par: h, tok: SOKO_K[k] });
    }
  }
  return null;
}
function sokoShapeOf(k, rng) { return k === 2 ? (rng.chance(0.5) ? [1, 2] : [2, 1]) : k === 3 ? (rng.chance(0.5) ? [1, 3] : [3, 1]) : [2, 2]; }

// ---------- shared RESET pad (sokoban + rules) ----------
// the pad sits in a strip under the grid (rounds using it reserve it with SOKO_MARGIN), bottom-left of the GRID box
const SOKO_MARGIN = { b: 38 };
function sokoPadRect() { return { x: GRID.x + 2, y: GRID.y + GRID.h - 32, w: 64, h: 32 }; }
// RESET is a SIT pad (walking across it on the way to VERIFY must not wipe the puzzle). Call sokoPadUpdate from
// update(R) (hover state + hint) and sokoPadSit from onSit (returns true when it handled the sit).
function sokoPadUpdate(R) {
  const on = mode === 'play' && cat.cell < 0 && !cat.mv && inR(cat.x, cat.y, sokoPadRect());
  if (on && !R.padOn) { SFX.tick(); R.padHint = 1.6; }
  R.padOn = on; if (R.padHint > 0) R.padHint -= 1 / 60;
}
function sokoPadSit(R, doReset) {
  if (catCell() >= 0 || !inR(cat.x, cat.y, sokoPadRect())) return false;
  doReset(R); return true;
}
function sokoPadDraw(R, g) {
  const p = sokoPadRect(), on = R.padOn, dy = on ? 3 : 0;
  if (!on) rr(g, p.x + 3, p.y + 6, p.w - 6, p.h - 4, 7, '#a8262b', 0);
  rr(g, p.x, p.y + dy, p.w, p.h - 4, 7, on ? '#c9353a' : C.red, 2.5);
  g.save(); g.translate(p.x + 13, p.y + dy + (p.h - 4) / 2);   // tiny circular arrow
  g.beginPath(); g.arc(0, 0, 6, -0.4, 4.4); g.lineWidth = 2.5; g.strokeStyle = '#fff'; g.lineCap = 'round'; g.stroke();
  poly(g, [[6.5, -6], [7.5, 1], [1, -2]], '#fff', 0); g.restore();
  txt('RESET', p.x + p.w / 2 + 8, p.y + dy + (p.h - 4) / 2 + 1, 11, '#fff', 'center', 700);
  if (on) { const w = 92; rr(g, p.x + p.w + 6, p.y + 4, w, 20, 10, C.ink, 0); txt('sit to reset', p.x + p.w + 6 + w / 2, p.y + 14, 12, '#fff', 'center', 600); }
}
// put every tile back to its generated state (diagonal flip wave), cat back on its start cell
function sokoRestore(R) {
  const span = Math.max(1, G.cols + G.rows - 2);
  for (let i = 0; i < R.tiles.length; i++) {
    const t = setTile(i, R.initTiles[i]);
    tileFlip(t, { delay: (t.r + t.c) / span * 0.2, dur: 0.18, before: { faceDown: true } });
  }
  const f0 = { x: cat.x, y: cat.y };
  catToCell(R.catStart, true); cat.sx = 1.3; cat.sy = 0.75;
  dust(f0.x, f0.y, 6, 16); burst(cat.x, cat.y - 16, C.red, 8, 140, 3);

// ---------- generation ----------
function sokoTry(d, rng, attempt) {
  const n = d < 0.35 ? 4 : 5, N = n * n;
  const k = d < 0.3 ? 2 : d < 0.7 ? 3 : 4;
  const [sh, sw] = sokoShapeOf(k, rng);
  const r0 = rng.int(0, n - sh), c0 = rng.int(0, n - sw), slots = [];
  for (let dr = 0; dr < sh; dr++) for (let dc = 0; dc < sw; dc++) slots.push((r0 + dr) * n + c0 + dc);
  const wall = new Array(N).fill(false);
  const nW = d < 0.3 ? 0 : Math.round(lerp(1, 4, d)) + rng.int(0, 1);
  const free = () => [...Array(N).keys()].filter(i => !wall[i] && !slots.includes(i));
  for (const i of rng.sample(free(), nW)) wall[i] = true;
  const pieces = slots.slice();
  const open = i => i >= 0 && !wall[i] && !pieces.includes(i);
  const cands = [...Array(N).keys()].filter(i => open(i) && [0, 1, 2, 3].some(k => pieces.includes(sokoNb(i, k, n))));
  if (!cands.length) return null;
  let cat = rng.pick(cands);
  // reverse play: the inverse of a push is a PULL (the cat steps away from a piece and drags it along). Mostly pull,
  // sometimes just wander; every intermediate state is reachable backwards, so the start is solvable by construction.
  const steps = Math.round(lerp(40, 70, d)), minSteps = Math.round(lerp(2, 40, d));
  for (let s = 0; s < steps; s++) {
    if (s >= minSteps && pieces.every((p, i) => p !== slots[i])) break;
    const pulls = [], walks = [];
    for (let k = 0; k < 4; k++) {
      const j = sokoNb(cat, k, n); if (!open(j)) continue;
      const back = sokoNb(cat, (k + 2) % 4, n), pi = back >= 0 ? pieces.indexOf(back) : -1;
      (pi >= 0 ? pulls : walks).push([j, pi]);
    }
    if (!pulls.length && !walks.length) break;
    const homeP = pulls.filter(([, pi]) => pieces[pi] === slots[pi]);   // prefer dragging pieces that are still home
    const [j, pi] = pulls.length && (rng.chance(0.65) || !walks.length) ? rng.pick(homeP.length && rng.chance(0.8) ? homeP : pulls) : rng.pick(walks);
    if (pi >= 0) pieces[pi] = cat;
    cat = j;
  }
  const home = pieces.filter((p, i) => p === slots[i]).length;
  if (home > (k === 4 ? 1 : 0)) return null;
  const res = sokoSolve(n, wall, slots, pieces, cat);
  if (!res) return null;
  const relax = Math.floor(attempt / 25) * 2;
  const minL = d === 0 ? 2 : Math.max(3, Math.round(lerp(5, 20, d)) - relax), maxL = d === 0 ? 6 : Math.round(lerp(14, 60, d)) + relax;
  if (res.len < minL || res.len > maxL) return null;
  return { n, wall, slots, pieces, cat, res, shape: [sh, sw] };
}
// hand-made fallback (4x4, 2 pieces, one push each)
function sokoFallback() {
  const n = 4, wall = new Array(16).fill(false), slots = [5, 6], pieces = [9, 10], cat = 13;
  return { n, wall, slots, pieces, cat, res: sokoSolve(n, wall, slots, pieces, cat), shape: [1, 2] };
}

registerRound({

// rounds/spot.js — SPOT THE DIFFERENCE ("Select the square that is different"). Inspired by spot-the-difference / Waldo.

registerRound({
  id: 'spot', name: 'Spot the difference',
  minD: 0.15, weight: 1,
  intro: 'One of these is a fake! Sit on the odd one out, then walk onto VERIFY.',
  again: ['Another impostor. Squint. Humans love squinting.', 'Spot the fake again. I can\'t tell. They all look like icons to me.'],

  generate(d, rng) {

      else if (k === 'blush') tw = { k, what: 'was blushing' };

// rounds/triple.js — TILE EXPLORER / TRIPLE MATCH 3D / ZEN MATCH, re-skinned as "Select all squares in sets of three".
// Cards lie in stacks of 2–4 on the grid cells (lower cards peek out, darkened; only the top card of a cell can be taken).
// SITTING on a cell flies its top card in an arc into the 7-slot tray under the grid (it lands next to its twins). Three
// alike in the tray merge with a pop + sparkle and clear. 7 cards in the tray with no set = the round is lost.
// Clear every card -> auto-verify.

// counts, capped; re-deal if it fails). par = number of cards (one sit each).

const TRI_FAIL = ['The tray is full. It is a very small tray. I am sorry about the tray.', 'Seven cards, no sets. HUMANCHECK suspects a card-counting robot.', 'Tray overflow. I would help, but my hands are mostly decorative.'];

    txt('"suspected robot"', 480, 310, 18, C.red, 'center', 600);

  drawCheckbox(r.x + 24, r.y + 22, 46, false, win ? 'Verify again (why?)' : "I'm STILL not a robot", 24);

function drawOverlay() {

function render() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); // RK, exact for the rounded backing store

  drawPanelBase(); drawHeader();
  if (mode === 'title' || (mode === 'verifying' && V && V.res && V.res.start)) drawTitleFloor();
  else if (mode === 'denied' || mode === 'win') drawEndFloor();
  else { drawGrid(); drawCatHover(); if (R && R.def.drawOverlay) R.def.drawOverlay(R, ctx); }
  drawFooter();

// ===================== src/90-main.js =====================
// ===== 90-main.js: per-frame update, loop, dev hooks (window.DEV, #round=…&d=…&seed=…) =====
function update(dt) {
  if (hitstopT > 0) { hitstopT -= dt; return; }   // freeze frame; inputs stay buffered for the next frame
  time += dt;
  shakeT = Math.max(0, shakeT - dt);
  if (toast.t > 0) toast.t -= dt;
  if (bot.sayT > 0 && bot.sayT < 90) bot.sayT -= dt;
  if (bot.moodT > 0) { bot.moodT -= dt; if (bot.moodT <= 0 && mode !== 'title') bot.mood = 'neutral'; }
  bot.bounce = Math.max(0, bot.bounce - dt * 3);
  updateTweens(dt); updateTimers();
  updateCat(dt); updateEntities(dt);
  if (mode === 'play') updateRound(dt);
  if (R && inRound()) { const n0 = Math.floor(R.typeT * 70); R.typeT += dt; const n1 = Math.floor(R.typeT * 70), L = R.l1.length + R.big.length; if (!REDUCED && n1 !== n0 && n0 < L && n0 % 3 === 0) SFX.type(); }
  if (RUN && !RUN.over && mode !== 'title') RUN.elapsed += dt;
  if (mode === 'verifying') updateVerify(dt);
  if (mode === 'result') { RES.t += dt; if (RES.t > 3.4 || (RES.t > 1.1 && anyPressed)) endResult(); }
  if (mode === 'denied' || mode === 'win') endT += dt;
  if (R && R.tiles) {
    const shrink = R.def.selShrink != null ? R.def.selShrink : 0.82;
    for (const t of R.tiles) {
      t.sa += ((t.sel ? shrink : 1) - t.sa) * Math.min(1, dt * 14);
      if (t.state === 'crumble') { t.t -= dt; if (t.t <= 0) { t.state = 'gone'; t.t = 0; SFX.crumble(); } }
      else if (t.state === 'gone') t.t += dt;
    }
  }
  updateParts(dt); updateStamps(dt);
  try { musicTick(); } catch (e) {}
  for (const k in pressed) pressed[k] = false; anyPressed = false;
}

// ===== Loop =====
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); render(); requestAnimationFrame(frame);
}

// ===== Dev hooks =====
// DEV.play('lights', 0.6, 42)  jump straight into one round (a 1-round run; pass -> ACCESS GRANTED, fail -> DENIED)
// DEV.run(seed)                 start a full 12-round run with that seed;  DEV.makeRun(seed) -> slots without starting
// DEV.state()                   JSON snapshot (mode, round, tiles, cat, run, last result)
// DEV.warp(cell)                put the cat on a cell;  DEV.foot(cell) -> {x,y} where the cat stands on that cell
window.DEV = {
  play(id, d = 0.5, seed, intro = false) {
    if (!ROUNDS[id]) throw new Error('unknown round type: ' + id + ' (have: ' + Object.keys(ROUNDS).join(', ') + ')');
    if (seed == null) seed = (Math.random() * 1e9) >>> 0;
    d = clamp(+d, 0, 1);
    newRun({ seed, slots: [{ i: 0, id, d, genD: intro ? 0 : d, intro: !!intro, seed: hashSeed(seed, 'slot', 0, id), prep: null }], daily: false, day: 0, dev: true });
    return DEV.state();
  },
  run(seed, opts = {}) { startRun(Object.assign({ seed: seed == null ? undefined : seed }, opts)); return DEV.state(); },
  daily() { startRun({ daily: true }); return DEV.state(); },
  makeRun(seed) { return makeRun(seed).slots.map(s => ({ id: s.id, d: s.d, genD: s.genD, intro: s.intro })); },
  types() { return Object.values(ROUNDS).map(t => ({ id: t.id, name: t.name, minD: t.minD, weight: t.weight, maxPerRun: t.maxPerRun, boss: !!t.boss, hidden: !!t.hidden })); },
  title() { toTitle(); return DEV.state(); },
  warp(i) { catToCell(i, true); if (!isStepMode()) cat.cell = i; return DEV.state().cat; },
  foot(i) { return cellFoot(i); },
  state() {
    const T = R && R.tiles ? R.tiles.map(t => { const o = {}; for (const k of ['icon', 'sel', 'faceDown', 'word', 'pipe', 'rot', 'wall', 'push', 'empty', 'lit', 'state']) if (t[k] !== undefined && t[k] !== false) o[k] = t[k]; return o; }) : null;
    return {
      mode, roundIdx, verified, strikes, time,
      run: RUN && { seed: RUN.seed, daily: RUN.daily, day: RUN.day, dev: !!RUN.dev, perfects: RUN.perfects, streak: RUN.streak, elapsed: RUN.elapsed, results: RUN.results,
        slots: RUN.slots.map(s => ({ id: s.id, d: s.d, genD: s.genD, intro: s.intro })) },
      round: R && { id: R.id, d: R.d, intro: R.intro, slot: R.slot, cols: G.cols, rows: G.rows, l1: R.l1, big: R.big, l3: R.l3,
        progress: R.def.progress ? R.def.progress(R) : null, par: R.par, stats: R.stats, timeLeft: R.timeLeft, limit: R.limit, verify: R.def.verify, move: R.def.move,
        tiles: T, selected: selected(), solution: R.solution || null, ents: (R.ents || []).map(e => ({ cell: e.cell, x: e.x, y: e.y })) },
      grid: { x: G.x, y: G.y, w: G.w, h: G.h, pitch: G.pitch, ts: G.ts },
      cat: { x: cat.x, y: cat.y, cell: catCell(), moving: !!cat.mv, pad: cat.pad },
      verify: V && { phase: V.phase, async: V.async },
      res: RES && { pass: RES.pass, verdict: RES.verdict, perfect: RES.perfect, wrong: RES.wrong },
    };
  },
};
function parseHash() {
  const h = decodeURIComponent((location.hash || '').slice(1)); if (!h) return;
  try {
    if (h.includes('=')) {
      const q = new URLSearchParams(h), id = q.get('round');
      if (id) DEV.play(id, q.get('d') != null ? +q.get('d') : 0.5, q.get('seed') != null ? +q.get('seed') : undefined, q.get('intro') === '1');
      else if (q.get('run') != null) DEV.run(+q.get('run'));
    } else {
      const p = h.split(/[-_,]/);   // bare token form: #lights or #lights-0.6-42 (only bare #tokens reach the artifact viewer)
      if (p[0] === 'daily') DEV.daily();
      else if (p[0] === 'run' && p[1]) DEV.run(+p[1]);
      else if (ROUNDS[p[0]]) DEV.play(p[0], p[1] ? +p[1] : 0.5, p[2] ? +p[2] : undefined);
    }
  } catch (e) { console.warn('bad dev hash', h, e); }
}

// ===== Boot =====
say(pick(LINES.title), 'sad', 99);
toTitle();
parseHash();
addEventListener('hashchange', parseHash);
requestAnimationFrame(frame);
