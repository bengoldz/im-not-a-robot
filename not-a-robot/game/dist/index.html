// ===== Seeded RNG =====
// mulberry32: tiny, fast, good enough for puzzles. makeRng(seed) returns a function () -> [0,1) with helpers.
function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// hash any mix of numbers/strings into a 32-bit seed (FNV-1a)
function hashSeed(...parts) {
  let h = 2166136261 >>> 0;
  for (const p of parts) { const s = String(p) + '|'; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } }
  return h >>> 0;
}
function makeRng(seed) {
  const f = mulberry32(seed >>> 0), r = () => f();
  r.seed = seed >>> 0;
  r.f = (a = 0, b = 1) => a + f() * (b - a);                       // float in [a,b)
  r.int = (a, b) => a + Math.floor(f() * (b - a + 1));              // int in [a,b] inclusive
  r.pick = arr => arr[Math.floor(f() * arr.length)];
  r.shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  r.chance = p => f() < p;
  r.sample = (arr, k) => r.shuffle(arr).slice(0, k);               // k distinct items
  r.weighted = (items, w) => { const ws = items.map(w), tot = ws.reduce((s, x) => s + x, 0); let u = f() * tot; for (let i = 0; i < items.length; i++) { u -= ws[i]; if (u < 0) return items[i]; } return items[items.length - 1]; };
  r.fork = (...tag) => makeRng(hashSeed(r.seed, ...tag));          // independent child stream
  return r;
}

const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  Space:'hop', ShiftLeft:'dash', ShiftRight:'dash', KeyC:'sit', KeyX:'sit' };
const key = {}, pressed = {};
let lastInputT = 0, anyPressed = false, firstKey = false;
function onFirstInput() { audio(); if (!firstKey) { firstKey = true; try { musicStart(); } catch (e) {} } }
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); onFirstInput();
  if (!e.repeat) { pressed[k] = true; anyPressed = true; } key[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { key[k] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in key) key[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); onFirstInput(); if (!key[k]) { pressed[k] = true; anyPressed = true; } key[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); key[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});

const timers = [];

function updateTimers() {

// ---------- screen shake (BUDGET ENFORCED) ----------

// Do not add other callers: selection / pushes / pops / success use squash, flashes and particles instead.

// ---------- music: soft 2-chord loop, one more layer every 3 rounds; starts after the first keypress ----------
let musicOn = true, musicNext = 0, musicBeat = 0, MUSIC = null;
const MUSIC_BPM = 84, MUSIC_CHORDS = [[48, 55, 64, 71], [53, 57, 60, 64]];   // Cmaj7, Fmaj7 (midi)
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

function musicLayers() { return mode === 'play' || mode === 'verifying' || mode === 'result' ? 1 + Math.floor(roundIdx / 3) : 1; }
function musicTick() {
  if (!AC || !MUSIC || AC.state !== 'running') return;
  MUSIC.gain.value = musicOn ? 0.5 : 0;
  const spb = 60 / MUSIC_BPM / 2;   // eighth notes
  while (musicNext < AC.currentTime + 0.25) {
    const b = musicBeat, chord = MUSIC_CHORDS[Math.floor(b / 16) % 2], t = musicNext - AC.currentTime, L = musicLayers();
    if (musicOn) {
      if (b % 16 === 0) chord.forEach(m => tone(midiHz(m), spb * 16, 'sine', 0.012, 0, t, 0.5, MUSIC));                 // pad
      if (L >= 2 && b % 4 === 0) tone(midiHz(chord[0] - 12), spb * 3, 'triangle', 0.03, 0, t, 0.02, MUSIC);            // bass
      if (L >= 3 && b % 2 === 0) tone(midiHz(chord[(b / 2) % 4] + 12), spb * 1.6, 'sine', 0.012, 0, t, 0.01, MUSIC);     // arp
      if (L >= 4 && b % 4 === 2) noise(0.04, 0.012, t, 0, 6000, MUSIC);                                                 // soft hat
    }
    musicBeat++; musicNext += spb;
  }
}

// ===================== src/30-director.js =====================
// ===== 30-director.js: round registry, runs (seeded), difficulty director, round lifecycle, verify flow, pads =====
// See game/API.md for the full contract. Summary of registerRound(def):
//   id, name, minD (0..1, earliest difficulty it may appear), weight (pick weight), maxPerRun (default 2),
//   boss (true = only ever the last slot), hidden (true = never picked by the director; DEV.play only),
//   intro (robot line on the first appearance), again (robot line(s) on later appearances),
//   move 'free' | 'step', verify 'pad' | 'auto' | 'both' | 'none', exitGrid (step mode: may the cat walk off the grid), hideBot, loaf,
//   timeoutVerdict, parTime(R),
//   generate(d, rng, info) -> spec           REQUIRED. Pure + seeded (use rng, never Math.random). Must be solvable.
//   prepare(slot, rng) -> Promise|value       optional, called while the PREVIOUS round plays; result arrives as info.prep
//   enter(R)                                  once, after the grid + tiles exist
//   update(R, dt)                             every frame while mode === 'play'
//   onSit(R, tile|null, info)                 cat sat down (tile null = not on a grid cell). Omit = default select toggle.
//   onStep(R, from, to, info)                 cat moved between cells (-1 = off grid). info = { dir:[dr,dc], how }
//   onHop(R, from, to, info)                  cat landed a hop. info = { dir, over }
//   canEnter(R, from, to, info) -> bool|undef  override whether the cat may enter cell `to` (undefined = default rules)
//   moveCat(R, from, dir, how) -> cells[]|{path, how}|null   step mode: override the path of one move (ice sliding etc.)
//   onPush(R, tile, from, to)                 a pushable tile was pushed
//   solved(R) -> bool                         for verify 'auto' / 'both'
//   judge(R) -> { pass, verdict, wrong?, checked?, banned? } | Promise of it
//   progress(R) -> string                     header readout, e.g. "Lights 18 / 25"
//   drawTile(R, g, tile, x, y, s) -> bool     custom tile face (return true = handled, false/undefined = default face)
//   drawUnder(R, g) / drawOverlay(R, g) / drawTop(R, g)   before tiles / after tiles (under the cat) / above the cat
//   onTimeout(R)                              timer ran out (default: fail with timeoutVerdict)
const ROUNDS = {};
const RUN_LEN = 12;
function registerRound(def) {
  if (!def || typeof def.id !== 'string' || typeof def.generate !== 'function') throw new Error('registerRound: needs id and generate()');
  if (ROUNDS[def.id]) console.warn('registerRound: replacing', def.id);
  ROUNDS[def.id] = Object.assign({ name: def.id, minD: 0, weight: 1, maxPerRun: 2, move: 'free', verify: 'pad', exitGrid: true, intro: '' }, def);
  return ROUNDS[def.id];
}

// ===== Runs =====
// Daily seed: everyone gets the same run on the same (local) date. Day #1 = 2026-01-01.
function dailyInfo(date = new Date()) {
  const y = date.getFullYear(), m = date.getMonth(), d = date.getDate(), key = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  return { seed: hashSeed('daily', key), day: Math.floor((Date.UTC(y, m, d) - Date.UTC(2026, 0, 1)) / 864e5) + 1, key };

// Pure: the same seed always gives the same slots. Rules (DESIGN §1): d = i/11 ± 0.08; minD/weight picking; no type twice in a
// row; max maxPerRun per run (match 3); first appearance = intro (generated at d 0); last slot = boss; >= 1 absurd in slots 3..8.
function makeRun(seed, opts = {}) {
  seed = seed >>> 0;
  const rng = makeRng(hashSeed(seed, 'director')), len = opts.len || RUN_LEN;
  const all = Object.values(ROUNDS), pool = all.filter(t => !t.boss && !t.hidden && t.weight > 0), boss = all.find(t => t.boss && !t.hidden);
  const ab = ROUNDS.absurd && !ROUNDS.absurd.hidden ? ROUNDS.absurd : null;
  const absurdSlot = ab && len >= 10 ? rng.int(3, 8) : -1;
  const slots = [], counts = {}; let prev = null;
  for (let i = 0; i < len; i++) {
    const d = clamp((len > 1 ? i / (len - 1) : 0) + rng.f(-0.08, 0.08), 0, 1);
    let id;
    if (i === len - 1 && boss) id = boss.id;
    else if (i === absurdSlot) id = ab.id;
    else {
      const ok = (t, relax) => t.id !== prev && (relax >= 1 || t.minD <= d + 1e-9) && (relax >= 2 || (counts[t.id] || 0) < t.maxPerRun)
        && !(t === ab && (i === absurdSlot - 1 || i === absurdSlot + 1 || (i < absurdSlot && (counts[t.id] || 0) >= t.maxPerRun - 1)));
      let cands = [];
      for (let relax = 0; relax < 3 && !cands.length; relax++) {
        cands = pool.filter(t => ok(t, relax));
        if (relax >= 1 && cands.length) { const lo = Math.min(...cands.map(t => t.minD)); cands = cands.filter(t => t.minD <= lo + 1e-9); }   // nothing fits: the gentlest types only
      }
      if (!cands.length) cands = pool.filter(t => t.id !== prev);
      if (!cands.length) cands = pool;
      id = rng.weighted(cands, t => t.weight).id;
    }
    const intro = !counts[id], def = ROUNDS[id];
    counts[id] = (counts[id] || 0) + 1;
    const dr = Math.round(d * 1000) / 1000;
    slots.push({ i, id, d: dr, genD: intro && !def.boss ? 0 : dr, intro, seed: hashSeed(seed, 'slot', i, id), prep: null });
    prev = id;

function newRun(run) {
  RUN = Object.assign(run, { perfects: 0, streak: 0, bestStreak: 0, results: [], usedAbsurd: [], elapsed: 0, over: false });
  verified = 0; strikes = 0; parts.length = 0;
  beginRound(0);
}
function startRun(opts = {}) {
  let seed = opts.seed, day = 0;
  if (opts.daily) { const di = dailyInfo(); seed = di.seed; day = di.day; }
  if (seed == null) seed = (Math.random() * 4294967296) >>> 0;
  newRun(makeRun(seed, { daily: !!opts.daily, day }));

// ===== Round lifecycle =====

      cands.push([i, k]);
      if (placed.some(q => arrOnRoad(q, b[q].d, i, n, n))) chain.push([i, k]);   // it parks on an older card's road
    }
    if (!cands.length) return null;
    const [i, k] = chain.length && rng.chance(bias) ? rng.pick(chain) : rng.pick(cands);
    b[i] = { d: k, rot: false }; placed.push(i);

}
// turn some cards into rotating ones: start direction = planned direction minus the turns it will make before its turn
function arrAddRot(L, n, m, rng) {

  const before = c => { let k = 0; for (let q = 0; q < 4; q++) { const j = arrNb(c, q, n, n); if (j >= 0 && L.b[j] && pos.get(j) < pos.get(c)) k++; } return k; };

function arrGenerate(d, rng) {

  const b = nRot ? arrAddRot(best, n, nRot, rng) : best.b;
  const order = arrSolve(b, n, n);
  if (!order) throw new Error('arrows: unsolvable deal');   // (cannot happen: the plain backwards build is always solvable)
  return { n, b, order, depth: best.depth, nRot: b.filter(t => t && t.rot).length };

// ---------- drawing helpers ----------
// a bold arrow pointing up (rotated by ang), centred on x, y, in a badge of radius r
function arrDrawArrow(g, x, y, r, ang, col = '#fff') {
  g.save(); g.translate(x, y); g.rotate(ang);
  g.beginPath(); g.moveTo(0, -r * 0.72); g.lineTo(r * 0.58, -r * 0.08); g.lineTo(r * 0.22, -r * 0.08); g.lineTo(r * 0.22, r * 0.62);
  g.lineTo(-r * 0.22, r * 0.62); g.lineTo(-r * 0.22, -r * 0.08); g.lineTo(-r * 0.58, -r * 0.08); g.closePath();
  g.fillStyle = col; g.fill(); g.restore();
}
// the card face: icon tile on a white card, ink outline, arrow badge in the top-right corner
function arrDrawCard(g, icon, dirAng, rot, x, y, s) {
  const rad = s * 0.14, lw = Math.max(2, s * 0.045);
  rr(g, x + 1, y + 1, s - 2, s - 2, rad, '#fff', 0);
  g.save(); g.beginPath(); g.roundRect(x + s * 0.07, y + s * 0.07, s * 0.86, s * 0.86, rad * 0.7); g.clip();
  g.drawImage(iconTile(icon, Math.round(s)), x + s * 0.07, y + s * 0.07, s * 0.86, s * 0.86); g.restore();
  g.lineWidth = lw; g.strokeStyle = C.ink; g.beginPath(); g.roundRect(x + 1 + lw / 2, y + 1 + lw / 2, s - 2 - lw, s - 2 - lw, rad); g.stroke();
  const br = s * 0.2, bx = x + s - br - s * 0.05, by = y + br + s * 0.05;
  circ(g, bx + 1.5, by + 2, br, 'rgba(29,36,51,.25)', 0);
  circ(g, bx, by, br, rot ? '#ff8c42' : C.blue, Math.max(2, s * 0.035));
  if (rot) {   // rotating card: a little circular-arrow ring around the badge
    g.save(); g.beginPath(); g.arc(bx, by, br * 1.32, -2.4, 0.9); g.lineWidth = Math.max(2, s * 0.03); g.strokeStyle = '#ff8c42'; g.lineCap = 'round'; g.stroke();
    const a = 0.9, ex = bx + Math.cos(a) * br * 1.32, ey = by + Math.sin(a) * br * 1.32;

}
function arrHeart(g, x, y, s, fill, lw = 2.5) {
  g.beginPath(); g.moveTo(x, y + s * 0.38);
  g.bezierCurveTo(x - s * 0.62, y - s * 0.02, x - s * 0.42, y - s * 0.62, x, y - s * 0.26);
  g.bezierCurveTo(x + s * 0.42, y - s * 0.62, x + s * 0.62, y - s * 0.02, x, y + s * 0.38); g.closePath();

// ---------- runtime ----------
function arrLaunch(R, t) {
  const i = t.i, k = t.adir, c = cellCenter(i), half = G.ts * 0.42;
  const L = k === 0 ? c.y - (PANEL.y + 6) - half : k === 1 ? PANEL.x + PANEL.w - 6 - c.x - half : k === 2 ? PANEL.y + PANEL.h - 6 - c.y - half : c.x - (PANEL.x + 6) - half;
  const v0 = 140, acc = 2600, tHit = (-v0 + Math.sqrt(v0 * v0 + 2 * acc * Math.max(10, L))) / acc;   // s = v0 t + acc t^2 / 2
  R.flyers.push({ icon: t.icon, k, rot: !!t.arot, x0: c.x, y0: c.y, t0: time, v0, acc, L: Math.max(10, L), tHit, s: G.ts });
  setTile(i, { empty: true });
  R.cleared++;
  SFX.whoosh(); SFX.pop(R.cleared - 1); tone(380, 0.18, 'sine', 0.035, 520);
  dust(c.x - ARR_DC[k] * G.ts * 0.3, c.y - ARR_DR[k] * G.ts * 0.3 + G.ts * 0.2, 6, G.ts * 0.5);
  burst(c.x, c.y, C.blue, 7, 130, 3);
  addTxt(c.x, c.y - G.ts * 0.5, pick(['bye!', 'whoosh', 'home ✓', 'zoom']), C.blue);
  after(tHit, () => {   // the little bounce off the panel edge
    const ex = c.x + ARR_DC[k] * (L + half), ey = c.y + ARR_DR[k] * (L + half);
    burst(ex, ey, '#ffd25a', 6, 110, 3); tone(880, 0.06, 'triangle', 0.03); tone(1320, 0.05, 'sine', 0.015, 0, 0.03);
  });
  // rotating neighbours turn a quarter clockwise (spring)
  let turned = 0;
  for (let q = 0; q < 4; q++) {
    const j = stepCell(i, DIR4[q]), u = j >= 0 ? R.tiles[j] : null;
    if (!u || !u.arot || u.adir == null) continue;
    u.adir = (u.adir + 1) % 4; u.aspin = 1; tween(u, { aspin: 0 }, 0.4, { ease: 'spring', delay: 0.05 });
    after(0.05 + turned * 0.04, () => { SFX.toggle(5 + turned); const p = cellCenter(j); burst(p.x + G.ts * 0.28, p.y - G.ts * 0.28, '#ff8c42', 5, 90, 3); });
    turned++;

  if (R.cleared < R.total && !R.tiles.some(u => u.adir != null && arrBlocker(u.i, u.adir, G.cols, G.rows, j => R.tiles[j].adir != null) < 0)) {

}
function arrBonk(R, t, blk) {
  const k = t.adir, [r0, c0] = rcOf(t.i), [r1, c1] = rcOf(blk), dist = Math.abs(r1 - r0) + Math.abs(c1 - c0);
  const slide = (dist - 1) * G.pitch + G.gap + 2, f = tileFx(t), dur = 0.06 + 0.055 * dist;
  t.abusy = true; R.hearts--;
  const out = R.hearts <= 0; if (out) R.over = true;
  tone(300, dur, 'triangle', 0.025, 220);
  tween(f, { ox: ARR_DC[k] * slide, oy: ARR_DR[k] * slide }, dur, { ease: x => x * x, done: () => {
    const p = cellCenter(blk), bt = R.tiles[blk];
    SFX.bonk(); tileSquash(bt, 0.9, 1.05, 0.22);
    const cx = p.x - ARR_DC[k] * G.pitch / 2, cy = p.y - ARR_DR[k] * G.pitch / 2;
    burst(cx, cy, '#ffd25a', 7, 120, 3); addTxt(cx, cy - 14, 'bonk!', C.red);
    R.heartFx = { k: R.hearts, t0: time }; R.heartsShown = R.hearts;
    tween(f, { ox: 0, oy: 0 }, 0.32, { ease: 'outBack', done: () => { tileWiggle(t, 0.3); t.abusy = false; } });
    after(0.12, () => tone(240, 0.22, 'sine', 0.05, -120));
    if (out) after(0.75, () => finish({ pass: false, verdict: pick(ARR_FAIL) }));
    else say(pick(ARR_OUCH), 'nervous', 2.4);
  } });
}

registerRound({

  move: 'step', exitGrid: false, verify: 'auto', autoDelay: 0.75, noCheck: true,

  generate(d, rng) {
    const A = arrGenerate(d, rng), n = A.n, N = n * n, theme = rng.pick(ARR_THEMES);
    const tiles = A.b.map(t => t ? { icon: rng.pick(theme), adir: t.d, arot: t.rot, noSelect: true } : { empty: true });
    // the cat starts on an empty cell near the bottom middle if there is one (else the bottom middle card)
    const mid = (n - 1) * n + Math.floor(n / 2), empties = [...Array(N).keys()].filter(i => !A.b[i]);
    const dist = i => Math.abs(Math.floor(i / n) - (n - 1)) * 1.2 + Math.abs(i % n - Math.floor(n / 2));
    const catStart = empties.length ? empties.sort((a, b) => dist(a) - dist(b))[0] : mid;
    return {
      grid: n, margin: { t: 30 }, tiles, catStart,
      l1: 'Select all squares', big: 'to send them home',
      l3: A.nRot ? 'Orange arrows turn as neighbours leave.' : 'Sit = launch it. Bonks cost hearts.',
      par: { sits: A.order.length }, solution: A.order, total: A.order.length, heartsMax: d < 0.6 ? 3 : 2, depth: A.depth,
    };
  },

  enter(R) { R.cleared = 0; R.hearts = R.heartsShown = R.heartsMax; R.flyers = []; R.heartFx = null; R.over = false; },

  onSit(R, tile) {
    if (!tile || tile.adir == null) { addTxt(cat.x, cat.y - 50, tile ? pick(['just floor', 'sat on nothing', 'floor: still floor']) : 'sat.', C.grey); return; }
    if (tile.abusy || R.over) return;

  drawTile(R, g, t, x, y, s) {
    if (t.adir == null) return false;
    arrDrawCard(g, t.icon, (t.adir - (t.aspin || 0)) * Math.PI / 2, t.arot, x, y, s);

  },
  drawUnder(R, g) {
    // hearts ("mistakes left") in the strip above the grid
    const y = G.area.y - 14, n = R.heartsMax, hs = 18, x1 = G.x + G.w - 4;
    txt('mistakes left', x1 - n * 24 - 6, y, 13, C.grey, 'right', 600);
    for (let k = 0; k < n; k++) {
      const hx = x1 - (n - 1 - k) * 24 - 9, alive = k < R.heartsShown, fx = R.heartFx && R.heartFx.k === k ? clamp((time - R.heartFx.t0) / 0.5, 0, 1) : 1;
      if (alive) { const b = 1 + 0.06 * Math.sin(time * 4 + k); arrHeart(g, hx, y, hs * b, C.red); continue; }
      arrHeart(g, hx, y, hs, '#e3e8f1', 2);

        g.restore();

    }
  },
  drawOverlay(R, g) {
    // where the card under the cat would go: a dotted road to the edge (under the cat)
    const i = mode === 'play' && !cat.mv ? catCell() : -1, t = i >= 0 ? R.tiles[i] : null;
    if (!t || t.adir == null || t.abusy) return;
    const c = cellCenter(i), k = t.adir, edge = k === 0 ? G.y - 4 : k === 1 ? G.x + G.w + 4 : k === 2 ? G.y + G.h + 4 : G.x - 4;
    const ex = k % 2 ? edge : c.x, ey = k % 2 ? c.y : edge;
    g.save(); g.setLineDash([3, 7]); g.lineDashOffset = -time * 30; g.lineWidth = 3.5; g.lineCap = 'round'; g.strokeStyle = 'rgba(47,111,228,.75)';
    g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(ex, ey); g.stroke(); g.restore();
    arrDrawArrow(g, ex, ey, 11, k * Math.PI / 2, 'rgba(47,111,228,.9)');
  },
  drawTop(R, g) {
    // flying cards: accelerate along the arrow, speed trail, bounce off the panel edge, fade
    R.flyers = R.flyers.filter(f => time - f.t0 < f.tHit + 0.45);
    for (const f of R.flyers) {
      const tau = time - f.t0, dx = ARR_DC[f.k], dy = ARR_DR[f.k], pos = u => Math.min(f.L, f.v0 * u + f.acc * u * u / 2);

      const x = f.x0 + dx * s, y = f.y0 + dy * s;

        const gr = g.createLinearGradient(tx, ty, x, y); gr.addColorStop(0, 'rgba(47,111,228,0)'); gr.addColorStop(1, 'rgba(47,111,228,.35)');
        g.save(); g.lineCap = 'round'; g.strokeStyle = gr; g.lineWidth = w; g.beginPath(); g.moveTo(tx, ty); g.lineTo(x, y); g.stroke();
        g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2.5;

        g.restore();
      }
      g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(spin); g.scale(sc, sc);
      arrDrawCard(g, f.icon, f.k * Math.PI / 2, f.rot, -f.s / 2, -f.s / 2, f.s); g.restore();
    }
  },

  progress: R => `Cleared ${R.cleared} / ${R.total}`,
  solved: R => R.cleared >= R.total,
  judge(R) {

// rounds/boss.js — always the last slot: "select all squares containing a robot" while your robot friend hides on the
// grid, hopping between squares. Selecting him = FRIEND BANNED.
registerRound({
  id: 'boss', name: 'Final check', boss: true, minD: 0, weight: 0, hideBot: true, mood: 'nervous',
  intro: 'Okay. Act natural. I am a... lamp. Don\'t select me.',
  generate(d, rng) {
    const n = 4, N = n * n, k = rng.int(4, 5), hit = rng.sample([...Array(N).keys()], k).sort((a, b) => a - b);
    const others = ICONS.filter(x => !['robot', 'toaster'].includes(x));
    return { grid: n, tiles: [...Array(N).keys()].map(j => ({ icon: hit.includes(j) ? 'robot' : rng.pick(others) })), hit, friendStart: rng.pick(hit),
      hopEvery: [lerp(3.4, 2.6, d), lerp(4.6, 3.6, d)],
      l1: 'FINAL CHECK. Select all squares containing', big: 'a robot', l3: 'All of them. Every single robot.' };
  },
  enter(R) { R.friend = { tile: R.friendStart, x: 0, y: 0, moveT: 3.5, hop: 0 }; },
  parTime: () => 22,
  update(R, dt) {
    const f = R.friend; f.moveT -= dt;
    if (f.moveT <= 0) {
      f.moveT = R.rng.f(R.hopEvery[0], R.hopEvery[1]);
      const nb = neighbors4(f.tile).filter(i => !R.tiles[i].sel), bots = nb.filter(i => R.tiles[i].icon === 'robot');
      if (nb.length) { f.prev = f.tile; f.tile = (bots.length && R.rng.chance(0.6)) ? R.rng.pick(bots) : R.rng.pick(nb); f.hop = 1; SFX.beep(); }
      if (R.tiles[f.tile].sel) say('Uh. I am standing on a checked square. Is that bad?', 'nervous', 3);
    }
    const p = cellXY(f.tile), tx = p.x + G.ts / 2, ty = p.y + G.ts * 0.8;
    if (!f.x) { f.x = tx; f.y = ty; } f.x += (tx - f.x) * Math.min(1, dt * 6); f.y += (ty - f.y) * Math.min(1, dt * 6); f.hop = Math.max(0, f.hop - dt * 2.5);
  },
  onSit(R, tile) {
    defaultSit(R, tile);
    if (tile && tile.sel && tile.i === R.friend.tile) { say('Hey! HEY! That\'s me! Unsit! UNSIT!', 'nervous', 3); SFX.beep(); }
  },
  drawOverlay(R) {
    const f = R.friend; if (!f || !f.x) return;
    const sel = R.tiles[f.tile].sel;
    ctx.save(); ctx.translate(0, -Math.sin(f.hop * Math.PI) * 16); drawBot(f.x, f.y, 0.42, sel ? 'nervous' : 'neutral', 'friend'); ctx.restore();
    if (sel) txt('!', f.x + 22, f.y - 76, 26, C.red, 'center', 700);
  },
  judge(R) {
    // he freezes when you verify: judge the square he is VISIBLY on. Caught mid-hop (still nearer his old square), the hop
    // is undone; otherwise he lands. Either way he snaps onto the judged square.
    const f = R.friend, at = i => { const p = cellXY(i); return { x: p.x + G.ts / 2, y: p.y + G.ts * 0.8 }; };
    if (f.prev != null && f.x) { const a = at(f.tile), b = at(f.prev); if (Math.hypot(f.x - b.x, f.y - b.y) < Math.hypot(f.x - a.x, f.y - a.y)) f.tile = f.prev; }
    if (f.x) { const p = at(f.tile); f.x = p.x; f.y = p.y; } f.hop = 0;
    const sel = selected(), set = new Set(R.hit), ft = f.tile;
    if (sel.includes(ft)) return { pass: false, verdict: 'Robot detected: your friend. Banned for 1000 years.', banned: true, wrong: [ft] };
    const want = R.hit.filter(j => j !== ft), wrong = sel.filter(j => !set.has(j)), miss = want.filter(j => !sel.includes(j));
    if (!wrong.length && !miss.length) return { pass: true, verdict: 'All robots removed. Only humans remain. Welcome.' };
    if (wrong.length) return { pass: false, verdict: `That is a ${iconName(R.tiles[wrong[0]].icon)}. Not a robot. Rude.`, wrong: wrong.concat(miss) };
    return { pass: false, verdict: 'A robot slipped through. We are... checking who.', wrong: miss };
  },
  progress: R => `${selected().length} selected`,
});

// ===================== src/rounds/busjam.js =====================
// rounds/busjam.js — BUS JAM / BUS OUT, re-skinned as "Select all passengers in the correct order".
// A queue of coloured buses waits on the road above the grid; the front one sits at the stop. The grid is a crowd of
// little passengers. The cat walks on empty cells only (it can HOP over one passenger onto an empty cell) and SITS
// next to a passenger to call them (the one it faces: bump into a passenger to face it). A called passenger walks to
// the top edge along a free path of empty cells; no free path = a shrug and a "?". Matching the front bus: it boards
// (3 seats, then the bus honks off and the next one pulls up; waiting passengers of the new colour hop straight on).
// Otherwise it waits in the small holding row under the stop. Holding row overflows = fail. Everyone aboard = pass.
// Generation: an empty "channel" from the top row (+ hop-only pockets at higher d), colours assigned along a random
// legal calling order in bus order (always solvable), then a few colour swaps; a 0-1 BFS over (remaining passengers,
// holding row, cat region) checks it is still solvable and gives par = the fewest passengers that must wait.

const BJ_PASS = ['Everyone boarded. Not one passenger left behind. I am leaking a small amount of oil.', 'All aboard! Public transport is the most human thing there is.', 'Perfect boarding. The bus drivers honked in your honour.'];
const BJ_FAIL = ['The waiting row overflowed. Someone is sitting on someone. Very unhuman.', 'Too many people waiting. They have started a book club. Out of spite.', 'Overcrowded! I would offer my seat, but I am a robot and I only have treads.'];
// passenger / bus colours: base, shade, light, symbol (for colour-blind players: also on shirts and bus plates)
const BJ_COL = [['#e5484d', '#b8323a', '#ff9a9d', 'circle'], ['#2f6fe4', '#1f4fb0', '#8fb3f6', 'tri'], ['#22b573', '#168a55', '#86dfb3', 'square'],
  ['#ffc93c', '#e09f12', '#ffe597', 'star'], ['#9b6bd8', '#7349b5', '#cdb1f2', 'diamond']];
const BJ_SKIN = ['#ffd9b8', '#f2c197', '#d39a6a', '#9c6644'], BJ_HAIR = ['#3b2a20', '#6b4423', '#d9a441', '#1d2433', '#b5552c'];

registerRound({
  id: 'busjam', name: 'Bus Jam',
  minD: 0.4, weight: 1,
  intro: 'Sit next to a passenger to call them. Same colour as the bus? On they hop. Others wait in the little row. Do not let it overflow!',
  again: ['Rush hour again! Call passengers in bus order. The buses are very particular.', 'More passengers. The waiting row only has so much row.'],
  move: 'step', verify: 'auto', exitGrid: false, autoDelay: 0.3, noCheck: true, selShrink: 1,

  generate(d, rng) {
    const L = bjGenerate(d, rng), N = L.cols * L.rows;
    const pax = new Array(N).fill(-1), look = new Array(N).fill(null);
    L.cells.forEach((c, b) => { pax[c] = L.colors[b]; look[c] = { skin: rng.pick(BJ_SKIN), hair: rng.pick(BJ_HAIR), ph: rng.f(0, 6.28) }; });
    return {
      cols: L.cols, rows: L.rows, margin: { t: BJ_TOP },
      tiles: [...Array(N)].map(() => ({ empty: true, noSelect: true })),
      catStart: L.cat0, pax0: pax, look, buses: L.buses, holdN: L.H, paxCells: L.cells,
      l1: 'Select all passengers', big: 'in the correct order', l3: 'Sit beside one to call it.',
      par: { waits: L.waits }, solution: bjTokens(L.cols, L.rows, L.cells, L.order, L.cat0) || [],
    };
  },

  enter(R) {
    R.pax = R.pax0.slice(); R.bus = 0; R.seats = 0; R.hold = new Array(R.holdN).fill(-1); R.stats.waits = 0;
    R.evq = []; R.ev = null; R.pend = null; R.faceDir = DIRS.up; R.allGone = false; R.failed = false;
    R.vBus = 0; R.vSeats = []; R.vHold = new Array(R.holdN).fill(null); R.vOver = null; R.busOff = 0; R.qOff = 0; R.busSq = 1;
    R.walker = null; R.hopper = null; R.shrug = null; R.bubbles = [];
  },
  update(R, dt) {
    for (const b of R.bubbles) b.t += dt; R.bubbles = R.bubbles.filter(b => b.t < b.life);
    if (R.shrug) { R.shrug.t += dt; if (R.shrug.t > 1) R.shrug = null; }
    if (!R.ev && R.evq.length) { R.ev = R.evq.shift(); R.ev.t = 0; bjStart(R, R.ev); }
    if (R.ev) { R.ev.t += dt; if (bjTick(R, R.ev, dt)) R.ev = null; }
    if (!R.ev && !R.evq.length && R.pend != null && mode === 'play') { const p = R.pend; R.pend = null; if (R.pax[p] >= 0) bjCall(R, p); }
  },

  canEnter(R, from, to) { return R.pax && R.pax[to] >= 0 ? false : undefined; },
  onMove(R, from, dir) { R.faceDir = dir; },
  onSit(R, tile) {
    const i = catCell();
    if (!tile || i < 0) { addTxt(cat.x, cat.y - 50, 'sat.', C.grey); return; }
    const p = bjTarget(R, i);
    if (p < 0) { addTxt(cat.x, cat.y - 50, pick(['sat.', 'nobody here', 'hello?']), C.grey); return; }
    if (!bjExitPath(R, p)) { bjShrug(R, p); return; }
    if (R.ev || R.evq.length) { R.pend = p; const c = cellCenter(p); addTxt(c.x, c.y - G.ts * 0.5, 'next!', C.blue); return; }
    bjCall(R, p);
  },

  drawTile(R, g, t, x, y, s) {
    rr(g, x, y, s, s, s * 0.1, '#efe8da', 0);
    g.strokeStyle = '#e0d6c3'; g.lineWidth = 2; g.beginPath(); g.roundRect(x + 3, y + 3, s - 6, s - 6, s * 0.08); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(x + 5, y + 5, s * 0.4, 3);
    return true;
  },
  drawUnder(R, g) {
    const x0 = GRID.x - 6, w = GRID.w + 12, y0 = GRID.y + 2;
    // road
    rr(g, x0, y0, w, 56, 8, '#8e96a6', 0);
    g.save(); g.setLineDash([12, 10]); ln(g, [[x0 + 8, y0 + 8], [x0 + w - 8, y0 + 8]], 2, 'rgba(255,255,255,.45)'); g.restore();
    // kerb + pavement with the holding row
    g.fillStyle = '#d3d8e1'; g.fillRect(x0, y0 + 54, w, 7); ln(g, [[x0, y0 + 54], [x0 + w, y0 + 54]], 2.5);
    rr(g, x0, y0 + 61, w, G.y - (y0 + 61) - 6, 6, '#e6dfd0', 0);
    const S = bjSlots(R);
    rr(g, S.x0 - 10, S.y - 20, S.x1 - S.x0 + 20, 40, 10, '#d8cfbd', 0);
    R.vHold.forEach((_, k) => {
      const x = S.xs[k], used = R.hold[k] >= 0;
      g.save(); g.setLineDash([5, 4]); g.lineWidth = 2; g.strokeStyle = used ? 'rgba(29,36,51,.25)' : 'rgba(29,36,51,.45)';
      g.beginPath(); g.roundRect(x - 16, S.y - 16, 32, 32, 8); g.stroke(); g.restore();
    });
    // overflow spot: a red dashed square that pulses when the row is full
    const full = R.hold.every(v => v >= 0), pulse = full ? 0.5 + 0.5 * Math.sin(time * 6) : 0;
    g.save(); g.setLineDash([4, 4]); g.lineWidth = 2; g.strokeStyle = full ? `rgba(229,72,77,${0.5 + pulse * 0.5})` : 'rgba(229,72,77,.3)';
    g.beginPath(); g.roundRect(S.xo - 16, S.y - 16, 32, 32, 8); g.stroke(); g.restore();
    ln(g, [[S.xo - 6, S.y - 6], [S.xo + 6, S.y + 6]], 2.5, full ? C.red : 'rgba(229,72,77,.35)'); ln(g, [[S.xo + 6, S.y - 6], [S.xo - 6, S.y + 6]], 2.5, full ? C.red : 'rgba(229,72,77,.35)');
    txt('WAIT', S.x0 - 24, S.y + 1, 9, C.grey, 'right', 700);
  },
  drawOverlay(R, g) {
    // buses (clipped to the road so they drive in from / out of the panel)
    g.save(); g.beginPath(); g.rect(GRID.x - 6, GRID.y - 30, GRID.w + 12, 92); g.clip();
    const sx = bjStopX();
    for (let j = R.buses.length - 1; j >= R.vBus; j--) {
      const x = sx + (j - R.vBus) * (BJ_BL + 12) + R.qOff + (j === R.vBus ? R.busOff : 0);
      if (x > GRID.x + GRID.w + 10) continue;
      bjDrawBus(g, x, bjBusY(), R.buses[j], j === R.vBus ? R.vSeats : [], j === R.vBus ? R.busSq : 1);
    }
    g.restore();
    const hidden = R.buses.length - R.vBus - Math.ceil((GRID.x + GRID.w - sx) / (BJ_BL + 12));
    if (hidden > 0) { const x = GRID.x + GRID.w - 14, y = GRID.y + 8; rr(g, x - 15, y - 9, 30, 18, 9, C.ink, 0); txt('+' + hidden, x, y + 0.5, 11, '#fff', 'center', 700); }

    // the holding row
    const S = bjSlots(R);
    R.vHold.forEach((p, k) => { if (p) bjDrawPax(g, S.xs[k], S.y + 13, 30, p.col, p, { bob: true }); });
    if (R.vOver) bjDrawPax(g, S.xo, S.y + 13, 30, R.vOver.col, R.vOver, { sad: true });
    // the crowd
    const top = bjTopNow(R), s = bjSize();
    for (let i = 0; i < R.pax.length; i++) {
      if (R.pax[i] < 0) continue;
      const c = cellCenter(i), sh = R.shrug && R.shrug.cell === i ? Math.sin(R.shrug.t * 30) * 3 * Math.max(0, 1 - R.shrug.t * 1.5) : 0;
      bjDrawPax(g, c.x + sh, c.y + G.ts * 0.36, s, R.pax[i], R.look[i], { bob: true, sleepy: !bjFree(i, G.cols, G.rows, top) });
    }
  },
  drawTop(R, g) {
    // movers walk over everything (including the cat)
    if (R.walker) { const w = R.walker; bjDrawPax(g, w.x, w.y - w.z, w.s, w.col, w.look, { sq: w.sq, walk: true }); }
    if (R.hopper) { const w = R.hopper; bjDrawPax(g, w.x, w.y - w.z, w.s, w.col, w.look, { sq: 1, walk: true }); }
    if (R.shrug) { const c = cellCenter(R.shrug.cell); bjBubble(g, c.x, c.y - G.ts * 0.32 - 6 * EASE.outCubic(Math.min(1, R.shrug.t * 4)), '?', Math.min(1, (1 - R.shrug.t) * 4)); }
    for (const b of R.bubbles) bjBubble(g, b.x, b.y - 8 * EASE.outCubic(Math.min(1, b.t * 4)), b.text, Math.min(1, b.t * 8, (b.life - b.t) * 5), b.col);
  },

  progress(R) { const n = R.buses.length; return `Bus ${Math.min(R.bus + 1, n)} / ${n} · Waiting ${R.hold.filter(v => v >= 0).length} / ${R.holdN}`; },
  solved: R => R.allGone && !R.ev && !R.evq.length,
  judge(R) {
    const all = R.tiles.map(t => t.i);
    return R.bus >= R.buses.length ? { pass: true, verdict: pick(BJ_PASS), checked: all } : { pass: false, verdict: pick(BJ_FAIL), wrong: all.filter(i => R.pax[i] >= 0), checked: all };
  },

// ---------- runtime ----------
const bjSize = () => Math.min(G.ts * 0.86, 62);
const bjStopX = () => GRID.x + 34;
const bjBusY = () => GRID.y + 26;
const bjDoorX = () => bjStopX() + 26;
function bjSlots(R) {
  const n = R.holdN, gap = 40, cx = GRID.x + GRID.w / 2 - 20, x0 = cx - (n - 1) * gap / 2;
  return { xs: [...Array(n).keys()].map(k => x0 + k * gap), y: GRID.y + 84, x0: x0 - 16, x1: x0 + (n - 1) * gap + 16, xo: x0 + n * gap + 14 };
}
function bjTopNow(R) { const e = R.pax.map(v => v < 0 ? 1 : 0); return bjTop(G.cols, G.rows, e); }
// shortest free path from passenger p to the top row (cells), or null
function bjExitPath(R, p) {
  if (p < G.cols) return [p];
  const prev = new Map([[p, -1]]), q = [p];
  for (let h = 0; h < q.length; h++) {
    const i = q[h];
    if (i < G.cols) { const path = []; for (let v = i; v >= 0; v = prev.get(v)) path.unshift(v); return path; }
    for (const j of neighbors4(i)) if (!prev.has(j) && R.pax[j] < 0) { prev.set(j, i); q.push(j); }
  }

      if (b.x < 330 || b.x > 630) ay += Math.sign(cy || 1) * 0.9 + Math.sign(dy || 1) * 0.3;
      if (b.y < 140 || b.y > 430) ax += Math.sign(cx || 1) * 0.9 + Math.sign(dx || 1) * 0.3;

      if (Math.random() < dt * 0.8) addTxt(b.x, b.y - 40, pick(['nope!', 'eek', 'no thx', 'bye']), C.red);

// rounds/colorsort.js — BALL SORT / WATER SORT, re-skinned as "Sort the squares. Like a human would."
// The grid's columns are glass tubes (4 items each: balls, socks or fish in 3–6 colours); the cat walks along the shelf
// above them. SIT at a tube: the top item pops up and floats above the cat's head (bobbing). Walk to another tube and SIT to
// drop it: allowed into an empty tube or onto the same colour (and not full); otherwise the item shakes "nope" + soft buzz.
// HOP in place while carrying = put it back. Win: every tube empty or full of one colour (auto-verify, after a chime sweep
// up each tube). Dead ends are possible, so there is a RESET pad (the sit-to-reset pad from sokoban.js).
// Generator: low d = scrambled backwards from the sorted state (short, gentle); higher d = a random shuffle. Either way an

const CS_PASS = ['Sorted! Every tube is one colour. My tidiness module is purring.', 'Beautifully sorted. Like a human sock drawer, but real.', 'Perfect sorting. I am going to frame this. I do not have a wall.'];

// ---------- drawing ----------
function csMark(g, ci, s) {   // a small white symbol per colour (so colours never rely on hue alone)

    g.save(); g.beginPath(); g.arc(0, 0, r, 0, 7); g.clip(); circ(g, r * 0.35, r * 0.4, r * 0.95, dk, 0); circ(g, -r * 0.12, -r * 0.1, r * 0.86, col, 0); g.restore();

    const k = s / 92; g.save(); g.scale(k, k); g.translate(-10, -2); g.rotate(0.12);
    const path = () => { g.beginPath(); g.moveTo(-14, -38); g.lineTo(12, -38); g.lineTo(12, 8); g.quadraticCurveTo(38, 10, 34, 28); g.quadraticCurveTo(30, 42, 8, 38); g.lineTo(-6, 36); g.quadraticCurveTo(-16, 32, -14, 20); g.closePath(); };

registerRound({
  id: 'colorsort', name: 'Sort the squares',
  minD: 0.35, weight: 1,
  intro: 'Sit at a tube to pick up the top thing, sit at another to drop it. Same colour or empty only. Hop to put it back.',
  again: ['Sorting again. Humans love sorting socks. Allegedly.', 'More tubes! One colour per tube. Like a very tidy rainbow.'],
  move: 'step', exitGrid: true, verify: 'auto', autoDelay: 1.4, noCheck: true,

  generate(d, rng) {
    const S = csGenerate(d, rng), n = S.T.length, kind = rng.pick(['ball', 'ball', 'sock', 'fish']);
    const tiles = [];
    for (let r = 0; r <= CS_CAP; r++) for (let c = 0; c < n; c++) tiles.push(r === 0 ? { shelf: true, noSelect: true } : { block: true, hidden: true });
    const name = kind === 'ball' ? 'balls' : kind === 'sock' ? 'socks' : 'fish';
    return {
      cols: n, rows: CS_CAP + 1, margin: { t: 20, b: 38 }, tiles, initTiles: tiles, catStart: Math.floor(n / 2),
      tubes0: S.T, item: kind, colors: S.k,
      l1: 'Sort the squares.', big: 'Like a human would.', l3: `Sit = pick up / drop ${name}.`,
      par: { moves: S.sol.length }, solution: S.sol,
    };
  },

  enter(R) { R.stats.moves = 0; R.padOn = false; R.busyT = 0; csReset(R); },
  update(R) { sokoPadUpdate(R); },

  onSit(R, tile) {
    if (sokoPadSit(R, R2 => { sokoRestore(R2); csReset(R2); })) return;
    if (!tile || !tile.shelf) { addTxt(cat.x, cat.y - 50, 'sat.', C.grey); return; }
    if (time < R.busyT || R.party) return;
    const c = tile.c;
    if (R.held) { if (c === R.held.from) csDrop(R, c, true); else csDrop(R, c, false); }
    else csPick(R, c);
  },
  onHop(R, from, to) {
    if (from === to && R.held && mode === 'play') { csDrop(R, R.held.from, true); addTxt(cat.x, cat.y - 52, 'put it back', C.grey); }
  },

  drawTile(R, g, t, x, y, s) {
    if (!t.shelf) return false;
    rr(g, x, y + s * 0.08, s, s * 0.84, s * 0.14, '#e6ebf3', 0);
    g.lineWidth = 2; g.strokeStyle = '#d3dae6'; g.beginPath(); g.roundRect(x + 3, y + s * 0.08 + 3, s - 6, s * 0.84 - 6, s * 0.12); g.stroke();
    poly(g, [[x + s / 2 - 7, y + s * 0.78], [x + s / 2 + 7, y + s * 0.78], [x + s / 2, y + s * 0.88]], '#c3cbd9', 0);   // "drop here" chevron
    return true;
  },
  drawUnder(R, g) {
    const ci = mode === 'play' && cat.cell >= 0 && cat.cell < G.cols && !cat.mv ? cat.cell : -1;
    R.tubes.forEach((T, c) => {
      const t = csTube(c), full = R.doneT[c], hov = c === ci, rad = [8, 8, t.w / 2, t.w / 2];
      g.beginPath(); g.roundRect(t.x + 3, t.y + 5, t.w, t.h, rad); g.fillStyle = 'rgba(29,36,51,.12)'; g.fill();
      g.beginPath(); g.roundRect(t.x, t.y, t.w, t.h, rad); g.fillStyle = hov ? '#eaf2ff' : full ? '#fff8e0' : 'rgba(234,241,250,.9)'; g.fill();
      // items
      const vis = T.length - R.hide[c];
      for (let j = 0; j < vis; j++) {
        const s = csSlot(c, j), ft = (time - R.flashT[c][j]) / 0.28, bump = ft >= 0 && ft < 1 ? 1 + 0.22 * Math.sin(ft * Math.PI) : 1;
        csItem(g, R.item, T[j], s.x, s.y, s.s, bump);

      g.save(); g.beginPath(); g.roundRect(t.x, t.y, t.w, t.h, rad); g.clip();
      g.fillStyle = 'rgba(255,255,255,.45)'; g.fillRect(t.x + t.w * 0.14, t.y + 6, t.w * 0.1, t.h - 18); g.fillRect(t.x + t.w * 0.3, t.y + 6, t.w * 0.04, t.h - 30);
      g.restore();
      g.lineWidth = hov ? 4 : 3; g.strokeStyle = full ? C.gold : hov ? C.blue : C.ink; g.beginPath(); g.roundRect(t.x, t.y, t.w, t.h, rad); g.stroke();

  drawOverlay(R, g) { sokoPadDraw(R, g); },
  drawTop(R, g) {
    // drops: from the cat's head over to the tube mouth, then down the glass
    for (const d of R.drops) {

  },

  progress: R => `Sorted ${R.tubes ? R.tubes.filter(t => csFull(t)).length : 0} / ${R.colors} · moves ${R.stats.moves || 0} / ${R.par.moves}`,
  solved: R => !R.held && !R.drops.length && csDone(R.tubes),

});

  generate(d, rng) {

    if (cat.hopT <= 0 && cat.fall <= 0) { const t = catCell(); if (t >= 0) cat.x = clamp(cat.x + R.speed * ((Math.floor(t / G.cols) % 2) ? -1 : 1) * dt, PANEL.x + 14, PANEL.x + PANEL.w - 14); }
  },
  parTime: R => Math.round(8 + R.cols * R.cols * 0.7),
  judge: matchJudge,
  progress: matchProgress,
});

registerRound({
  id: 'falling', name: 'Falling floor', minD: 0.55, weight: 1,

// Fish can't be popped, heavy anvils can't be popped (but they fall). Goal: every fish in the bottom row, within a limited
// number of pops. Auto-verifies when solved (VERIFY also works). Out of pops and unsolved -> the round ends.

// pure board helpers. A board is a string, reading order: '.' empty, 'a'..'d' kinds, 'F' fish, 'H' heavy.
function gravFall(b, cols, rows) {

  generate(d, rng) {

    const kinds = d < 0.25 ? 2 : 3, fishN = d < 0.25 ? 1 : d < 0.65 ? 2 : 3, heavyN = d < 0.45 ? 0 : d < 0.8 ? 1 : 2;

  const start = 24, targets = [2, 22];   // L (stop at 22), U (slide up to 2)
  return { n, rock, start, targets, res: iceSolve(n, rock, start, targets) };
}

// ---------- drawing ----------
function iceDrawFloor(g, x, y, s, i) {
  g.fillStyle = '#e9f6fd'; g.fillRect(x, y, s, s);
  g.fillStyle = '#d6edf9'; g.fillRect(x, y + s * 0.82, s, s * 0.18);
  g.save(); g.beginPath(); g.rect(x, y, s, s); g.clip();
  // mop streaks + a soft moving sheen
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = Math.max(2, s * 0.05); g.lineCap = 'round';
  g.beginPath(); g.moveTo(x + s * 0.18, y + s * 0.42); g.lineTo(x + s * 0.42, y + s * 0.18); g.moveTo(x + s * 0.3, y + s * 0.5); g.lineTo(x + s * 0.48, y + s * 0.32); g.stroke();
  const ph = ((time * 0.35 + (i % 7) * 0.13) % 1.6) - 0.3, sx = x + ph * s * 1.4;
  const gr = g.createLinearGradient(sx - s * 0.3, y, sx + s * 0.3, y + s);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(x, y, s, s);
  g.restore();
  g.strokeStyle = '#c8e3f3'; g.lineWidth = 2; g.strokeRect(x + 1, y + 1, s - 2, s - 2);
}
// the stopper: a yellow WET FLOOR sign + a mop bucket
function iceDrawRock(g, x, y, s) {
  iceDrawFloor(g, x, y, s, 3);
  ell(g, x + s * 0.5, y + s * 0.86, s * 0.4, s * 0.07, 'rgba(29,36,51,.18)', 0);
  // bucket (right)
  const bx = x + s * 0.62, by = y + s * 0.52, bw = s * 0.3, bh = s * 0.32, lw = Math.max(2, s * 0.035);
  ln(g, [[bx + bw * 0.55, by - s * 0.02], [bx + bw * 0.95, y + s * 0.1]], lw * 1.6, '#8b5a2b');
  poly(g, [[bx, by], [bx + bw, by], [bx + bw * 0.88, by + bh], [bx + bw * 0.12, by + bh]], '#4fa3e0', lw);
  ln(g, [[bx + bw * 0.08, by + bh * 0.3], [bx + bw * 0.92, by + bh * 0.3]], lw * 0.8, '#2f7fc0');
  g.beginPath(); g.arc(bx + bw / 2, by, bw * 0.45, Math.PI, 0); g.lineWidth = lw * 0.8; g.strokeStyle = O; g.stroke();
  // A-frame sign (left)
  const sx = x + s * 0.12, sy = y + s * 0.14, sw = s * 0.5, sh = s * 0.7;
  poly(g, [[sx + sw * 0.18, sy], [sx + sw * 0.82, sy], [sx + sw, sy + sh], [sx, sy + sh]], '#ffd23f', lw);
  poly(g, [[sx + sw * 0.32, sy + sh * 0.12], [sx + sw * 0.68, sy + sh * 0.12], [sx + sw * 0.6, sy + sh * 0.36], [sx + sw * 0.4, sy + sh * 0.36]], '#1d2433', 0);
  circ(g, sx + sw * 0.5, sy + sh * 0.2, s * 0.03, '#ffd23f', 0);   // a tiny slipping person, abstract
  const fs = Math.max(6, s * 0.11);
  txt('WET', sx + sw / 2, sy + sh * 0.53, fs, C.ink, 'center', 800);
  txt('FLOOR', sx + sw / 2, sy + sh * 0.74, fs * 0.92, C.ink, 'center', 800);
}
function iceDrawFish(g, x, y, s, t) {
  iceDrawFloor(g, x, y, s, t.i);
  ell(g, x + s / 2, y + s * 0.62, s * 0.34, s * 0.12, 'rgba(79,163,224,.25)', 0);   // little puddle
  const bob = Math.sin(time * 3 + t.i) * s * 0.015;
  drawIcon(g, 'fish', x + s / 2, y + s * 0.47 + bob, s * 0.72);
}

registerRound({
  id: 'ice', name: 'Freshly mopped',
  minD: 0.25, weight: 1,
  intro: 'Wet floor! You slide until something stops you. Stop ON each fish and sit on it.',
  again: ['Freshly mopped again. Slide carefully. Or carelessly. You are a cat.', 'The janitor mopped AGAIN. Use the signs to stop.'],
  move: 'step', verify: 'auto', exitGrid: false, autoDelay: 0.4, selShrink: 0.9,

  generate(d, rng) {
    let L = null;
    for (let a = 0; a < 100 && !L; a++) L = iceTry(d, rng, a);
    if (!L) L = iceFallback();
    const { n, rock, start, targets, res } = L;
    const tiles = [...Array(n * n)].map((_, i) => rock[i] ? { rock: true, block: true, noSelect: true } : targets.includes(i) ? { fish: true, ice: true } : { ice: true, empty: true });
    return {
      grid: n, tiles, catStart: start,
      l1: 'Select all squares with fish.', big: 'The floor is freshly mopped.', l3: 'You slide until stopped. Sit on a fish to select it.',
      par: { moves: res.len }, solution: res.toks,
    };
  },

  enter(R) { R.stats.moves = 0; R.trail = []; R.rigs = [newCatRig(), newCatRig(), newCatRig()]; },
  update(R, dt) {
    // afterimage trail while sliding
    if (cat.mv && cat.mv.how === 'slide') R.trail.push({ x: cat.x, y: cat.y, face: cat.face, t: time });
    while (R.trail.length && time - R.trail[0].t > 0.22) R.trail.shift();
  },
  moveCat(R, from, dir, how) {
    if (how === 'hop') return { path: [from], how: 'hop' };   // hopping on a wet floor: in place only
    const path = []; let k = from;
    for (;;) { const j = stepCell(k, dir); if (j < 0 || R.tiles[j].block) break; path.push(j); k = j; }
    return { path, how: 'slide' };
  },
  onMove(R, from, dir, how, path) {
    if (how === 'hop' || !path.length) return;
    R.stats.moves++;
    noise(0.12 + path.length * 0.05, 0.025, 0, 0, 2200);   // swish
    cat.sx = 1.12; cat.sy = 0.9;
  },
  onStep(R, from, to, info) {
    if (info.how !== 'slide' || cat.mv) return;
    // skid to a stop: squash, puff in front, scrape sound
    const dir = info.dir || [0, 0];
    cat.sx = dir[1] ? 0.8 : 1.2; cat.sy = dir[1] ? 1.18 : 0.82;
    dust(cat.x + dir[1] * 14, cat.y + dir[0] * 6, 6, 14, '#e6f4ff');
    noise(0.09, 0.03, 0, 900); tone(180, 0.06, 'triangle', 0.03, -40);
    const t = R.tiles[to];
    if (t && t.fish && !t.sel) addTxt(cat.x, cat.y - 54, 'sit!', C.blue);
  },
  onSit(R, tile) {
    if (tile && tile.fish) { if (!tile.sel) selectTile(tile, true, { text: false }), addTxt(cat.x, cat.y - 54, pick(['fish secured ✓', 'mine ✓', 'got it ✓']), C.blue); else addTxt(cat.x, cat.y - 54, 'already mine', C.grey); }
    else addTxt(cat.x, cat.y - 50, pick(['sat. floor is cold.', 'brr.', 'wet butt.']), C.grey);
  },

  drawTile(R, g, t, x, y, s) {
    if (t.rock) { iceDrawRock(g, x, y, s); return true; }
    if (t.fish) { iceDrawFish(g, x, y, s, t); return true; }
    if (t.ice) { iceDrawFloor(g, x, y, s, t.i); return true; }
    return false;
  },
  drawOverlay(R, g) {
    // motion-blur afterimages + speed lines behind the sliding cat
    const tr = R.trail; if (!tr || !tr.length) return;
    const pickAt = age => { for (let i = tr.length - 1; i >= 0; i--) if (time - tr[i].t >= age) return tr[i]; return null; };
    [0.05, 0.1, 0.16].forEach((age, k) => {
      const p = pickAt(age); if (!p) return;
      drawCat({ x: p.x, y: p.y, z: 0, vx: 0, vy: 0, face: p.face, sx: 1, sy: 1, hopT: 0, dashT: 0, sitT: 0, fall: 0, walkT: 0, sitHold: false }, R.rigs[k], { alpha: 0.3 - k * 0.08 });
    });
    const o = tr[0]; g.save(); g.globalAlpha = 0.6; g.strokeStyle = '#ffffff'; g.lineWidth = 2.5; g.lineCap = 'round';
    for (const dy of [-26, -16, -6]) { g.beginPath(); g.moveTo(o.x, o.y + dy); g.lineTo(lerp(o.x, cat.x, 0.8), lerp(o.y, cat.y, 0.8) + dy); g.stroke(); }
    g.restore();
  },

  progress: R => `Fish ${R.tiles.filter(t => t.fish && t.sel).length} / ${R.tiles.filter(t => t.fish).length} · slides ${R.stats.moves || 0} / par ${R.par.moves}`,
  solved: R => R.tiles.every(t => !t.fish || t.sel),
  judge(R) {
    const fish = tilesWhere(t => t.fish), wrong = fish.filter(i => !R.tiles[i].sel);
    return wrong.length ? { pass: false, verdict: pick(ICE_FAIL), wrong, checked: fish } : { pass: true, verdict: pick(ICE_PASS), checked: fish };
  },
});

// ===================== src/rounds/lights.js =====================
// rounds/lights.js — LIGHTS OUT, re-skinned as "Select ALL squares".
// THE REFERENCE ROUND TYPE: copy this file to start a new one (see game/API.md). It shows:
//   - a pure, seeded generate(d, rng) that is solvable by construction and returns a par
//   - a custom onSit (instead of the default select toggle) with juice: tile flips in a ripple, bursts, musical sfx
//   - a per-tile custom face (drawTile) built on the default face (drawTileBase)
//   - progress readout, auto-verify via solved(), judge() with `wrong` tiles for the verify sweep, quips

// Cells toggled by pressing cell p on an n x n board: itself + its 4 neighbours (pure: does not touch the live grid)
function lightsArea(p, n) {
  const r = Math.floor(p / n), c = p % n, out = [p];
  if (r > 0) out.push(p - n); if (c < n - 1) out.push(p + 1); if (r < n - 1) out.push(p + n); if (c > 0) out.push(p - 1);
  return out;   // order: centre, up, right, down, left -> the ripple order
}
const LIGHTS_THEMES = ['sun', 'moon', 'balloon', 'crown', 'duck'];
const LIGHTS_PASS = ['Every square selected. That is the most squares. Very human.', 'All lights on. Your electricity bill looks extremely human.', 'Maximum selection achieved. HUMANCHECK is dazzled.'];
const LIGHTS_FAIL = ['Some squares are still in the dark. They feel left out.', 'Not ALL squares. We said ALL. In capitals.'];

registerRound({
  id: 'lights', name: 'Lights Out',
  minD: 0.25,                // the director may pick it once the run's difficulty reaches 0.25
  weight: 1,                 // relative pick weight among eligible types
  intro: 'Sitting flips the square AND its neighbours. Make them all checked.',   // said on the first appearance in a run
  again: 'Light switches again! Flip them ALL on. Humans love electricity.',       // said on later appearances
  verify: 'auto',            // no VERIFY pad: the engine submits by itself 0.35 s after solved(R) turns true
  selShrink: 0.94,           // selected tiles shrink a little less than the default 0.82 (every tile ends up selected)

  // d: 0 (intro / easiest) .. 1 (hardest). rng: seeded (rng.int, rng.pick, rng.sample, rng.shuffle, rng.chance, rng.f).
  // Start from the SOLVED board (all on) and apply `presses` random distinct presses: pressing is its own inverse, so
  // pressing the same cells again solves it -> always solvable, and `presses` is a fair par.
  generate(d, rng) {
    const n = d < 0.4 ? 3 : d < 0.75 ? 4 : 5, N = n * n;
    const presses = clamp(Math.round(lerp(2, N * 0.36, d)), 2, N - 1);
    let on, picks;
    do {
      picks = rng.sample([...Array(N).keys()], presses);
      on = new Array(N).fill(true);
      for (const p of picks) for (const j of lightsArea(p, n)) on[j] = !on[j];
    } while (on.every(Boolean));   // (some press sets cancel out on 4x4 / 5x5: never hand out a solved board)
    const theme = rng.pick(LIGHTS_THEMES);
    return {
      grid: n,                                           // n x n (or cols / rows for rectangles)
      tiles: on.map(v => ({ icon: theme, sel: v })),     // tile specs, reading order
      l1: 'Select', big: 'ALL squares', l3: 'Sit = flip it and its neighbours.',
      par: { sits: presses },                            // PERFECT = solved with <= presses sits
      solution: picks.sort((a, b) => a - b),            // extra fields are kept on R (tests read it via DEV.state())
    };
  },

  // tile = the tile the cat sits on, or null when it sits outside the grid
  onSit(R, tile) {
    if (!tile) { defaultSit(R, null); return; }
    const area = lightsArea(tile.i, G.cols);
    area.forEach((j, k) => {
      const t = R.tiles[j], was = t.sel;
      t.sel = !t.sel;                                                     // logic changes now ...
      tileFlip(t, { delay: k * 0.045, dur: 0.2, before: { sel: was } });  // ... the picture flips over in a quick ripple
      after(k * 0.045 + 0.1, () => {                                      // at each flip's midpoint:
        const c = cellCenter(j);
        if (t.sel) burst(c.x, c.y, C.blue, 6, 120, 3); else dust(c.x, c.y + G.ts * 0.3, 2, 10);
        if (k === 0) SFX.pop(R.tiles.filter(u => u.sel).length);         // centre: musical pop, pitch = lights on
        else SFX.toggle(k + 2);
      });
    });
    tileSquash(tile, 0.9, 1.06, 0.24);
  },

  // custom face: the default icon tile, dimmed when off, with a warm glow when on
  drawTile(R, g, t, x, y, s) {
    drawTileBase(t, x, y, s);
    if (t.sel) { g.save(); g.lineWidth = Math.max(3, s * 0.05); g.strokeStyle = '#ffd25a'; g.strokeRect(x + g.lineWidth / 2, y + g.lineWidth / 2, s - g.lineWidth, s - g.lineWidth); g.restore(); }
    else { g.fillStyle = 'rgba(15,22,48,.58)'; g.fillRect(x, y, s, s); }
    return true;   // handled (the engine still draws the check badge, flashes, squash, flips)
  },

  progress: R => `Lights ${R.tiles.filter(t => t.sel).length} / ${R.tiles.length} · par ${R.par.sits}`,
  solved: R => R.tiles.every(t => t.sel),
  judge(R) {
    const all = R.tiles.map(t => t.i), off = tilesWhere(t => !t.sel);
    if (!off.length) return { pass: true, verdict: pick(LIGHTS_PASS), checked: all };
    return { pass: false, verdict: pick(LIGHTS_FAIL), wrong: off, checked: all };
  },
});

// ===================== src/rounds/match.js =====================
// rounds/match.js — the classic "Select all squares with X". Grid 3x3 -> 4x4 -> 5x5 with d; decoys come from the same
// category as the target more often as d rises (vehicles vs vehicles, animals vs animals). matchSpec / matchJudge are
// shared with timed.js, conveyor.js and falling.js.
const MATCH_TARGETS = [
  { icon: 'fish', label: 'fish' }, { icon: 'car', label: 'cars' }, { icon: 'bus', label: 'buses' }, { icon: 'bicycle', label: 'bicycles' },
  { icon: 'boat', label: 'boats' }, { icon: 'dog', label: 'dogs' }, { icon: 'duck', label: 'ducks' }, { icon: 'cat', label: 'cats' },
  { icon: 'hydrant', label: 'fire hydrants' }, { icon: 'cloud', label: 'clouds' }, { icon: 'umbrella', label: 'umbrellas' }, { icon: 'tree', label: 'trees' },
];
const iconName = k => k === 'trafficlight' ? 'traffic light' : k;
// o: { n (grid size), target (icon), targets (pool), l3 }
function matchSpec(d, rng, o = {}) {
  const n = o.n || (d < 0.34 ? 3 : d < 0.7 ? 4 : 5), N = n * n;
  const tg = o.target ? MATCH_TARGETS.find(t => t.icon === o.target) : rng.pick(o.targets || MATCH_TARGETS);
  const lo = n === 3 ? 2 : n === 4 ? 3 : 4, hi = n === 3 ? 4 : n === 4 ? 6 : 8;
  const k = rng.int(lo, hi), hit = rng.sample([...Array(N).keys()], k);
  const similar = clamp(d * 1.1 - 0.05, 0, 0.9);
  const tiles = [...Array(N).keys()].map(j => ({ icon: hit.includes(j) ? tg.icon : pickDecoy(tg.icon, similar, rng) }));
  return { grid: n, tiles, target: tg.icon, label: tg.label, hit: hit.sort((a, b) => a - b),
    l1: 'Select all squares with', big: tg.label, l3: o.l3 || 'If there are none, sit anyway.' };
}
function matchJudge(R) {
  const sel = selected(), set = new Set(R.hit);
  const wrong = sel.filter(j => !set.has(j)), miss = R.hit.filter(j => !sel.includes(j));
  if (!wrong.length && !miss.length) return { pass: true, verdict: pick([`${cap(R.label)} confirmed. You may proceed, human.`, `Flawless. Almost too flawless.`, `Correct. HUMANCHECK is mildly impressed.`]) };
  const res = { pass: false, wrong: wrong.concat(miss), checked: [...new Set(sel.concat(R.hit))] };
  res.verdict = wrong.length ? `That was a ${iconName(R.tiles[wrong[0]].icon)}. Not ${R.label}. Hmm.` : `You missed ${miss.length === 1 ? 'one' : miss.length}. It saw you. It is hurt.`;
  return res;
}
function matchProgress(R) { return `${selected().length} selected`; }

registerRound({
  id: 'match', name: 'Select all X', minD: 0, weight: 1.4, maxPerRun: 3,
  intro: 'Easy one. Find them, sit on them, walk to VERIFY.',
  generate: (d, rng) => matchSpec(d, rng),
  parTime: R => Math.round(6 + R.cols * R.cols * 0.6),
  judge: matchJudge,
  progress: matchProgress,
});

// ===================== src/rounds/memory.js =====================
// rounds/memory.js — MEMORY ("Select all squares that HAD fish"). Inspired by Simon / concentration games.
//   - the tiles show their icons for a countdown (ring timer running around the header + a pulsing MEMORIZE pill)
//   - then they flip face-down in a diagonal wave to an elegant HUMANCHECK card back (memCardBack, also used by minesweeper)
//   - the cat selects from memory (sit = toggle), walks onto VERIFY; the cards flip face-up one by one to reveal
//   - knobs: show time 6 s -> 2.5 s, grid 3x3 -> 5x5, targets 2 -> 6, look-alike decoys (cat/dog, car/bus, sun/moon)
//   - twist (d > 0.7): while face-down, ONE target card swaps places with a neighbour (lift + slide + whoosh). Follow it!

const MEM_TARGETS = [
  { icon: 'fish', label: 'fish' }, { icon: 'cat', label: 'cats' }, { icon: 'dog', label: 'dogs' }, { icon: 'car', label: 'cars' },
  { icon: 'bus', label: 'buses' }, { icon: 'sun', label: 'suns' }, { icon: 'moon', label: 'moons' }, { icon: 'duck', label: 'ducks' },
  { icon: 'bicycle', label: 'bicycles' }, { icon: 'cloud', label: 'clouds' },
];
// hand-picked look-alikes (the "is it a cat or a dog?" moment), on top of the ICON_GROUPS decoys
const MEM_LOOKALIKE = { fish: ['duck', 'boat'], cat: ['dog'], dog: ['cat'], car: ['bus'], bus: ['car'], sun: ['moon', 'balloon'], moon: ['sun', 'cloud'], duck: ['fish'], bicycle: ['car'], cloud: ['moon', 'balloon'] };
const MEM_PASS = ['Perfect recall. Better than my hard drive, which mostly remembers error codes.', 'Every single one. I forget things on purpose to feel human. You don\'t even have to try.', 'Your memory is suspiciously good. For a human. Which you are. Obviously.'];
const MEM_FAIL = ['Those cards remember it differently. Card-related tragedy.', 'You remembered the vibe, not the squares. Relatable.', 'I also forgot. We are bonding. In failure.'];

function memLabel(k) { const t = MEM_TARGETS.find(x => x.icon === k); return t ? t.label : k; }

registerRound({
  id: 'memory', name: 'Memory',
  minD: 0.2, weight: 1,
  intro: 'Memorize where they are! The cards flip over, then you select from memory.',
  again: ['Memory again! Look hard. Blink later.', 'Remember the squares. I would help but my RAM is full of cat pictures.'],
  selShrink: 0.9,

  generate(d, rng) {
    const n = d < 0.3 ? 3 : d < 0.65 ? 4 : 5, N = n * n;
    const k = clamp(Math.round(lerp(2, 6, d)), 2, n === 3 ? 3 : n === 4 ? 5 : 6);
    const show = Math.round(lerp(6, 2.5, d) * 10) / 10;
    const tg = rng.pick(MEM_TARGETS);
    const hit = rng.sample([...Array(N).keys()], k).sort((a, b) => a - b), hs = new Set(hit);
    const similar = clamp(d * 1.2 - 0.1, 0, 0.9), look = MEM_LOOKALIKE[tg.icon] || [];
    const tiles = [...Array(N).keys()].map(i => {
      if (hs.has(i)) return { icon: tg.icon, hit: true };
      const icon = look.length && rng.chance(similar * 0.6) ? rng.pick(look) : pickDecoy(tg.icon, similar, rng);
      return { icon, hit: false };
    });
    // twist: one target swaps with an orthogonal non-target neighbour while face-down
    let swap = null;
    if (d > 0.7) {
      const pairs = [];
      for (const a of hit) { const r = Math.floor(a / n), c = a % n; for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) { const rr2 = r + dr, cc = c + dc; if (rr2 >= 0 && rr2 < n && cc >= 0 && cc < n && !hs.has(rr2 * n + cc)) pairs.push([a, rr2 * n + cc]); } }
      if (pairs.length) swap = rng.pick(pairs);
    }
    const after = hit.map(i => swap ? (i === swap[0] ? swap[1] : i) : i).sort((a, b) => a - b);
    return {
      grid: n, tiles, target: tg.icon, label: tg.label, show, swap, k,
      l1: 'Memorize the squares with', big: tg.label, l3: swap ? 'Then they flip. Psst: watch the cards closely.' : 'They will flip over in a moment. Remember them!',
      // par: the countdown + a brisk walk to each target + VERIFY (+ the shuffle)
      par: { time: Math.round(show + 4 + k * 1.9 + (n - 3) * 1.5 + (swap ? 1.5 : 0)) },
      solution: after,
    };
  },

  enter(R) {
    R.phase = 'show'; R.showT = R.show; R.lastSec = Math.ceil(R.show);
    // the engine's round-start wave flips from its plain card back: show OUR card back during that wave instead
    after(0, () => { for (const t of R.tiles) if (t.fx.before) t.fx.before = { back: true }; });
  },

  update(R, dt) {
    if (R.phase !== 'show') return;
    R.showT -= dt;
    const sec = Math.ceil(R.showT);
    if (sec !== R.lastSec && R.showT > 0) { R.lastSec = sec; if (sec <= 2) tone(880 + (2 - sec) * 220, 0.06, 'sine', 0.04); else SFX.tick(); }
    if (R.showT <= 0) memFlipDown(R);
  },

  onSit(R, tile) {
    if (R.phase === 'show') { addTxt(cat.x, cat.y - 54, 'memorizing…', C.grey); return; }
    if (R.phase === 'flip') { addTxt(cat.x, cat.y - 54, 'wait for it…', C.grey); return; }
    defaultSit(R, tile);
  },

  drawTile(R, g, t, x, y, s) {
    if (t.back) { memCardBack(g, x, y, s); return true; }
    drawTileBase(t, x, y, s);
    if (R.phase === 'show') {   // a soft "memorize" breathing glow on every face (same on all: no hints)
      const k = 0.5 + 0.5 * Math.sin(time * Math.PI * 2);
      g.save(); g.strokeStyle = `rgba(255,201,60,${0.25 + 0.35 * k})`; g.lineWidth = Math.max(2, s * 0.04); g.strokeRect(x + 2, y + 2, s - 4, s - 4); g.restore();
    }
    return true;
  },

  drawTop(R, g) {

// face-down wave: diagonal from the top-left, then (twist) one shuffle
function memFlipDown(R) {
  R.phase = 'flip'; R.showT = 0;
  const span = Math.max(1, G.cols + G.rows - 2);
  for (const t of R.tiles) {
    const dl = (t.r + t.c) / span * 0.42;
    t.back = true; tileFlip(t, { delay: dl, dur: 0.22, before: { back: false } });
    after(dl + 0.11, () => { if ((t.r + t.c) % 2 === 0) SFX.toggle(t.r + t.c); });
  }
  SFX.whoosh();
  after(0.75, () => {
    if (R.phase !== 'flip') return;   // verified during the flip: the round is over, no shuffle during the check
    R.l1 = 'Select all squares that HAD'; R.big = R.label; R.typeT = 0;
    R.l3 = R.swap ? 'Two cards swapped places. Follow the moving card!' : 'Sit to select. Then walk onto VERIFY.';
    if (!R.swap) { R.phase = 'pick'; return; }
    // the shuffle: both cards lift, slide past each other, settle (slow enough to follow)
    const [a, b] = R.swap, A = R.tiles[a], B = R.tiles[b];
    tween(A.fx, { sq: [1, 1.12] }, 0.18, { ease: 'outQuad' }); tween(B.fx, { sq: [1, 1.12] }, 0.18, { ease: 'outQuad' });
    { const ca = cellCenter(a), cb = cellCenter(b); addTxt((ca.x + cb.x) / 2, (ca.y + cb.y) / 2 - G.ts * 0.3, 'shuffle!', C.gold); }
    after(0.25, () => {
      if (R.phase !== 'flip') return;
      swapCells(a, b, { dur: 0.55 }); SFX.whoosh(); tone(330, 0.5, 'triangle', 0.035, 220);
      after(0.55, () => {
        if (R.phase !== 'flip') return;
        for (const t of [A, B]) { tween(t.fx, { sq: [1.12, 0.94, 1] }, 0.22, { ease: 'outBack' }); const c = cellCenter(t.i); dust(c.x, c.y + G.ts * 0.35, 3, 14); }
        SFX.thock(); R.solution = tilesWhere(t => t.hit); R.phase = 'pick';

}

// ===================== src/rounds/minesweeper.js =====================
// rounds/minesweeper.js — MINESWEEPER ("Select all squares WITHOUT a robot vacuum"). Inspired by Minesweeper / Hexcells.
//   - every tile starts face-down (the HUMANCHECK card back from memory.js)
//   - SIT on a tile = reveal it: a coloured number (vacuums in the 8 surrounding tiles) or a robot vacuum
//   - the FIRST reveal is always safe and always a 0: it opens a flood fill that cascades out in ripple order (rising pitch)
//   - HOP in place on a face-down tile = plant / remove a little paw flag (flagged tiles can't be revealed by sitting)
//   - reveal every safe tile -> auto-verify
//   - a vacuum = a STRIKE (the run's real strike counter) + VRRR + the robot gasps; the round CONTINUES (the vacuum tile stays
//     revealed so you can use it as information) unless that was the run's 3rd strike, in which case the round fails right
//     there. Rationale: every board is no-guess, so a vacuum is always a mistake, but losing the whole round to one slip on a
//     36-tile board felt too harsh; costing a strike (and the PERFECT) is the right sting.
//   - generate() is pure: it precomputes, for EVERY possible first tile, a board where that tile and its neighbours are safe
//     and the whole board is solvable WITHOUT guessing by a simple constraint solver (single-cell rules + subset rule).

// ---------- pure board helpers (no live grid access) ----------
function msNbrs(i, cols, rows) {
  const r = Math.floor(i / cols), c = i % cols, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { if (!dr && !dc) continue; const rr2 = r + dr, cc = c + dc; if (rr2 >= 0 && rr2 < rows && cc >= 0 && cc < cols) out.push(rr2 * cols + cc); }
  return out;
}
function msNumbers(cols, rows, mines) {
  const m = new Set(mines);
  return [...Array(cols * rows).keys()].map(i => m.has(i) ? -1 : msNbrs(i, cols, rows).filter(j => m.has(j)).length);
}
// flood reveal from `start` over zeros. Returns [{ i, d }] in BFS (ripple) order; d = ring distance. `open` (Set) = already open.
function msFlood(cols, rows, nums, start, open = new Set()) {
  if (open.has(start) || nums[start] < 0) return [];
  const out = [{ i: start, d: 0 }], seen = new Set([start]), q = [{ i: start, d: 0 }];
  while (q.length) {
    const { i, d } = q.shift();
    if (nums[i] !== 0) continue;
    for (const j of msNbrs(i, cols, rows)) if (!seen.has(j) && !open.has(j) && nums[j] >= 0) { seen.add(j); out.push({ i: j, d: d + 1 }); q.push({ i: j, d: d + 1 }); }
  }
  return out;
}
// One deduction pass from what a player can SEE. known[i]: null = face-down/unknown, number = revealed count, 'M' = known vacuum
// (a woken vacuum or one already deduced). Returns { safe: [...], mines: [...] } (newly deduced, deduped).
function mineDeduce(cols, rows, known) {
  const N = cols * rows, safe = new Set(), mines = new Set(), cons = [];
  for (let i = 0; i < N; i++) {
    if (typeof known[i] !== 'number') continue;
    const nb = msNbrs(i, cols, rows), H = nb.filter(j => known[j] == null), M = nb.filter(j => known[j] === 'M').length;
    if (!H.length) continue;
    const rem = known[i] - M;
    if (rem === 0) H.forEach(j => safe.add(j));
    else if (rem === H.length) H.forEach(j => mines.add(j));
    cons.push({ H, rem, set: new Set(H) });
  }
  // subset rule: A.H ⊆ B.H  =>  B.H \ A.H holds exactly B.rem - A.rem vacuums
  for (const A of cons) for (const B of cons) {
    if (A === B || A.H.length >= B.H.length || !A.H.every(j => B.set.has(j))) continue;
    const diff = B.H.filter(j => !A.set.has(j)), k = B.rem - A.rem;
    if (k === 0) diff.forEach(j => safe.add(j)); else if (k === diff.length) diff.forEach(j => mines.add(j));
  }
  return { safe: [...safe].filter(j => !mines.has(j)), mines: [...mines] };
}
// can a player clear this board from `start` with deductions only?  -> number of deduction rounds, or -1
function mineSolvable(cols, rows, mines, start) {
  const nums = msNumbers(cols, rows, mines), N = cols * rows, known = new Array(N).fill(null), open = new Set();
  if (nums[start] < 0) return -1;
  const reveal = i => { for (const { i: j } of msFlood(cols, rows, nums, i, open)) { open.add(j); known[j] = nums[j]; } };
  reveal(start);
  const safeTotal = N - mines.length; let rounds = 0;
  while (open.size < safeTotal) {
    const { safe, mines: ms } = mineDeduce(cols, rows, known);
    let progress = false;
    for (const j of ms) if (known[j] !== 'M') { known[j] = 'M'; progress = true; }
    for (const j of safe) if (!open.has(j)) { if (nums[j] < 0) return -1; reveal(j); progress = true; }
    if (!progress || ++rounds > 200) return -1;
  }
  return rounds;
}
// a no-guess board for first tile `start`: start + its neighbours are vacuum-free (so the first sit opens a 0 cascade)
function mineBoardFor(cols, rows, count, start, rng) {
  const N = cols * rows, keep = new Set([start, ...msNbrs(start, cols, rows)]), pool = [...Array(N).keys()].filter(i => !keep.has(i));
  for (let k = count; k >= 1; k--) {
    for (let tries = 0; tries < 400; tries++) {
      const mines = rng.sample(pool, Math.min(k, pool.length)).sort((a, b) => a - b);
      if (mineSolvable(cols, rows, mines, start) >= 0) return mines;
    }
  }
  return [];
}

const MS_PASS = ['All clean. The vacuums slept through it. So did I, a little.', 'Every safe square found. You crossed a minefield. A lint-field.', 'Zero vacuums woken. My dust bunnies salute you.'];
const MS_PASS_HIT = ['Cleared! Only {n} woke up. It will tell the others.', 'Done. One vacuum is now awake and VERY interested in cat hair. But done!'];
const MS_FAIL = ['The vacuum woke up. It ate the verification. And a sock.', 'VRRRRRR. That is the sound of failure. And of carpets.', 'You found a vacuum the hard way. I would have gasped, but I already gasped.'];
const MS_DIGIT = ['#9aa6bb', '#2f6fe4', '#1f9a5c', '#e5484d', '#1f3d8a', '#a3352f', '#168f8f', '#1d2433', '#7b8597'];

registerRound({
  id: 'minesweeper', name: 'Minesweeper',
  minD: 0.5, weight: 0.9,
  intro: 'Sit to reveal. Numbers count the robot vacuums next door. Never sit on a vacuum!',
  again: ['Vacuum field again. Tiptoe. Cats are good at tiptoe.', 'Numbers, then vacuums. Hop in place to plant a paw flag.'],
  verify: 'auto', autoDelay: 0.5, noCheck: true, selShrink: 1,

  generate(d, rng) {
    const n = d < 0.3 ? 4 : d < 0.65 ? 5 : 6, N = n * n;
    const mines = n === 4 ? (d < 0.15 ? 2 : 3) : n === 5 ? Math.round(lerp(4, 5, (d - 0.3) / 0.35)) : Math.round(lerp(6, 8, clamp((d - 0.65) / 0.3, 0, 1)));
    const boards = [];
    for (let s = 0; s < N; s++) boards.push(mineBoardFor(n, n, mines, s, rng.fork('board', s)));
    const safe = N - mines;
    return {
      grid: n, tiles: [...Array(N).keys()].map(() => ({ back: true, noSelect: true })),
      boards, mines, safeTotal: safe,
      l1: 'Select all squares WITHOUT a', big: 'robot vacuum', l3: 'Sit = reveal. Numbers = vacuums nearby. Hop in place = paw flag.',
      par: { time: Math.round(8 + safe * 1.05 + mines * 1.6), vacuums: 0 },
      solution: null,   // the bot must not peek: it plays from the revealed numbers + mineDeduce only
    };
  },

  enter(R) {
    R.board = null; R.nums = null; R.stats.vacuums = 0; R.woken = 0; R.revealed = 0;
    after(0, () => { for (const t of R.tiles) if (t.fx.before) t.fx.before = { back: true }; });
  },

  update(R, dt) {
    for (const t of R.tiles) if (t.vrr > 0) {
      t.vrr -= dt;
      if (Math.floor(t.vrr * 2.5) !== Math.floor((t.vrr + dt) * 2.5) && t.vrr > 0.3) { const c = cellCenter(t.i); addTxt(c.x + rnd(-14, 14), c.y - G.ts * 0.2, pick(['VRRR', 'vrrRRR', 'VRRRR!']), C.red); dust(c.x, c.y + G.ts * 0.3, 2, 16); }
    }
  },

  onSit(R, tile) {
    if (!tile) { defaultSit(R, null); return; }
    if (tile.flag) { addTxt(cat.x, cat.y - 54, 'flagged · hop to unflag', C.grey); SFX.desel(); return; }
    if (!tile.back) { tileSquash(tile, 0.97, 1.02, 0.14); SFX.tick(); return; }
    if (!R.board) msStart(R, tile.i);
    msReveal(R, tile.i);
  },

  // hop in place on a face-down tile: plant / pull a paw flag
  onHop(R, from, to) {
    if (to < 0 || from !== to) return;
    const t = R.tiles[to]; if (!t.back) return;
    t.flag = !t.flag; t.flagT = time;
    tween(t.fx, { sq: [0.94, 1.05, 1] }, 0.22, { ease: 'outBack' });
    const c = cellCenter(to);
    if (t.flag) { burst(c.x, c.y, C.gold, 6, 110, 3); tone(784, 0.08, 'triangle', 0.05); tone(1046, 0.1, 'triangle', 0.04, 0, 0.06); addTxt(c.x, c.y - G.ts * 0.4, 'flagged!', '#c98a00'); }
    else { SFX.desel(); addTxt(c.x, c.y - G.ts * 0.4, 'unflagged', C.grey); }
  },

  drawTile(R, g, t, x, y, s) {
    if (t.back) {
      memCardBack(g, x, y, s);
      if (t.flag) msFlag(g, x + s * 0.5, y + s * 0.55, s, clamp((time - (t.flagT || 0)) / 0.25, 0, 1));
      return true;
    }
    if (t.mine) {
      g.fillStyle = t.woke ? '#fde3e3' : '#e9edf4'; g.fillRect(x, y, s, s);
      g.strokeStyle = t.woke ? '#f3b4b4' : '#d5dbe6'; g.lineWidth = Math.max(1.5, s * 0.03); g.strokeRect(x + s * 0.05, y + s * 0.05, s * 0.9, s * 0.9);
      const awake = t.vrr > 0, j = awake ? Math.sin(time * 70) * s * 0.025 : 0;
      msVacuum(g, x + s / 2 + j, y + s / 2, s * 0.78, t.woke, awake ? time * 14 : 0);
      if (!t.woke) txt('z', x + s * 0.78, y + s * 0.2 - Math.sin(time * 2) * 3, Math.max(10, s * 0.18), '#7b8597', 'center', 700);
      return true;
    }
    // revealed floor + coloured digit
    g.fillStyle = '#f2f5fa'; g.fillRect(x, y, s, s);
    g.fillStyle = '#e3e8f1'; g.fillRect(x, y + s * 0.9, s, s * 0.1);
    g.strokeStyle = '#dde3ee'; g.lineWidth = Math.max(1, s * 0.02); g.strokeRect(x + s * 0.06, y + s * 0.06, s * 0.88, s * 0.88);
    if (t.num > 0) {
      const fs = Math.round(s * 0.56), col = MS_DIGIT[t.num] || C.ink;
      g.font = `700 ${fs}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(29,36,51,.12)'; g.fillText(String(t.num), x + s / 2 + s * 0.025, y + s * 0.53 + s * 0.035);
      g.fillStyle = col; g.fillText(String(t.num), x + s / 2, y + s * 0.53);
    } else {
      g.fillStyle = 'rgba(123,133,151,.16)'; g.beginPath(); g.arc(x + s / 2, y + s / 2, s * 0.05, 0, 7); g.fill();
    }
    return true;
  },

  progress(R) {
    const fl = R.tiles.filter(t => t.flag).length;
    return `Safe ${R.revealed} / ${R.safeTotal} · ${R.mines} vacuums${fl ? ` · ${fl} flag${fl > 1 ? 's' : ''}` : ''}`;
  },
  solved: R => !!R.board && R.revealed >= R.safeTotal,
  judge(R) {
    // reveal the sleeping vacuums (zzz) left on the board
    let k = 0;
    for (const t of R.tiles) if (t.back) { t.back = false; t.flag = false; tileFlip(t, { delay: 0.08 * k++, dur: 0.24, before: { back: true } }); }
    const all = tilesWhere(t => !t.mine);
    if (R.woken) return { pass: true, verdict: pick(MS_PASS_HIT).replace('{n}', R.woken === 1 ? 'one' : R.woken), checked: all };
    return { pass: true, verdict: pick(MS_PASS), checked: all };
  },
});

// first sit: pick the precomputed no-guess board for this tile and write it onto the tiles
function msStart(R, i) {
  R.board = R.boards[i]; const ms = new Set(R.board), n = G.cols;
  R.nums = msNumbers(n, G.rows, R.board); R.mines = R.board.length; R.safeTotal = n * G.rows - R.mines;
  R.tiles.forEach((t, j) => { t.mine = ms.has(j); t.num = R.nums[j]; });
  catExclaim();
}
function msReveal(R, i) {
  const t = R.tiles[i];
  if (t.mine) { msWake(R, t); return; }
  const open = new Set(tilesWhere(u => !u.back)), list = msFlood(G.cols, G.rows, R.nums, i, open);
  let maxD = 0;
  for (const { i: j, d } of list) {
    const u = R.tiles[j]; if (!u.back) continue;
    u.back = false; u.flag = false; R.revealed++; maxD = Math.max(maxD, d);
    const dl = d * 0.055;
    tileFlip(u, { delay: dl, dur: 0.2, before: { back: true } });
    after(dl + 0.1, () => { const c = cellCenter(j); if (u.num > 0) burst(c.x, c.y, C.blue, 5, 90, 2.5); else dust(c.x, c.y + G.ts * 0.2, 1, 8); });
  }

  for (let d = 0; d <= maxD; d++) after(d * 0.055 + 0.1, () => SFX.pop(d));
