<title>I'm Not A Robot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0f1630; --ink:#e9eefc; --btn:#ffffff22; --btnb:#ffffff55;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:16/9;width:100%;height:auto;background:var(--bg);touch-action:none}
@media (min-aspect-ratio:16/9){canvas{width:auto;height:100%}}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;padding:10px 12px;justify-content:space-between;pointer-events:none;user-select:none;-webkit-user-select:none}
#touch .grp{display:grid;gap:6px;pointer-events:auto}
#dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px)}
#acts{grid-template-columns:repeat(3,58px);grid-template-rows:46px}
#touch button{font:600 15px Fredoka,system-ui,sans-serif;color:var(--ink);background:var(--btn);border:2px solid var(--btnb);border-radius:12px;touch-action:none;padding:0}
#touch button.on{background:#ffffff55}
@media (pointer:coarse){#touch{display:flex}}
</style>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="grp" id="dpad">
    <span></span><button data-k="up">▲</button><span></span>
    <button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button>
  </div>
  <div class="grp" id="acts">
    <button data-k="sit">SIT</button><button data-k="hop">HOP</button><button data-k="dash">DASH</button>
  </div>
</div>

  const N = n * n;

    `Invent ONE short, absurd, funny prompt starting with "Select all squares" (max 60 chars) that needs subjective judgment (feelings, vibes, cat logic). ` +
    `Choose exactly ${N} icon names from the list for a ${n}x${n} grid (repeats ok) so some clearly fit and some clearly don't. ` +
    `Reply JSON only: {"prompt":"Select all squares ...","tiles":[${N} icon names],"intended":[0-based indices that fit]}`;

  const N = n * n;
  if (!r || typeof r.prompt !== 'string' || !Array.isArray(r.tiles) || !Array.isArray(r.intended)) return null;

  if (!/^select/i.test(prompt) || prompt.length > 90 || prompt.length < 14) return null;
  if (r.tiles.length !== N) return null;

  const tiles = r.tiles.map(t => map[normName(t)]);
  if (tiles.some(t => !t)) return null;
  const intended = [...new Set(r.intended.map(Number))].filter(i => Number.isInteger(i) && i >= 0 && i < N);
  if (!intended.length || intended.length >= N) return null;

  const p = `You are HUMANCHECK, a deadpan parody CAPTCHA judging a cat who is secretly helping a robot. Prompt: "${R.full}". ` +

    `Player selected: ${sel.length ? sel.map(i => i + ':' + R.tiles[i].icon).join(', ') : 'NOTHING'}. ` +
    `Be generous: pass any selection with at least one defensible choice; fail empty selections or clearly wrong ones. ` +
    `Reply JSON only: {"pass": true or false, "verdict": "funny deadpan HUMANCHECK verdict, max 80 chars"}`;

  if (!r) return null;
  const pass = r.pass === true || r.pass === 'true';
  if (typeof r.verdict !== 'string' || !r.verdict.trim()) return null;
