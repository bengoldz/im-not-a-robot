:root{

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:16/9;width:100%;height:auto;background:var(--bg);touch-action:none}
@media (min-aspect-ratio:16/9){canvas{width:auto;height:100%}}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;padding:10px 12px;justify-content:space-between;pointer-events:none;user-select:none;-webkit-user-select:none}
#touch .grp{display:grid;gap:6px;pointer-events:auto}
#dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px)}
#acts{grid-template-columns:repeat(3,58px);grid-template-rows:46px}
#touch button{font:600 15px Fredoka,system-ui,sans-serif;color:var(--ink);background:var(--btn);border:2px solid var(--btnb);border-radius:12px;touch-action:none;padding:0}
#touch button.on{background:#ffffff55}
@media (pointer:coarse){#touch{display:flex}}
</style>
