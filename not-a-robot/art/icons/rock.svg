    <clipPath id="rock-lit"><use xlink:href="#rock" transform="translate(-26 -24)"/></clipPath>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round" transform="translate(0 -20)">
    <use xlink:href="#rock" fill="#1d2433" stroke="#1d2433" stroke-width="28"/>
    <g clip-path="url(#rock-c)">
      <rect x="60" y="150" width="390" height="250" fill="#767e88"/>
      <rect x="60" y="150" width="390" height="250" fill="#9aa0a6" clip-path="url(#rock-lit)"/>
      <!-- highlight -->
      <path d="M128 262 Q156 220 204 202" fill="none" stroke="#c2c7cc" stroke-width="14"/>
      <circle cx="116" cy="290" r="7" fill="#c2c7cc"/>
      <!-- speckles -->
      <circle cx="356" cy="226" r="7" fill="#80878f"/>
      <circle cx="378" cy="250" r="4.5" fill="#80878f"/>
      <circle cx="150" cy="340" r="5" fill="#80878f"/>
      <circle cx="388" cy="330" r="6" fill="#626a74"/>
      <!-- crack -->
      <path d="M330 190 L320 210 L334 222" fill="none" stroke="#1d2433" stroke-width="6"/>
    </g>
    <!-- googly eyes -->
    <circle cx="226" cy="276" r="27" fill="#ffffff" stroke="#1d2433" stroke-width="8.5"/>
    <circle cx="298" cy="270" r="27" fill="#ffffff" stroke="#1d2433" stroke-width="8.5"/>
    <circle cx="233" cy="281" r="12" fill="#1d2433"/>
    <circle cx="305" cy="275" r="12" fill="#1d2433"/>
