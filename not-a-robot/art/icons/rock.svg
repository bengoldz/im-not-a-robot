<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <path id="rock" d="M84 352 Q70 280 124 228 Q178 172 262 166 Q352 160 402 226 Q446 290 428 352 Q418 384 374 386 L132 388 Q92 388 84 352 Z"/>
