<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <path id="sock" d="M140 84 Q140 70 154 70 L236 70 Q250 70 250 84 L250 282 Q250 300 268 310 L344 348 Q398 376 380 422 Q364 452 316 444 L210 434 Q140 426 140 360 Z"/>
    <clipPath id="sock-c"><use xlink:href="#sock"/></clipPath>
    <clipPath id="sock-lit"><use xlink:href="#sock" transform="translate(-20 -16)"/></clipPath>
    <g id="stripes">
      <rect x="120" y="96" width="150" height="22"/>
      <rect x="120" y="134" width="150" height="22"/>
    </g>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <use xlink:href="#sock" fill="#1d2433" stroke="#1d2433" stroke-width="28"/>
    <g clip-path="url(#sock-c)">
      <rect x="100" y="50" width="320" height="420" fill="#d9668f"/>
      <use xlink:href="#stripes" fill="#d3d9e4"/>
      <g clip-path="url(#sock-lit)">
        <rect x="100" y="50" width="320" height="420" fill="#f28fb0"/>
        <use xlink:href="#stripes" fill="#ffffff"/>
      </g>
      <!-- highlight -->
      <path d="M164 176 Q164 166 172 166 Q180 166 180 176 L180 290 Q180 300 172 300 Q164 300 164 290 Z" fill="#f9c2d6"/>
      <circle cx="172" cy="322" r="8" fill="#f9c2d6"/>
      <!-- heel and toe caps -->
      <path d="M140 376 Q196 364 208 434" fill="none" stroke="#1d2433" stroke-width="8.5"/>
      <path d="M320 336 Q292 384 312 444" fill="none" stroke="#1d2433" stroke-width="8.5"/>
      <!-- stitches -->
      <path d="M336 368 L350 380 M344 398 L358 406 M346 424 L362 428" fill="none" stroke="#b84e78" stroke-width="5"/>
    </g>
    <!-- cuff ribbing -->
    <path d="M170 74 L170 92 M196 74 L196 92 M222 74 L222 92" fill="none" stroke="#d9668f" stroke-width="5"/>
  </g>
</svg>
