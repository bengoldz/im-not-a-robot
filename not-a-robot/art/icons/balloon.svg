<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <path id="balloon" d="M256 62 C344 62 390 134 390 208 C390 298 320 358 270 370 L242 370 C192 358 122 298 122 208 C122 134 168 62 256 62 Z"/>
