const DV = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0], W: [0, 0] };
const MAPS = {
  id:   { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] },
  mirX: { U: [0, -1], D: [0, 1], L: [1, 0], R: [-1, 0] },
  mirY: { U: [0, 1], D: [0, -1], L: [-1, 0], R: [1, 0] },

  cw:   { U: [1, 0], D: [-1, 0], L: [0, -1], R: [0, 1] },
  ccw:  { U: [-1, 0], D: [1, 0], L: [0, 1], R: [0, -1] }
};
const RULES = {
  ECHO:   { name: "ECHO", map: MAPS.id, delay: 0, every: 1 },
  MIRROR: { name: "MIRROR", map: MAPS.mirX, delay: 0, every: 1 },
  LAG:    { name: "LAG", map: MAPS.id, delay: 2, every: 1 },
  INVERT: { name: "INVERT", map: MAPS.inv, delay: 0, every: 1 },
  SLEEPY: { name: "SLEEPY", map: MAPS.id, delay: 0, every: 2 }
};
const CONV = { ">": [1, 0], "<": [-1, 0], "^": [0, -1], "v": [0, 1] };

function parseLevel(def) {

  const grid = [], robots = [], plates = [];
  let cat = null, exit = null;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let ch = rows[y][x] || " ";
    if (ch === "C") { cat = [x, y]; ch = "."; }
    else if (ch === "E") { exit = [x, y]; }
    else if (ch >= "a" && ch <= "e") {
      const r = def.robots.find(q => q.color === ch.charCodeAt(0) - 97);
      robots.push({ rule: typeof r.rule === "string" ? RULES[r.rule] : r.rule, color: r.color, x, y });
      ch = ".";

function tileAt(L, x, y) { return x < 0 || y < 0 || x >= L.w || y >= L.h ? "#" : L.grid[y * L.w + x]; }
function solidFor(ch) { return ch === "#" || ch === " "; }
function initState(L) {
  return { cx: L.cat[0], cy: L.cat[1], rs: L.robots.map(r => [r.x, r.y]), qs: L.robots.map(() => []), t: 0 };
}
function cloneState(s) { return { cx: s.cx, cy: s.cy, rs: s.rs.map(p => p.slice()), qs: s.qs.map(q => q.slice()), t: s.t }; }
function robotIntent(rule, q, t, inp) {

    for (const i of [...pend]) {

      if (j >= 0) { if (!pend.has(j)) { pend.delete(i); info[i].blocked = true; } continue; }

  const dv = DV[inp];

  vecs.forEach((v, i) => { res.robots[i].v = v; });
  resolveMoves(L, s, vecs, res.robots, "moved");

  resolveMoves(L, s, pv, res.robots, "pushed");

  const m = lcmEvery(L), start = initState(L);

        if (r.win) {
          let path = "", c = nk;
          while (seen.get(c)) { const [pk, i] = seen.get(c); path = i + path; c = pk; }

function validateRule(o) {

    if (o && typeof o === "object" && o.data !== undefined && !o.dx_map) o = o.data;
    if (o && typeof o === "object" && typeof o.text === "string" && !o.dx_map) o = o.text;
    if (typeof o === "string") { const m = o.match(/\{[\s\S]*\}/); o = m ? JSON.parse(m[0]) : null; }
    if (!o || typeof o !== "object" || !o.dx_map || typeof o.dx_map !== "object") return null;

  ctx.fillStyle = "#1c2526"; rr(-15 * s, 8 * s, 30 * s, 8 * s, 3 * s); ctx.fill();
  ctx.fillStyle = "#3b4a4b"; for (let k = -12; k <= 10; k += 5) ctx.fillRect((k + (now / 60 % 5)) * s, 10 * s, 2 * s, 4 * s);
  ctx.fillStyle = col; rr(-14 * s, -14 * s, 28 * s, 24 * s, 5 * s); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(-14 * s, 4 * s, 28 * s, 6 * s);
  ctx.strokeStyle = col; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(0, -14 * s); ctx.lineTo(0, -21 * s); ctx.stroke();
  ctx.fillStyle = (Math.floor(now / 400 + i) % 2) ? "#fff" : col; ctx.beginPath(); ctx.arc(0, -22 * s, 2.5 * s, 0, 7); ctx.fill();
  ctx.fillStyle = "#0b1414"; rr(-10 * s, -10 * s, 20 * s, 11 * s, 3 * s); ctx.fill();
  ctx.fillStyle = col;
  if (sleeping) { ctx.fillRect(-7 * s, -5 * s, 5 * s, 1.5 * s); ctx.fillRect(2 * s, -5 * s, 5 * s, 1.5 * s); }
  else if (rule.name === "INVERT") { ctx.fillRect(-7 * s, -4 * s, 5 * s, 3 * s); ctx.fillRect(2 * s, -8 * s, 5 * s, 3 * s); }
  else { ctx.fillRect(-7 * s, -7 * s, 4 * s, 4 * s); ctx.fillRect(3 * s, -7 * s, 4 * s, 4 * s); }
  if (rule.name === "MIRROR") { ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.fillRect(-0.5 * s, -10 * s, 1 * s, 11 * s); }
  ctx.fillStyle = "#0b1414"; ctx.font = `700 ${Math.round(10 * s)}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(rule.custom ? "✱" : (RULE_INFO[rule.name] || ["?"])[0], 0, 6 * s);
  ctx.textBaseline = "alphabetic";
  ctx.restore();
  if (fallP > 0) return;
  ctx.font = `700 ${Math.max(9, Math.round(9 * s))}px ${FONT}`; ctx.textAlign = "center";
  const lw = ctx.measureText(rule.name).width + 8;
  ctx.fillStyle = "rgba(6,12,12,.8)"; rr(x - lw / 2, y - 37 * s, lw, 12 * s, 3); ctx.fill();
  ctx.fillStyle = col; ctx.fillText(rule.name, x, y - 28 * s);
  if (rule.delay > 0) {
    const q = world.s.qs[i];
    const arr = []; for (let k = 0; k < rule.delay; k++) arr.push(q[k] || "W");
    ctx.font = `700 ${Math.round(13 * s)}px ${FONT}`;
    arr.forEach((a, k) => {
      ctx.globalAlpha = k === 0 ? 0.95 : 0.45;
      ctx.fillStyle = "#e8fff9"; ctx.fillText(ARW[a], x + (k - (arr.length - 1) / 2) * 13 * s + 22 * s, y - 14 * s + k * 0);
    });
    ctx.globalAlpha = 1;
  }
  if (sleeping) {
    ctx.fillStyle = "#e8fff9"; ctx.font = `700 ${Math.round(11 * s)}px ${FONT}`;
    const zz = (now / 600) % 1;
    ctx.globalAlpha = 1 - zz; ctx.fillText("z", x + 16 * s + zz * 6 * s, y - 14 * s - zz * 10 * s); ctx.globalAlpha = 1;
  }
}

// ==RENDER: HUD==
function drawHUD(now) {
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#0e1817"; ctx.fillRect(0, 0, W, 44);
  ctx.fillStyle = COL.hazard; for (let i = 0; i < W; i += 24) ctx.fillRect(i, 42, 12, 2);
  ctx.font = `700 20px ${FONT}`; ctx.fillStyle = COL.ink;
  if (world.kind === "lobby") {
    ctx.fillText("HERDING PROTOCOL", 16, 29);
    ctx.font = `500 13px ${FONT}`; ctx.fillStyle = COL.muted;
    ctx.fillText("You are the cat. The robots copy you — with a twist.", 222, 28);
  }
  else ctx.fillText(world.idx >= 0 ? `SHIFT ${world.idx + 1}/${LEVELS.length} · ${world.def.name.toUpperCase()}` : `AI SHIFT · ${world.rule.name}`, 16, 29);
  ctx.textAlign = "right"; ctx.font = `700 13px ${FONT}`;
  ctx.fillStyle = aiLive() ? COL.green : COL.muted;
  ctx.fillText(aiLive() ? "AI: live" : "AI: scripted", W - 16, 28);
  if (world.kind === "level") {
    ctx.font = `700 18px ${FONT}`; ctx.fillStyle = world.moves > world.par ? COL.hazard : COL.ink;
    const bk = world.idx >= 0 && best["L" + world.idx] ? `  BEST ${best["L" + world.idx]}` : "";
    ctx.fillText(`MOVES ${world.moves} / PAR ${world.par}${bk}`, W - 120, 29);
  }
  // legend
  const y0 = H - 104;
  ctx.textAlign = "left"; ctx.font = `500 13px ${FONT}`;
  if (world.kind === "lobby") {
    ctx.fillStyle = COL.muted;
    ctx.fillText("Arrows/WASD move · Space = jump in place (wait a tick) · robots copy every input · walk onto a pad", 16, y0);
  } else {
    let x = 16;
    const seen = new Set();
    world.L.robots.forEach(rb => {
      if (seen.has(rb.rule.name)) return; seen.add(rb.rule.name);
      const desc = rb.rule.custom ? describeRule(rb.rule) : RULE_INFO[rb.rule.name][1];
      ctx.fillStyle = COL.robot[rb.color]; ctx.fillRect(x, y0 - 10, 10, 10);
      ctx.font = `700 13px ${FONT}`; ctx.fillText(rb.rule.name, x + 15, y0);
      const nw = ctx.measureText(rb.rule.name).width;
      ctx.font = `500 13px ${FONT}`; ctx.fillStyle = COL.muted; ctx.fillText(desc, x + 20 + nw, y0);
      x += 30 + nw + ctx.measureText(desc).width;
    });
    ctx.fillStyle = COL.muted; ctx.textAlign = "right";
    ctx.fillText("all bots on matching plates + cat on EXIT", W - 16, y0);
  }
  // foreman speech bar
  const by = H - 86;
  ctx.fillStyle = "#0e1817"; rr(12, by, W - 24, 74, 10); ctx.fill();
  ctx.strokeStyle = speech.src === "ai" ? COL.green : "#2c4542"; ctx.lineWidth = 2; ctx.stroke();
  drawForeman(52, by + 38, now);
  ctx.textAlign = "left"; ctx.font = `700 12px ${FONT}`; ctx.fillStyle = COL.hazard;
  ctx.fillText("FACTORY FOREMAN" + (speech.src === "ai" ? "  · live" : ""), 96, by + 22);
  const shown = speech.text.slice(0, Math.floor((now - speech.t0) / 22));
  ctx.font = `500 19px ${FONT}`; ctx.fillStyle = COL.ink;
  ctx.fillText(shown, 96, by + 50, W - 130);
}
function drawForeman(x, y, now) {
  const talking = (now - speech.t0) / 22 < speech.text.length;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "#5d6b6a"; rr(-22, -22, 44, 40, 6); ctx.fill();
  ctx.fillStyle = COL.hazard; ctx.fillRect(-22, -26, 44, 7);
  ctx.fillStyle = "#14100a"; for (let i = -20; i < 22; i += 8) ctx.fillRect(i, -26, 4, 7);
  ctx.fillStyle = "#0b1414"; rr(-16, -14, 32, 22, 4); ctx.fill();
  ctx.fillStyle = COL.red; ctx.fillRect(-11, -9, 8, 3); ctx.fillRect(3, -9, 8, 3);
  ctx.fillStyle = "#ff8a8a"; ctx.fillRect(-11, -6, 8, 2); ctx.fillRect(3, -6, 8, 2);
  const mh = talking ? 2 + Math.abs(Math.sin(now / 60)) * 4 : 2;
  ctx.fillStyle = COL.red; ctx.fillRect(-7, 1 + (6 - mh) / 2, 14, mh);
  ctx.restore();
}

// ==MAIN LOOP==
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (anim && now - anim.t0 >= anim.dur) {
    anim = null;
    if (afterAnim) { const f = afterAnim; afterAnim = null; f(); }
  }
  if (!anim && queue.length && (mode === "play" || mode === "lobby")) doMove(queue.shift());
  catSquash = Math.max(0, catSquash - dt * 7);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COL.frame; ctx.fillRect(0, 0, W, H);
  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; shake = Math.max(0, shake - dt * 30); }
  ctx.save(); ctx.translate(sx, sy);
  const L = world.L, { T, ox, oy } = layout(L);
  ctx.fillStyle = "#081011"; rr(ox - 10, oy - 16, L.w * T + 20, L.h * T + 24, 10); ctx.fill();
  drawTiles(now);
  const pos = actorPos(now);
  const items = [];
  pos.rs.forEach((p, i) => items.push({ y: p[1], f: () => {
    const fp = (mode === "falling" && i === fallen) ? Math.min(1, (now - failAt) / 600) : 0;
    drawRobot(i, ox + (p[0] + pos.bumps.rs[i][0] + 0.5) * T, oy + (p[1] + pos.bumps.rs[i][1] + 0.5) * T, T, now, fp);
  } }));
  const hop = anim && anim.k === "W" ? Math.sin(Math.min(1, (now - anim.t0) / anim.dur) * Math.PI) * 0.35 : 0;
  items.push({ y: pos.cat[1] + 0.01, f: () => drawCat(ox + (pos.cat[0] + pos.bumps.cat[0] * (hop ? 0 : 1) + 0.5) * T, oy + (pos.cat[1] + (hop ? 0 : pos.bumps.cat[1]) + 0.5) * T, T, now, hop) });
  items.sort((a, b) => a.y - b.y).forEach(it => it.f());
  particles = particles.filter(p => (p.t += dt) < p.life);
  particles.forEach(p => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  });
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD(now);
  if (banner) {
    const bt = (now - banner.t0) / 1000;
    if (bt > 2.2) banner = null;
    else {
      const a = Math.min(1, bt * 4, (2.2 - bt) * 3);
      ctx.globalAlpha = a; ctx.fillStyle = "rgba(8,14,14,.88)"; ctx.fillRect(0, H / 2 - 50, W, 84);
      ctx.fillStyle = COL.hazard; ctx.fillRect(0, H / 2 - 50, W, 3); ctx.fillRect(0, H / 2 + 31, W, 3);
      ctx.textAlign = "center"; ctx.font = `700 34px ${FONT}`; ctx.fillStyle = COL.ink; ctx.fillText(banner.title, W / 2, H / 2 - 6);
      ctx.font = `700 15px ${FONT}`; ctx.fillStyle = COL.hazard; ctx.fillText(banner.sub, W / 2, H / 2 + 20);
      ctx.globalAlpha = 1;
    }
  }
  if (mode === "won" && !anim) {
    const a = Math.min(1, (now - wonAt) / 400);
    ctx.globalAlpha = a; ctx.fillStyle = "rgba(8,14,14,.8)"; ctx.fillRect(0, H / 2 - 46, W, 70);
    ctx.textAlign = "center"; ctx.font = `700 32px ${FONT}`; ctx.fillStyle = COL.green;
    ctx.fillText(`SHIFT CLEARED · ${world.moves} MOVES (PAR ${world.par})`, W / 2, H / 2 - 4);
    ctx.font = `500 13px ${FONT}`; ctx.fillStyle = COL.muted; ctx.fillText("move to continue", W / 2, H / 2 + 16);
    ctx.globalAlpha = 1;
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,77,77,${flash * 0.25})`; ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt * 3); }
  requestAnimationFrame(frame);
}
goLobby();
requestAnimationFrame(frame);
</script>
