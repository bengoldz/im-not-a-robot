<title>3AM Zoomies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#04060d;
  --ink:#e6f0ff;
  --btn:rgba(110,160,255,.16);
  --btn-on:rgba(110,200,255,.42);
  --btn-border:rgba(170,210,255,.5);
}
html,body{height:100%;margin:0;padding:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;background:#0a0f1e;touch-action:none;max-width:100%;max-height:100%}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;padding:10px 12px;justify-content:space-between;
  align-items:flex-end;pointer-events:none;box-sizing:border-box}
#touch .grp{display:flex;gap:10px;pointer-events:auto}
#touch button{width:62px;height:62px;border-radius:50%;border:2px solid var(--btn-border);background:var(--btn);
  color:var(--ink);font:800 15px 'Barlow Condensed',sans-serif;touch-action:none;padding:0}
#touch button.on{background:var(--btn-on)}
#touch button.big{width:74px;height:74px}
@media (pointer: coarse){ #touch{display:flex} }
</style>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="grp"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="grp"><button data-k="down">▼</button><button data-k="dash">DASH</button><button class="big" data-k="jump">▲</button></div>
</div>
<script>
// ===== Setup =====
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, G = 440;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SHAKE_K = reduceMotion ? 0.2 : 1;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();
const FONT = "Bungee, Impact, 'Arial Black', sans-serif";
const CFONT = "'Barlow Condensed', 'Arial Narrow', Impact, sans-serif";
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
const pick = a => a[Math.floor(Math.random() * a.length)];
function hash(i, k) { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }

// ===== Live AI =====
let sample = null;          // live AI function, or null
(async () => {
  try { if (window.claude && window.claude.use) sample = await window.claude.use("sample"); } catch (e) { sample = null; }
})();
let aiBusy = false, aiDisabled = false;
async function askAI(prompt, fallback) {
  // returns a string; never throws; never more than one call in flight
  if (!sample || aiDisabled || aiBusy) return fallback();
  aiBusy = true;
  try {
    const { text } = await sample(prompt, { modelTier: "quick", cache: false });
    return (text || "").trim() || fallback();
  } catch (e) {
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e && e.code)) aiDisabled = true;
    return fallback();
  } finally { aiBusy = false; }
}

// ===== Input =====
const keys = {}, pressed = {};
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump',
  ArrowDown:'down', KeyS:'down', ShiftLeft:'dash', ShiftRight:'dash' };
function press(k) { initAudio(); if (!keys[k]) pressed[k] = true; keys[k] = true; }
function release(k) { keys[k] = false; }
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); press(k); });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); release(k); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add('on'); press(k); });
  const up = e => { b.classList.remove('on'); release(k); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

// ===== Audio =====
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.12, f2 = 0, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, v = 0.2, freq = 2000, type = 'lowpass', delay = 0) {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.03);
}
const SFX = {
  jump() { tone(380, 0.12, 'square', 0.07, 720); },
  kick() { tone(300, 0.1, 'square', 0.07, 900); noise(0.06, 0.08, 3000); },
  land() { noise(0.06, 0.08, 600); },
  dash() { noise(0.25, 0.18, 1200, 'bandpass'); tone(200, 0.2, 'sawtooth', 0.05, 600); },
  knock() { tone(rand(1300, 1900), 0.08, 'triangle', 0.1, 900); },
  shatter() { noise(0.18, 0.16, 5000, 'highpass'); tone(rand(2200, 2800), 0.12, 'triangle', 0.06); },
  smash() { noise(0.35, 0.3, 1800); tone(120, 0.25, 'sawtooth', 0.12, 40); },
  bonk() { tone(160, 0.18, 'square', 0.14, 60); noise(0.1, 0.15, 400); },
  boing() { tone(180, 0.3, 'sine', 0.2, 700); },
  woof() { tone(240, 0.09, 'sawtooth', 0.12, 140); tone(220, 0.1, 'sawtooth', 0.12, 120, 0.13); },
  flump() { noise(0.2, 0.14, 500); },
  boost() { tone(300, 0.4, 'sawtooth', 0.07, 1200); },
  pad() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.12, 'square', 0.06, 0, i * 0.06)); },
  sting() { tone(880, 0.09, 'square', 0.04); tone(1320, 0.14, 'square', 0.04, 0, 0.09); },
  mile() { [660, 880, 1100].forEach((f, i) => tone(f, 0.1, 'triangle', 0.08, 0, i * 0.07)); },
  caught() { tone(500, 0.6, 'square', 0.1, 80); noise(0.4, 0.2, 900); },
  beep() { tone(1500, 0.05, 'square', 0.03); },
};

// ===== Commentator =====
const LINES = {
  start: ["AND THEY'RE OFF! A cat, a hallway, and ZERO regard for sleep!", "It's 3AM and the zoomies have BEGUN, folks!",
    "Paws on the hardwood. This is what she trained for!", "Security bot is awake-ish. Kitty's got the jump!",
    "The house is quiet... NOT FOR LONG!"],
  m500: ["{d} METERS! The legs are a blur, the household is DOOMED!", "{d}m and that robot's battery is SWEATING!",
    "Past {d} meters! Somebody check on the furniture!", "{d}M! This cat has not blinked in MINUTES!",
    "Another 500 down! Running on pure spite and kibble!", "{d} meters! The couch has filed a complaint!"],
  combo: ["{c}-HIT COMBO! The kitchen will NEVER recover!", "CHAOS STREAK x{c}! Insurance adjusters are weeping!",
    "{c} in a row! That's a household record, folks!", "UNREAL! {c} things on the floor and counting!",
    "A {c}-combo! Gravity is working OVERTIME tonight!", "Knock, knock, KNOCK! {c} straight!"],
  nearmiss: ["OHHH! Whiskers from the flashlight! What a dodge!", "TOO CLOSE! The bot nearly grabbed a tail!",
    "Near miss! You could hear the servos whine!", "She slips the grab! Bot's still in its nightcap!",
    "BY A WHISKER! Literally, folks, a whisker!", "The robot lunges... and EATS CARPET!"],
  gameover: ["AND THAT'S A CATCH! Back to the cat bed, champ!", "The bot gets its cat! {d} meters of pure mayhem!",
    "It's over! {p} chaos points and a ruined living room!", "Collared at {d}m! What a run, what a MESS!",
    "Security wins this round... the house loses!", "Final whistle! Somebody vacuum the kitchen!"],
  aion: ["LIVE from your hallway, it's 3AM SPORTS NETWORK!", "Commentary booth is LIVE and over-caffeinated!",
    "We are ON AIR, folks! Lace up those paws!"],
};
const EVDESC = {
  m500: s => `just passed ${s.d} meters`, combo: s => `just hit a ${s.c}-item knock-over combo`,
  nearmiss: () => `barely escaped the robot's grab`, gameover: () => `just got caught by the robot; the run is over`,
  aion: () => `the broadcast just went live in the start room, before the run`,
};
const comm = { text: '', src: 'scripted', t: 99, seq: 0, waitId: 0 };
let aiOn = false, lastAI = -99;
function statsNow() {
  if (!run) return { d: 0, c: 0, p: 0, gap: 'asleep', smashed: 'nothing yet' };
  const g = run.gap;
  return { d: Math.floor(run.dist), c: run.combo || run.lastCombo, p: run.chaos,
    gap: g < 80 ? 'right on its tail' : g < 180 ? 'closing in' : 'way behind',
    smashed: run.smashed.slice(-4).join(', ') || 'nothing yet' };
}
function cleanLine(t) {
  t = (t || '').split('\n').map(s => s.trim()).filter(Boolean)[0] || '';
  t = t.replace(/^["'“”]+|["'“”]+$/g, '').replace(/^[A-Za-z ]{0,20}:\s*/, '');
  return t.length > 80 ? t.slice(0, 79) + '…' : t;
}
function commentate(ev) {
  const st = statsNow();
  const line = pick(LINES[ev]).replace('{d}', st.d).replace('{c}', st.c).replace('{p}', st.p.toLocaleString());
  const id = ++comm.seq;
  comm.text = line; comm.src = 'scripted'; comm.t = 0;
  SFX.sting();
  if (!aiOn) return;
  const now = performance.now() / 1000;
  if (aiBusy || now - lastAI < 6) return;   // rate limit + single flight
  lastAI = now; comm.waitId = id;
  const prompt = `You are an over-excited sports commentator on "3AM SPORTS NETWORK", calling a house cat's 3am zoomies while a sleepy security robot with a flashlight chases it. The cat ${EVDESC[ev](st)}. Stats: distance ${st.d}m, combo ${st.c}, chaos points ${st.p}, recently knocked over: ${st.smashed}; robot is ${st.gap}. Reply with ONE hype line, max 80 characters, no quotes, no emojis.`;
  askAI(prompt, () => '').then(txt => {
    if (comm.waitId === id) comm.waitId = 0;
    const line2 = cleanLine(txt);
    if (!line2 || id !== comm.seq || performance.now() / 1000 - now > 5) return;   // drop stale replies
    comm.text = line2; comm.src = 'ai'; comm.t = 0.4;
  });
}
const aiLive = () => aiOn && !!sample && !aiDisabled;

// ===== Best score =====
let best = { dist: 0, chaos: 0 };
try { const b = JSON.parse(localStorage.getItem('zoomies_best') || 'null'); if (b) best = { dist: b.dist || 0, chaos: b.chaos || 0 }; } catch (e) {}
function saveBest() { try { localStorage.setItem('zoomies_best', JSON.stringify(best)); } catch (e) {} }

// ===== World state =====
let state = 'menu', T = 0, cam = 0, shake = 0, hitstop = 0, flash = 0;
let cat = null, run = null, robot = null, genX = 0, lastChunk = -1;
let solids = [], props = [], debris = [], parts = [], pops = [], decals = [], lines = [], pads = [], padArmed = false;
const THEMES = ['living', 'kitchen', 'hall'];
const themeAt = x => THEMES[((Math.floor(x / 3600) % 3) + 3) % 3];
const SZ = { mug:[14,16], cup:[12,16], vase:[16,32], plant:[22,30], remote:[24,7], book:[10,24], jar:[18,24], frame:[22,26],
  cereal:[20,32], plate:[26,6], lamp:[20,40], cups:[46,58], paper:[34,96], laundry:[120,30], dog:[92,36], vac:[56,16] };
const BREAKS = { mug:'#3fb5a3', cup:'#aee0ff', vase:'#2f9f8f', plant:'#3d6fb8', jar:'#bfe6ff', plate:'#d8e4f0', lamp:'#e8d27a', frame:'#c9a24a' };
const PUDDLE = { mug:'#4a2c1c', cup:'#5b8fc0', vase:'#5b8fc0', plant:'#3a2a20', jar:'#7a5030' };

function newCat(x, y) {
  return { x, y, py: y, w: 30, h: 38, vx: 0, vy: 0, ground: false, coyote: 0, buf: 0, crouch: false, dashT: 0, dashCD: 0,
    wallT: 0, wallS: null, boostT: 0, stumble: 0, sq: 1, face: 1, anim: 0, climb: false, trail: [], lit: 0 };
}
function slab(x, y, w, h, kind) { const s = { x, y, w, h, kind }; solids.push(s); return s; }
function prop(cx, yb, kind) { const [w, h] = SZ[kind]; const p = { x: cx - w / 2, y: yb, w, h, kind, seed: Math.random() }; props.push(p); return p; }
function chair(x) { slab(x, G - 48, 54, 12, 'chair'); slab(x + 46, G - 112, 8, 64, 'chairback'); }
function stairs(x, n) {
  for (let i = 1; i <= n; i++) slab(x + (i - 1) * 44, G - 22 * i, 44, 22 * i, 'step');
  const lx = x + n * 44; slab(lx, G - 22 * n, 200, 22 * n, 'step');
  prop(lx + 60, G - 22 * n, 'frame'); prop(lx + 130, G - 22 * n, 'plant');
  return lx + 200;
}

// ===== Chunks =====
const CHUNKS = [
  { th:'living kitchen', d:0, f(x) { slab(x+40, G-46, 140, 16, 'coffee'); prop(x+70, G-46, 'mug'); prop(x+112, G-46, 'remote'); prop(x+152, G-46, 'plant'); return x+180; } },
  { th:'living kitchen', d:0, f(x) { slab(x+40, G-104, 190, 76, 'dining'); prop(x+70, G-104, 'vase'); prop(x+120, G-104, 'plate'); prop(x+160, G-104, 'cup'); prop(x+200, G-104, 'cup'); return x+230; } },
  { th:'kitchen living', d:1, f(x) { chair(x+20); chair(x+200); return x+260; } },
  { th:'any', d:0, f(x) { prop(x+40, G, 'cups'); return x+70; } },
  { th:'kitchen', d:1, f(x) { prop(x+30, G, 'paper'); prop(x+170, G, 'cups'); return x+200; } },
  { th:'living hall', d:0, f(x) { prop(x+70, G, 'laundry'); return x+140; } },
  { th:'living hall', d:0, f(x) { prop(x+60, G, 'dog'); return x+120; } },
  { th:'hall', d:1, f(x) { return stairs(x, 5); } },
  { th:'living hall', d:1, f(x) { slab(x+20, G-132, 48, 132, 'shelf'); prop(x+30, G-132, 'book'); prop(x+42, G-132, 'book'); prop(x+58, G-132, 'vase'); return x+80; } },
  { th:'living', d:1, f(x) { slab(x+20, G-215, 26, 215, 'curtain'); return x+60; } },
  { th:'any', d:0, f(x) { prop(x+40, G, 'vac'); return x+120; } },
  { th:'kitchen', d:1, f(x) { slab(x+20, G-92, 260, 92, 'counter'); prop(x+50, G-92, 'jar'); prop(x+100, G-92, 'mug'); prop(x+150, G-92, 'cereal'); prop(x+200, G-92, 'plate'); prop(x+245, G-92, 'cup'); return x+290; } },
  { th:'kitchen', d:2, f(x) { slab(x+20, G-178, 70, 178, 'fridge'); prop(x+55, G-178, 'cereal'); return x+100; } },
  { th:'any', d:0, f(x) { prop(x+20, G, 'plant'); prop(x+90, G, 'lamp'); prop(x+160, G, 'vase'); return x+190; } },
  { th:'living', d:2, f(x) { slab(x+20, G-46, 130, 16, 'coffee'); prop(x+60, G-46, 'mug'); prop(x+280, G, 'cups'); prop(x+460, G, 'laundry'); return x+530; } },
  { th:'hall', d:2, f(x) { slab(x+20, G-132, 48, 132, 'shelf'); prop(x+38, G-132, 'lamp'); prop(x+250, G, 'paper'); return x+280; } },
  { th:'kitchen', d:2, f(x) { slab(x+20, G-92, 220, 92, 'counter'); prop(x+60, G-92, 'jar'); prop(x+130, G-92, 'cups'); prop(x+200, G-92, 'mug'); return x+250; } },
  { th:'hall living', d:2, f(x) { prop(x+50, G, 'dog'); slab(x+200, G-215, 26, 215, 'curtain'); return x+240; } },
  { th:'hall', d:3, f(x) { const e = stairs(x, 4); prop(e+120, G, 'cups'); prop(e+300, G, 'vac'); return e+340; } },
];
function genWorld() {
  while (genX < cam + W + 700) {
    const th = themeAt(genX), diff = Math.min(3, Math.floor(run.dist / 300));
    const cands = CHUNKS.map((c, i) => i).filter(i => i !== lastChunk && CHUNKS[i].d <= diff && (CHUNKS[i].th === 'any' || CHUNKS[i].th.includes(th)));
    const i = pick(cands); lastChunk = i;
    const end = CHUNKS[i].f(genX);
    genX = end + 170 + run.base * 0.32 + rand(0, 150);
  }
}
function prune() {
  const L = cam - 400;
  solids = solids.filter(s => s.x + s.w > L);
  props = props.filter(p => !p.dead && p.x + p.w > L);
  debris = debris.filter(d => d.x > L);
  if (debris.length > 500) debris.splice(0, debris.length - 500);
  decals = decals.filter(d => d.x + d.w > L);
  parts = parts.filter(p => p.life > 0);
}

// ===== Effects =====
function burst(x, y, n, col, spd = 200, up = 0, g = 900, s = 3, life = 0.6) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * spd;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - up, g, life: life * rand(0.6, 1), max: life,
      col: Array.isArray(col) ? pick(col) : col, s: s * rand(0.6, 1.3) });
  }
}
function pop(x, y, text, col = '#fff', size = 22) { pops.push({ x, y, text, col, size, t: 0 }); }
function addShake(v) { shake = Math.max(shake, v); }
function addChaos(base, label, x, y, what) {
  run.combo++; run.comboT = 2.6; run.comboPop = 1; run.knocks++;
  const mult = Math.min(5, 1 + Math.floor(run.combo / 5) * 0.5);
  const pts = Math.round(base * mult);
  run.chaos += pts; run.bestCombo = Math.max(run.bestCombo, run.combo);
  pop(x, y, `+${pts} ${label}`, mult > 1 ? '#ffcc66' : '#e6f0ff', 18 + Math.min(10, run.combo));
  run.smashed.push(what); if (run.smashed.length > 8) run.smashed.shift();
  if (run.combo >= 10 && run.combo % 10 === 0) commentate('combo');
}
function endCombo() {
  if (run.combo >= 3) pop(cat.x, cat.y - 70, `COMBO x${run.combo}`, '#4dffa0', 24);
  run.lastCombo = run.combo; run.combo = 0;
}
function knock(p) {
  p.dead = true;
  debris.push({ kind: p.kind, x: p.x + p.w / 2, y: p.y - p.h / 2, w: p.w, h: p.h, vx: cat.vx * 0.7 + rand(60, 240), vy: rand(-460, -240),
    rot: 0, vr: rand(-14, 14), fly: true, seed: p.seed });
  burst(p.x + p.w / 2, p.y - p.h / 2, 6, ['#ffffff', '#ffcc66'], 160, 80);
  SFX.knock(); addShake(2);
  addChaos(25, 'KNOCK', p.x, p.y - p.h - 10, p.kind);
}
function shards(x, col, n) {
  for (let i = 0; i < n; i++) debris.push({ kind: 'shard', col, x, y: G - 6, w: rand(4, 8), h: rand(3, 6), vx: rand(-120, 220), vy: rand(-260, -60), rot: 0, vr: rand(-20, 20), fly: true });
}
function smashFragile(p) {
  p.dead = true;
  const cx = p.x + p.w / 2, dashing = cat.dashT > 0;
  const n = p.kind === 'cups' ? 6 : 3;
  for (let i = 0; i < n; i++) debris.push({ kind: p.kind === 'cups' ? 'redcup' : 'roll', x: cx + rand(-10, 10), y: p.y - rand(10, p.h), w: p.kind === 'cups' ? 14 : 30, h: p.kind === 'cups' ? 18 : 28,
    vx: cat.vx * (dashing ? 0.9 : 0.4) + rand(-60, 280), vy: rand(-620, -200), rot: 0, vr: rand(-16, 16), fly: true });
  if (p.kind === 'paper') for (let i = 0; i < 6; i++) debris.push({ kind: 'sheet', x: cx, y: p.y - rand(20, 90), w: 16, h: 12, vx: rand(-80, 300), vy: rand(-400, -100), rot: 0, vr: rand(-8, 8), fly: true });
  burst(cx, p.y - p.h / 2, 18, ['#ffffff', '#e8213a', '#ffcc66'], 380, 120, 800, 3.5);
  if (dashing) {
    SFX.smash(); addShake(10); hitstop = 0.06; flash = 0.25;
    addChaos(100, 'SMASH!', cx, p.y - p.h - 10, p.kind === 'cups' ? 'cup pyramid' : 'paper towel tower');
  } else {
    SFX.bonk(); SFX.flump(); addShake(5); cat.vx *= 0.35; cat.stumble = 0.3;
    addChaos(40, 'CRASH', cx, p.y - p.h - 10, p.kind === 'cups' ? 'cup pyramid' : 'paper towel tower');
    pop(cat.x, cat.y - 80, 'DASH THROUGH!', '#5ad1ff', 16);
  }
}

// ===== Cat physics =====

  ctx.fillStyle = '#3d6fb8'; ctx.beginPath(); ctx.moveTo(-26, -112); ctx.quadraticCurveTo(-4, -136, 14, -124); ctx.quadraticCurveTo(-20, -140, -40, -128 + Math.sin(T * 3) * 3); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#e6f0ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-26, -112); ctx.quadraticCurveTo(-6, -128, 14, -124); ctx.stroke();
  ell(-41, -127 + Math.sin(T * 3) * 3, 5, 5, '#e6f0ff');
  ctx.strokeStyle = '#5d6f93'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(20, -118); ctx.lineTo(26, -134); ctx.stroke(); led(26, -135, '#ff3b5c', 4);
  // arm + flashlight
  ctx.strokeStyle = '#5d6f93'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(26, -60); ctx.lineTo(44, -64); ctx.stroke();
  ctx.save(); ctx.translate(46, -66); ctx.rotate(ang); rr(-6, -6, 16, 12, 2, '#c9d3e6'); rr(8, -8, 6, 16, 2, sleepy ? '#5d6f93' : '#ffe9a8'); ctx.restore();
  ctx.restore();
  if (sleepy || alert < 0.2) for (let k = 0; k < 3; k++) { const t = (T * 0.6 + k / 3) % 1; ctx.globalAlpha = 1 - t; text('Z', x - 10 - t * 20, gy - 150 - t * 50, 12 + k * 4, '#9fc0ff'); ctx.globalAlpha = 1; }
}
function drawPads() {
  for (const p of pads) {
    const col = p.col();
    ctx.globalCompositeOperation = 'lighter'; glow(p.x + p.w / 2, G, p.w * 0.7, col, 0.25 + p.glow * 0.4); ctx.globalCompositeOperation = 'source-over';
    rr(p.x, G - 6, p.w, 8, 3, col); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(p.x + 6, G - 4, p.w - 12, 3);
    const by = G - 70 + Math.sin(T * 3 + p.x) * 4;
    text(p.label(), p.x + p.w / 2, by, 22 + p.glow * 4, col);
    text('▼', p.x + p.w / 2, by + 28, 14, col);
  }
}

// ===== Drawing: HUD =====
function drawBanner() {
  if (comm.t > 5.5 || !comm.text) return;
  const k = comm.t < 0.35 ? comm.t / 0.35 : comm.t > 5 ? 1 - (comm.t - 5) / 0.5 : 1;
  const ox = (1 - k) * -700, y = H - 62;
  ctx.save(); ctx.translate(ox, 0);
  rr(16, y, 236, 22, 0, '#e8213a'); text('3AM SPORTS NETWORK', 134, y + 12, 12, '#ffffff');
  if (Math.sin(T * 6) > -0.2) ell(262, y + 11, 4, 4, '#ff3b5c'); ctx.font = `12px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left'; ctx.fillText('LIVE', 270, y + 12);
  ctx.font = `800 24px ${CFONT}`; const tw = Math.min(780, ctx.measureText(comm.text).width);
  rr(16, y + 22, Math.max(420, tw + 40), 34, 0, 'rgba(236,242,255,.94)');
  ctx.fillStyle = '#e8213a'; ctx.fillRect(16, y + 22, 6, 34);
  ctx.fillStyle = '#0b1226'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(comm.text, 32, y + 40, 780);
  if (comm.src === 'ai') { ctx.font = `10px ${FONT}`; ctx.fillStyle = '#ffcc66'; ctx.fillText('LIVE MIC', 320, y + 12); }
  ctx.restore();
}
function drawHUD() {
  if (run && (state === 'run' || state === 'caught')) {
    text(`${Math.floor(run.dist).toLocaleString()} m`, 22, 30, 28, '#e6f0ff', 'left');
    text(`CHAOS ${run.chaos.toLocaleString()}`, 22, 62, 18, '#ffcc66', 'left');
    if (run.combo > 1) {
      const s = 1 + run.comboPop * 0.4, mult = Math.min(5, 1 + Math.floor(run.combo / 5) * 0.5);
      ctx.save(); ctx.translate(W - 110, 46); ctx.scale(s, s); ctx.rotate(-0.06);
      text(`x${run.combo}`, 0, -6, 34, run.combo >= 10 ? '#ff3b5c' : '#4dffa0');
      text(`COMBO  ·  MULT x${mult}`, 0, 22, 11, '#e6f0ff'); ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(W - 170, 82, 120, 4); ctx.fillStyle = '#4dffa0'; ctx.fillRect(W - 170, 82, 120 * clamp(run.comboT / 2.6, 0, 1), 4);
    }
    const f = clamp(1 - (run.gap - 22) / (340 - 22), 0, 1), bx = W / 2 - 110;
    text('SEC-BOT', W / 2, 18, 11, f > 0.7 ? '#ff3b5c' : '#9fb0d0');
    rr(bx, 30, 220, 10, 5, 'rgba(255,255,255,.12)');
    rr(bx, 30, Math.max(10, 220 * f), 10, 5, f > 0.7 ? (Math.sin(T * 14) > 0 ? '#ff3b5c' : '#ff8a3c') : '#ffcc66');
    if (run.t < 5) { ctx.globalAlpha = Math.min(1, 5 - run.t); text('OUTRUN THE SEC-BOT · SMASH STUFF FOR CHAOS', W / 2, 120, 18, '#e6f0ff'); text('↑ jump (hold)   ⇧ dash = smash   ↓ slide   ↑ on walls = kick / climb curtains', W / 2, 146, 13, '#9fb0d0'); ctx.globalAlpha = 1; }
    if (cat.dashCD > 0) { ctx.fillStyle = 'rgba(90,209,255,.5)'; ctx.fillRect(cat.x - cam - 15, cat.y - cat.h - 12, 30 * (1 - cat.dashCD / 0.95), 3); }
  }
  ctx.font = `11px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillStyle = aiLive() ? '#4dffa0' : '#7f8fb0'; ctx.fillText(aiLive() ? (comm.waitId ? 'AI: live ●' : 'AI: live') : 'AI: scripted', W - 14, H - 14);
  drawBanner();
}
function drawRoomText() {
  if (state === 'menu') {
    ctx.save(); ctx.shadowColor = '#4dffa0'; ctx.shadowBlur = 18;
    text('3AM', W / 2, 62, 34, '#4dffa0'); ctx.shadowColor = '#ff9c42'; text('ZOOMIES', W / 2, 112, 64, '#ff9c42'); ctx.restore();
    text('Outrun the sleepy security bot. Wreck the house. Rack up CHAOS.', W / 2, 160, 20, '#e6f0ff', 'center', CFONT);
    text('← → walk   ·   ↑ / W / Space jump (hold = higher)   ·   Shift dash   ·   ↓ / S crouch', W / 2, 190, 18, '#9fb0d0', 'center', CFONT);
    text('Walk onto a pad', W / 2, 228, 16, '#ffcc66');
    text('AI pad = live commentary', 180, G - 108, 15, '#7f8fb0', 'center', CFONT);
    if (best.dist) text(`BEST  ${best.dist.toLocaleString()} m  ·  ${best.chaos.toLocaleString()} chaos`, W / 2, 256, 15, '#9fb0d0');
  } else if (state === 'over' && run) {
    rr(W / 2 - 220, 40, 440, 230, 8, 'rgba(8,12,26,.85)'); ctx.strokeStyle = '#e8213a'; ctx.lineWidth = 3; ctx.strokeRect(W / 2 - 220, 40, 440, 230);
    text('CAUGHT!', W / 2, 78, 40, '#ff3b5c');
    text(`DISTANCE   ${Math.floor(run.dist).toLocaleString()} m`, W / 2, 128, 22, '#e6f0ff');
    text(`CHAOS   ${run.chaos.toLocaleString()}`, W / 2, 162, 22, '#ffcc66');
    text(`best combo x${run.bestCombo}  ·  ${run.knocks} things wrecked`, W / 2, 194, 18, '#9fb0d0', 'center', CFONT);
    text(`BEST  ${best.dist.toLocaleString()} m  ·  ${best.chaos.toLocaleString()} chaos`, W / 2, 228, 15, run.newBest ? '#4dffa0' : '#9fb0d0');
    if (run.newBest) text('NEW BEST!', W / 2 + 170, 52, 16, '#4dffa0');
  }
}

// ===== Render =====
const vig = ctx.createRadialGradient(W / 2, H / 2, 240, W / 2, H / 2, 640);
vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,8,.7)');
function render() {
  ctx.save();
  const sk = shake * SHAKE_K;
  if (sk > 0.1) ctx.translate(rand(-sk, sk), rand(-sk, sk));
  drawBackground();
  drawFloor();
  for (const d of decals) { const x = d.x - cam; ell(x + d.w / 2, G + 4, d.w / 2, 5, d.col); ctx.fillStyle = 'rgba(160,200,255,.15)'; ctx.fillRect(x + d.w / 3, G + 2, d.w / 4, 1.5); }
  for (const s of solids) drawSolid(s);
  if (state === 'menu' || state === 'over') { drawPads(); drawRobot(905, G, state === 'over' ? 0.6 : 0, state === 'over' ? -0.3 : 0.4, state === 'menu'); }
  for (const p of props) drawProp(p);
  for (const d of debris) { const x = d.x - cam; if (x < -30 || x > W + 30) continue; ctx.save(); ctx.translate(x, d.y); ctx.rotate(d.rot); drawItem(d.kind, d.w, d.h, d.col || d.seed); ctx.restore(); }
  if (robot && (state === 'run' || state === 'caught')) drawRobot(robot.x - cam, G, state === 'caught' ? 1 : robot.alert, robot.ang, false);
  // cat
  glow(cat.x - cam, cat.y - 18, 46, cat.lit ? '#ffd27a' : '#6f8fd0', cat.lit ? 0.5 : 0.25);
  for (const t of cat.trail) drawCat({ ...cat, x: t.x, y: t.y, crouch: t.crouch }, 0, 0, t.a * 0.6, true);
  drawCat(cat);
  if (state === 'caught') text('!!', cat.x - cam + 16, cat.y - 70, 22, '#ff3b5c');
  for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(p.x - cam - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;
  for (const p of pops) { ctx.globalAlpha = clamp(1.2 - p.t, 0, 1); const s = p.t < 0.12 ? 0.6 + p.t * 3.4 : 1; text(p.text, p.x - cam, p.y, p.size * s, p.col); }
  ctx.globalAlpha = 1;
  ctx.restore();
  // speed lines + vignette + danger edge
  ctx.strokeStyle = 'rgba(200,225,255,.35)'; ctx.lineWidth = 2;
  for (const l of lines) { ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.len, l.y); ctx.stroke(); }
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  if (run && state === 'run' && run.gap < 140) {
    const a = (1 - run.gap / 140) * (0.35 + Math.sin(T * 12) * 0.15);
    const g = ctx.createLinearGradient(0, 0, 220, 0); g.addColorStop(0, `rgba(255,40,70,${a})`); g.addColorStop(1, 'rgba(255,40,70,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 220, H);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,240,220,${flash * (reduceMotion ? 0.3 : 0.6)})`; ctx.fillRect(0, 0, W, H); }
  drawRoomText();
  drawHUD();
}

// ===== Main loop =====
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (hitstop > 0) hitstop -= dt;
  else { update(dt); for (const k in pressed) pressed[k] = false; }
  render();
  requestAnimationFrame(frame);
}
enterMenu();
requestAnimationFrame(frame);
</script>
