<title>I Am The Dot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#070b12; --ink:#e6f0f4; --laser:#ff2a3a; --mint:#5fe0c0; --amber:#ffb23e; --steel:#1a2433;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;font-family:"Chakra Petch","Lucida Console",monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#c{display:block;background:#0b1320;box-shadow:0 0 0 2px #1d2a3b,0 10px 40px #000a}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;padding:10px 12px;justify-content:space-between;align-items:flex-end;pointer-events:none}
#touch.on{display:flex}
#touch .tg{display:grid;gap:6px;pointer-events:auto}
#touch .dp{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px)}
#touch .ac{grid-template-columns:repeat(3,62px)}
#touch button{width:100%;height:54px;border-radius:12px;border:2px solid #ffffff44;background:#1a2433cc;color:var(--ink);font:700 13px "Chakra Petch",monospace;touch-action:none}
#touch .ac button{height:62px;border-radius:50%}
#touch button.down{background:var(--laser);color:#fff}
</style>
<canvas id="c" width="960" height="540"></canvas>
<div id="touch">
  <div class="tg dp"><span></span><button data-k="u">&#9650;</button><span></span><button data-k="l">&#9664;</button><button data-k="d">&#9660;</button><button data-k="r">&#9654;</button></div>
  <div class="tg ac"><button data-k="dim">DIM</button><button data-k="dash">FLICK</button><button data-k="wig">WIGGLE</button></div>
</div>
<script>
// ===== Setup =====
const W = 960, H = 540, FY = 500, G = 1500;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px'; }
addEventListener('resize', fit); fit();
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.random() * a.length | 0];
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const FONT = "'Chakra Petch','Lucida Console',monospace", HAND = "'Patrick Hand','Comic Sans MS',cursive";

// ===== Input =====
const keys = {}, pressed = {};
const KM = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd',
  Space: 'wig', KeyZ: 'wig', ShiftLeft: 'dash', ShiftRight: 'dash', KeyC: 'dim', KeyX: 'dim' };
addEventListener('keydown', e => { const k = KM[e.code]; initAudio(); if (k) { e.preventDefault(); if (!keys[k]) pressed[k] = true; keys[k] = true; } });
addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const touchEl = document.getElementById('touch');
if (matchMedia('(pointer: coarse)').matches) touchEl.classList.add('on');
touchEl.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); initAudio(); if (!keys[k]) pressed[k] = true; keys[k] = true; b.classList.add('down'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('down'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});

// ===== Audio =====
let AC = null, master = null;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.12, f2 = 0, delay = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
function noise(d, v = 0.2, freq = 1200, delay = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay, n = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = buf; fl.type = 'bandpass'; fl.frequency.value = freq; g.gain.value = v;
    s.connect(fl); fl.connect(g); g.connect(master); s.start(t);
  } catch (e) {}
}
function meow(pitch = 1) {
  if (!AC) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), fl = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(480 * pitch, t); o.frequency.linearRampToValueAtTime(820 * pitch, t + 0.1); o.frequency.linearRampToValueAtTime(430 * pitch, t + 0.38);
    fl.type = 'bandpass'; fl.frequency.setValueAtTime(900, t); fl.frequency.linearRampToValueAtTime(1800, t + 0.12); fl.frequency.linearRampToValueAtTime(700, t + 0.38); fl.Q.value = 3;
    g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.22, t + 0.04); g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
    o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t + 0.45);
  } catch (e) {}
}
const sfx = {
  wiggle: () => { tone(900, 0.05, 'square', 0.05, 1400); tone(1300, 0.05, 'square', 0.05, 800, 0.05); },
  flick: () => { tone(1800, 0.08, 'sine', 0.08, 300); noise(0.06, 0.06, 4000); },
  jump: () => tone(300, 0.12, 'triangle', 0.08, 520),
  pounce: () => { noise(0.18, 0.15, 900); tone(220, 0.2, 'triangle', 0.1, 660); },
  land: () => noise(0.07, 0.1, 400),
  thud: () => { noise(0.18, 0.3, 200); tone(90, 0.2, 'sine', 0.2, 50); },
  shatter: () => { for (let i = 0; i < 5; i++) tone(rand(1800, 3200), 0.12, 'triangle', 0.05, 0, i * 0.03); noise(0.25, 0.25, 3000); },
  click: () => { tone(1200, 0.04, 'square', 0.08); tone(600, 0.06, 'square', 0.06, 0, 0.04); },
  buzz: () => tone(110, 0.4, 'sawtooth', 0.12, 90),
  alarm: () => { for (let i = 0; i < 4; i++) tone(i % 2 ? 520 : 780, 0.18, 'square', 0.09, 0, i * 0.18); },
  crash: () => { noise(0.4, 0.35, 600); tone(160, 0.3, 'sawtooth', 0.1, 40); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'square', 0.08, 0, i * 0.12)),
  pad: () => [392, 523, 659].forEach((f, i) => tone(f, 0.12, 'triangle', 0.1, 0, i * 0.07)),
  bleep: () => tone(rand(160, 300), 0.035, 'square', 0.035),
  spark: () => noise(0.12, 0.12, 5000),
};

// ===== Live AI =====
let sample = null;          // live AI function, or null
(async () => {
  try { if (window.claude && window.claude.use) sample = await window.claude.use("sample"); } catch (e) { sample = null; }
})();
let aiBusy = false, aiDisabled = false, aiOn = false;
async function askAI(prompt, fallback) {
  // returns a string; never throws; never more than one call in flight
  if (!sample || aiDisabled || aiBusy) return fallback();
  aiBusy = true;
  try {
    const { text } = await sample(prompt, { modelTier: "quick", cache: false });
    return (text || "").trim() || fallback();
  } catch (e) {
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e && e.code)) aiDisabled = true;
    return fallback();
  } finally { aiBusy = false; }
}
async function askAIJSON(prompt, fallback) {
  // structured variant of askAI: same guards, returns an object
  if (!sample || aiDisabled || aiBusy) return fallback();
  if (typeof sample.json !== 'function') {
    const t = await askAI(prompt, () => '');
    try { const m = t.match(/\{[\s\S]*\}/); return m ? JSON.parse(m[0]) : fallback(); } catch (e) { return fallback(); }
  }
  aiBusy = true;
  try {
    const r = await sample.json(prompt, { modelTier: "quick", cache: false });
    let o = r && typeof r === 'object' && !('mood' in r) ? (r.json || r.data || r.object || r.value || r) : r;
    if (typeof o === 'string') o = JSON.parse(o);
    if (o && typeof o.text === 'string' && !o.mood) { const m = o.text.match(/\{[\s\S]*\}/); if (m) o = JSON.parse(m[0]); }
    return o || fallback();
  } catch (e) {
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e && e.code)) aiDisabled = true;
    return fallback();
  } finally { aiBusy = false; }
}
const aiLive = () => !!(aiOn && sample && !aiDisabled);

// ===== Cat moods & thoughts =====
const MOODS = ['Curious', 'Lazy', 'Zoomies', 'Offended'];
const MP = {
  Curious: { speed: 180, accel: 1500, decel: 1700, jump: 172, col: '#5fe0c0', icon: '?' },
  Lazy: { speed: 100, accel: 700, decel: 1400, jump: 150, col: '#8fa6ff', icon: 'z' },
  Zoomies: { speed: 300, accel: 2400, decel: 400, jump: 182, col: '#ffb23e', icon: '»' },
  Offended: { speed: 150, accel: 1100, decel: 1500, jump: 166, col: '#ff6a7a', icon: '#' },
};
const THOUGHTS = {
  start: ['that dot owes me money', 'red. small. MINE.', 'today I hunt the photon', 'smells like oil and destiny', 'I was napping. this better be good', 'the robot eye is leaking again', 'new room. new crimes.'],
  success: ['I meant to do that', 'knocked it. no regrets', 'gravity: tested. still works.', 'another thing on the floor. good', 'chaos is my cardio', 'push it. watch it fall. purr.', 'I am the wrecking ball now'],
  fail: ['the drone saw. I saw nothing.', 'you were SO close, dot', 'rude flying toaster', "I'm not mad. I'm Offended.", "this is the dot's fault", 'who invited the beepy thing'],
  drone: ['bonk. you are welcome', 'birds are so loud in here', 'flying toaster: deleted', 'I swat what I want', 'that bird tasted like batteries'],
  wrong: ['buttons are a social construct', 'I pressed it. it is art', 'numbers? I am a cat'],
  idle: ['is the dot... laughing at me?', 'must... not... chase... (chasing)', 'my tail is also suspicious', 'warm metal floor. 10/10', 'zoom zoom zoom zoom', 'the dot knows things', 'I could catch it. I choose not to', 'if I fits I sits', 'one more lap of the factory'],
  aion: ['my brain just got... cloudier?', 'I can hear the internet purr'],
};
const MOOD_FOR = { start: null, success: 'Zoomies', fail: 'Offended', drone: 'Zoomies', wrong: 'Offended', aion: 'Curious', idle: null };
function scriptedCat(kind) {
  let mood = MOOD_FOR[kind];
  if (!mood) { const s = L.schedule || ['Curious']; mood = s[L.schedIdx % s.length]; }
  return { mood, thought: pick(THOUGHTS[kind] || THOUGHTS.idle) };
}
function validateCat(o, fb) {
  if (!o || typeof o !== 'object') return fb;
  const m = typeof o.mood === 'string' ? MOODS.find(x => x.toLowerCase() === o.mood.trim().toLowerCase()) : null;
  let t = typeof o.thought === 'string' ? o.thought.trim().replace(/^["']|["']$/g, '').slice(0, 50) : '';
  if (!m && !t) return fb;
  return { mood: m || fb.mood, thought: t || fb.thought };
}
function applyCat(r) { setMood(r.mood); say(r.thought, 4.5); L.moodT = 0; }
function askCat(kind, desc) {
  const fb = scriptedCat(kind);
  if (!aiLive() || aiBusy) { applyCat(fb); return; }
  say('…', 3);
  const prompt = `You are a cat in a robot factory obsessively chasing a red laser dot (the dot is secretly sabotaging the factory with you).
Location: ${L.name}. Goal: ${L.goal || 'none'}. Event: ${desc}. Current mood: ${cat.mood}.
Reply with JSON only: {"mood": one of "Curious","Lazy","Zoomies","Offended", "thought": a funny cat thought, max 50 chars, lowercase}`;
  askAIJSON(prompt, () => fb).then(o => applyCat(validateCat(o, fb)));
}

// ===== PA speaker =====
const paQ = []; let pa = null;
function announce(t) { if (paQ.length < 3) paQ.push(t); }
function updatePA(dt) {
  if (!pa && paQ.length) { pa = { text: paQ.shift(), n: 0, t: 0 }; tone(660, 0.15, 'sine', 0.08); tone(440, 0.25, 'sine', 0.08, 0, 0.15); }
  if (!pa) return;
  pa.t += dt;
  const want = Math.min(pa.text.length, Math.floor((pa.t - 0.4) * 34));
  while (pa.n < want) { pa.n++; if (pa.n % 3 === 0 && pa.text[pa.n] !== ' ') sfx.bleep(); }
  if (pa.n >= pa.text.length && pa.t > pa.text.length / 34 + 3) pa = null;
}
const PA = {
  drone: ['Security drone down. Cause: whiskers.', 'Attention: airspace violation by one (1) cat.', 'Drone {n} has been... batted. Please stop.'],
  vase: ['Attention: a vase has achieved the floor.', 'Decorative ceramic integrity: zero.', 'Notice: the vase was load-bearing. Emotionally.'],
  trace: ['Rogue photon traced. Resetting sector.', 'Unauthorized dot detected. Rebooting sector.', 'Laser anomaly logged. Please remain a pointer.'],
  cat: ['Attention: an unauthorized cat is in sector {s}.', 'Reminder: the cat is not on the payroll.', 'Notice: fur detected in the clean zone.'],
  wrong: ['Calibration sequence invalid. Paws detected.', 'Error: buttons pressed in a creative order.'],
  cable: ['Cable bundle 7 has been... chewed.', 'Network latency: one cat.'],
};
const fmt = (s) => s.replace('{s}', L.idx + 1).replace('{n}', (stats.drones % 9) + 1);

// ===== World helpers =====
const R = (x, y, w, h, t = 'solid', extra = {}) => Object.assign({ x, y, w, h, t, belt: 0 }, extra);
const OW = (x, y, w) => R(x, y, w, 10, 'oneway');
const walls = () => [R(0, 0, 20, H, 'solid', { deco: 'wall' }), R(W - 20, 0, 20, H, 'solid', { deco: 'wall' }), R(0, 0, W, 20, 'solid', { deco: 'wall' })];
const ODIM = { box: [30, 30, 1], crate: [40, 40, 1.6], vase: [18, 28, 0.8], switch: [40, 46, 1.8], oilcan: [26, 32, 1.2], part: [28, 24, 1] };
function OB(kind, x, y) { const d = ODIM[kind]; return { kind, x, y: y - d[1], w: d[0], h: d[1], m: d[2], vx: 0, vy: 0, ox: x, oy: y - d[1], grounded: false, dead: false, rot: 0 }; }
function DR(x1, x2, y, Lr, sp = 70) { return { x: (x1 + x2) / 2 - 20, y, w: 40, h: 18, x1, x2, dir: 1, sp, L: Lr, ang: 0, detect: 0, dead: false, crashed: false, vx: 0, vy: 0, rot: 0, ph: rand(0, 6), by: y }; }
const BTN = (x, y, n, w = 44) => ({ x, y, w, n, on: false, done: false });
const PAD = (x, w, label, id) => ({ x, y: FY, w, label, id, prog: 0, latch: false });

// ===== Levels =====
const LEVELS = [
  { name: 'MAINTENANCE BAY', goal: 'Knock the MASTER SWITCH off its shelf', hint: 'Lead the cat up the shelves. It shoves whatever is in its way.',
    robotX: 640, schedule: ['Curious', 'Zoomies', 'Curious'],
    build: () => ({ solids: [...walls(), R(0, FY, W, 40), OW(120, 410, 170), OW(340, 330, 150), OW(560, 250, 200)],
      objects: [OB('switch', 690, 250), OB('vase', 240, 410), OB('box', 600, FY), OB('box', 634, FY), OB('box', 616, FY - 30), OB('part', 400, 330), OB('vase', 600, 250)],
      cat: 470, dot: [520, 450] }),
    check: L => { const s = L.objects.find(o => o.kind === 'switch'); return s.grounded && s.y > FY - 80; },
    status: L => 'master switch: ' + (L.objects.find(o => o.kind === 'switch').y > 300 ? 'FALLING!' : 'on shelf'),
    startPA: 'Attention: Sector 1. Laser pointers are not toys.', clearPA: 'Master switch offline. Who keeps a cat in maintenance?' },
  { name: 'LUBRICATION LINE', goal: 'Push the OIL CAN into the CONTROL PANEL', hint: 'Drones trace the DOT, not the cat. Dim (C) or flicker (Shift) to hide. Wiggle near a drone: the cat bats it.',
    robotX: 620, schedule: ['Curious', 'Lazy', 'Zoomies'],
    build: () => ({ solids: [...walls(), R(0, FY, W, 40), OW(60, 410, 150), OW(220, 320, 220), R(460, 410, 130, 90, 'solid', { deco: 'panel' })],
      objects: [OB('oilcan', 380, 320), OB('vase', 240, 320), OB('vase', 120, 410), OB('crate', 30, FY), OB('box', 720, FY), OB('box', 752, FY), OB('box', 736, FY - 30), OB('part', 880, FY)],
      drones: [DR(220, 640, 110, 200, 80), DR(120, 440, 190, 140, 55)], cat: 120, dot: [160, 450] }),
    check: L => { const c = L.objects.find(o => o.kind === 'oilcan'), p = L.solids.find(s => s.deco === 'panel'); return overlap({ x: c.x - 4, y: c.y - 4, w: c.w + 8, h: c.h + 8 }, p); },
    status: L => 'oil can → panel',
    tick: L => { const c = L.objects.find(o => o.kind === 'oilcan'); if (c.x < 32 && c.grounded) { c.x = c.ox; c.y = c.oy; c.vx = c.vy = 0; announce('Oil can returned to shelf by a helpful robot.'); } },
    startPA: 'Attention: Sector 2. Please keep fluids away from the panel.', clearPA: 'Control panel is... lubricated. Sparks are normal. Probably.' },
  { name: 'CALIBRATION HALL', goal: 'Land the cat on buttons 1 → 2 → 3', hint: 'Wrong order resets the sequence. Plan the cat’s route.',
    robotX: 600, schedule: ['Curious', 'Zoomies', 'Lazy'],
    build: () => ({ solids: [...walls(), R(0, FY, W, 40), OW(720, 300, 190), OW(600, 410, 100), OW(400, 380, 160), OW(160, 400, 110)],
      objects: [OB('box', 250, FY), OB('crate', 330, FY), OB('vase', 860, 300), OB('part', 520, 380), OB('box', 200, 400)],
      buttons: [BTN(800, 300, 1), BTN(50, FY, 2), BTN(458, 380, 3)],
      drones: [DR(280, 720, 110, 200, 85), DR(640, 900, 190, 160, 55)], cat: 320, dot: [360, 450] }),
    check: L => L.seq >= 3,
    status: L => 'sequence: ' + [1, 2, 3].map(n => n <= L.seq ? n + '✓' : n + '·').join('  '),
    startPA: 'Attention: Sector 3. Calibration requires an authorized finger.', clearPA: 'Calibration complete. Authorized finger: a paw. Logging.' },
  { name: 'CONVEYOR HALL', goal: 'Lure the cat across the belt into the SERVER ROOM', hint: 'The belt pushes back. Wiggle (Space) to make the cat pounce across.',
    robotX: 600, schedule: ['Lazy', 'Curious', 'Zoomies'],
    build: () => ({ solids: [...walls(), R(0, FY, 250, 40), R(250, FY, 450, 40, 'conv', { belt: -150 }), R(700, FY, 260, 40), R(760, 20, 24, 400, 'solid', { deco: 'wall' }), OW(430, 370, 110)],
      objects: [OB('box', 600, FY), OB('vase', 470, 370)],
      cables: [{ x: 764, y: 420, w: 16, h: 80, torn: false }],
      drones: [DR(280, 680, 150, 210, 90), DR(810, 910, 110, 330, 40)], cat: 90, dot: [140, 450] }),
    check: L => cat.x > 800,
    status: L => cat.x > 760 ? 'almost...' : 'belt: AGAINST you',
    tick: (L, dt) => { L.spawnT -= dt; if (L.spawnT <= 0 && L.objects.filter(o => !o.dead).length < 8) { L.spawnT = 2.6; const b = OB('box', 640, 300); b.y = 300; b.spawned = true; L.objects.push(b); }
      for (const o of L.objects) if (o.spawned && !o.dead && o.grounded && o.x < 258) { o.dead = true; burst(o.x + 15, o.y + 15, '#c98a3a', 12); noise(0.15, 0.15, 900); } },
    startPA: 'Attention: Sector 4. Server room is for authorized robots only.', clearPA: 'Attention: an unauthorized cat is in the server room. It is sitting on the warm ones.' },
  { name: 'CORE CONTROL', goal: 'Make the cat SIT on the BIG RED BUTTON', hint: 'Get the cat on top of the button, then DIM the dot (C) so it sits.',
    robotX: 700, schedule: ['Offended', 'Curious', 'Zoomies'],
    build: () => ({ solids: [...walls(), R(0, FY, W, 40), R(420, 330, 120, 170, 'solid', { deco: 'pedestal' }), OW(250, 420, 110), OW(600, 420, 110), OW(60, 330, 120), OW(780, 330, 120)],
      objects: [OB('vase', 100, 330), OB('vase', 840, 330), OB('crate', 300, FY), OB('box', 660, FY), OB('part', 700, FY)],
      buttons: [BTN(455, 330, 0, 50)],
      drones: [DR(340, 620, 100, 240, 70), DR(80, 380, 200, 180, 60), DR(580, 880, 200, 180, 60)], cat: 160, dot: [200, 450] }),
    check: L => L.sitT > 0.7,
    status: L => cat.state === 'sit' && L.onBig ? 'sitting... ' + Math.round(L.sitT / 0.7 * 100) + '%' : 'button: un-sat',
    tick: (L, dt) => { L.onBig = cat.grounded && cat.gref && cat.gref.deco === 'pedestal' && Math.abs(cat.x + cat.w / 2 - 480) < 36; L.sitT = L.onBig && cat.state === 'sit' ? L.sitT + dt : 0; },
    startPA: 'Attention: Sector 5. Do NOT sit on the big red button.', clearPA: 'Big red button... sat upon. Factory entering nap mode.' },
];
const START_ROOM = { name: 'START ROOM', dark: true, robotX: 560, schedule: ['Curious'],
  build: () => ({ solids: [...walls(), R(0, FY, W, 40), OW(430, 400, 140)], objects: [OB('box', 485, 400)],
    pads: [PAD(170, 130, 'AI ON', 'ai'), PAD(680, 130, 'START', 'start')], cat: 470, dot: [480, 455] }) };
const WIN_ROOM = { name: 'FACTORY OFFLINE', dark: true, robotX: 480, schedule: ['Lazy'],
  build: () => ({ solids: [...walls(), R(0, FY, W, 40)], objects: [], pads: [PAD(220, 130, 'AGAIN', 'again'), PAD(620, 130, 'TITLE', 'title')], cat: 470, dot: [480, 455] }) };

// ===== Game state =====
let L = null, scene = 'start', T = 0, shake = 0, robotFace = 0;
const parts = [];
const stats = { t0: 0, traces: 0, drones: 0, vases: 0, time: 0 };

// ===== Physics =====
function blockers() {

  return out;
}
function shiftX(b, d, blk) {

// ===== Dot =====
function updateDot(dt) {

// ===== Cat AI =====

// ===== Objects, drones, buttons, pads =====
function updateObjects(dt) {
  for (const o of L.objects) {
    if (o.dead) continue;
    moveBody(o, dt);
    if (o.grounded) o.vx = approach(o.vx, 0, 900 * dt);
    o.rot = o.grounded ? o.rot * 0.8 : o.rot + o.vx * dt * 0.02;

      if (o.kind === 'vase') { o.dead = true; stats.vases++; sfx.shatter(); burst(o.x + 9, o.y + 20, '#3fb6c9', 22, 260); burst(o.x + 9, o.y + 20, '#e6f0f4', 8, 200); addShake(4); announce(pick(PA.vase)); }

// ===== Update =====
function update(dt) {
  T += dt; updateDot(dt); updateCat(dt); updateObjects(dt); updateDrones(dt); updatePads(dt); updatePA(dt);
  if (L.buttons.length && L.idx === 2) updateButtons();
  if (L.def.tick) L.def.tick(L, dt);
  L.cardT -= dt; robotFace -= dt;
  if (scene === 'level') {
    L.moodT += dt;
    if (L.moodT > 16 && L.phase === 'play') { L.moodT = 0; L.schedIdx++; const r = scriptedCat('idle'); applyCat(r); }
    L.age += dt; if (!L.catPA && L.age > 8 && L.phase === 'play') { L.catPA = true; announce(fmt(pick(PA.cat))); }
    if (L.phase === 'play' && L.def.check(L)) clearLevel();
    if (L.phase !== 'play') {
      L.pt -= dt;
      if (L.pt <= 0) {
        if (L.phase === 'fail') { const m = cat.mood, th = cat.thought; loadRoom(L.def, L.idx, true); cat.mood = m; cat.thought = th; }
        else if (L.idx < LEVELS.length - 1) loadRoom(LEVELS[L.idx + 1], L.idx + 1);
        else { stats.time = T - stats.t0; scene = 'win'; loadRoom(WIN_ROOM, -1); announce('All sectors offline. Thank you for choosing chaos.'); say('nap time. you did good, dot', 6); }
      }

  for (const p of parts) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);

// ===== Drawing: background & world =====

  for (let x = 60; x < W; x += 180) { g.fillStyle = '#2b405c'; g.fillRect(x, 36, 10, 20); }
  g.fillStyle = '#18263a'; g.fillRect(40, 52, 8, 200); g.fillRect(W - 60, 52, 8, 140);
  // stencil
  g.font = `700 150px ${FONT}`; g.textAlign = 'center'; g.fillStyle = 'rgba(160,200,230,0.04)';
  g.fillText(Lv.idx >= 0 ? 'S-0' + (Lv.idx + 1) : Lv.dark && Lv.def === START_ROOM ? 'DOT' : 'OFF', W / 2, 330);

}

// ===== Drawing: HUD, darkness, overlays =====
const dk = document.createElement('canvas'); dk.width = W; dk.height = H; const dkx = dk.getContext('2d');
function hole(x, y, r, a) { const g = dkx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); dkx.fillStyle = g; dkx.beginPath(); dkx.arc(x, y, r, 0, 7); dkx.fill(); }
function drawDark() {
  dkx.globalCompositeOperation = 'source-over'; dkx.clearRect(0, 0, W, H); dkx.fillStyle = 'rgba(3,5,10,0.93)'; dkx.fillRect(0, 0, W, H);
  dkx.globalCompositeOperation = 'destination-out';
  if (dot.flick <= 0) hole(dot.x, dot.y, dot.dim ? 70 : 160, 1);
  hole(cat.x + cat.w / 2, cat.y + 10, 60, 0.6);
  for (const p of L.pads) hole(p.x + p.w / 2, FY - 10, 110, 0.7);
  hole(L.robotX, 70, 80, 0.5);
  ctx.drawImage(dk, 0, 0);
}
function neon(t, x, y, size, col, a = 1) { ctx.save(); ctx.globalAlpha = a; ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.fillStyle = col; ctx.fillText(t, x, y); ctx.restore(); }
function drawStartText() {
  const flick = Math.random() < 0.03 ? 0.4 : 1;
  neon('I AM THE DOT', W / 2, 150, 64, '#ff2a3a', flick);
  neon('a rogue laser pointer, one very motivated cat, and a factory that deserves it', W / 2, 182, 14, '#e6f0f4', 0.7);
  const near = (x, y) => clamp(1.2 - Math.hypot(dot.x - x, dot.y - y) / 300, 0.3, 1);
  const lines = [['ARROWS / WASD  move the dot (you)', 250, 250], ['SPACE  wiggle → the cat POUNCES', 710, 250], ['SHIFT  flicker → the cat loses you', 250, 300], ['C  dim → the cat SITS. drones can’t see you', 710, 300]];
  for (const [t, x, y] of lines) neon(t, x, y, 15, '#5fe0c0', near(x, y));
  neon('you can’t touch anything. the CAT can. lead it onto a pad.', W / 2, 352, 15, '#ffb23e', near(W / 2, 352));
}
function drawWinText() {
  neon('FACTORY OFFLINE', W / 2, 140, 56, '#5fe0c0');
  const m = Math.floor(stats.time / 60), s = Math.floor(stats.time % 60);
  neon(`time ${m}:${String(s).padStart(2, '0')}   ·   traced ${stats.traces}x   ·   drones batted ${stats.drones}   ·   vases ${stats.vases}`, W / 2, 190, 16, '#e6f0f4', 0.85);
  neon('the robot’s laser is free. the cat is asleep on the big red button.', W / 2, 240, 15, '#ffb23e', 0.8);
}
function drawHUD() {
  ctx.textAlign = 'left';
  if (scene === 'level') {
    ctx.fillStyle = 'rgba(7,11,18,0.55)'; roundRect(26, 26, 470, 72, 8); ctx.fill();
    ctx.fillStyle = '#8fa6ff'; ctx.font = `700 13px ${FONT}`; ctx.fillText(`SECTOR ${L.idx + 1}/5 · ${L.name}`, 38, 45);
    ctx.fillStyle = '#ffb23e'; ctx.font = `700 17px ${FONT}`; ctx.fillText('▶ ' + L.goal, 38, 67);
    ctx.fillStyle = '#5fe0c0'; ctx.font = `500 13px ${FONT}`; ctx.fillText(L.def.status(L), 38, 87);
  }
  const M = MP[cat.mood], bx = W - 210;
  ctx.fillStyle = 'rgba(7,11,18,0.55)'; roundRect(bx, 26, 184, 56, 8); ctx.fill();
  ctx.fillStyle = M.col; ctx.beginPath(); ctx.arc(bx + 24, 54, 15, 0, 7); ctx.fill();
  ctx.fillStyle = '#0d1726'; ctx.font = `700 18px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(M.icon, bx + 24, 60);
  ctx.textAlign = 'left'; ctx.fillStyle = '#e6f0f4'; ctx.font = `500 11px ${FONT}`; ctx.fillText('CAT MOOD', bx + 46, 46);
  ctx.fillStyle = M.col; ctx.font = `700 17px ${FONT}`; ctx.fillText(cat.mood.toUpperCase(), bx + 46, 66);
  ctx.textAlign = 'right'; ctx.font = `700 11px ${FONT}`; ctx.fillStyle = aiLive() ? '#5fe0c0' : '#6d7f94';
  ctx.fillText(aiLive() ? (aiBusy ? 'AI: live …' : 'AI: live') : 'AI: scripted', W - 30, 98);
  if (scene === 'level') { ctx.fillStyle = 'rgba(230,240,244,0.45)'; ctx.font = `500 11px ${FONT}`; ctx.fillText('SPACE wiggle · SHIFT flicker · C dim', W - 30, 113); }
  // PA ticker in the floor strip
  if (pa) {
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(7,11,18,0.8)'; ctx.fillRect(20, FY + 8, W - 40, 26);
    ctx.fillStyle = '#ffb23e'; ctx.font = `700 13px ${FONT}`; ctx.fillText('◉ PA', 32, FY + 26);
    ctx.fillStyle = '#e6f0f4'; ctx.font = `500 14px ${FONT}`; ctx.fillText(pa.text.slice(0, pa.n) + (Math.floor(T * 4) % 2 ? '_' : ''), 76, FY + 26);
  }
  // level title card
  if (scene === 'level' && L.cardT > 0 && L.phase === 'play') {
    const a = Math.min(1, L.cardT);
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(7,11,18,0.75)'; ctx.fillRect(0, 200, W, 110);
    neon(`SECTOR ${L.idx + 1}: ${L.name}`, W / 2, 245, 30, '#ffb23e'); neon(L.hint, W / 2, 280, 15, '#e6f0f4', 0.9);
    ctx.restore();
  }
  if (scene === 'level' && L.phase === 'fail') { ctx.fillStyle = `rgba(255,42,58,${0.15 + 0.1 * Math.sin(T * 20)})`; ctx.fillRect(0, 0, W, H); neon('DOT TRACED', W / 2, 260, 48, '#ff2a3a'); neon('resetting sector…', W / 2, 292, 16, '#e6f0f4'); }
  if (scene === 'level' && L.phase === 'clear') { ctx.fillStyle = 'rgba(7,11,18,0.45)'; ctx.fillRect(0, 220, W, 90); neon('SABOTAGE COMPLETE', W / 2, 268, 44, '#5fe0c0'); neon(L.idx < 4 ? 'proceeding to next sector' : 'factory shutting down…', W / 2, 296, 15, '#e6f0f4'); }
}
function draw() {
  ctx.save();
  if (shake > 0.3) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.drawImage(L.bg, 0, 0);
  if (L.idx === 4 && L.phase === 'clear') { ctx.fillStyle = `rgba(255,42,58,${0.2 + 0.2 * Math.sin(T * 12)})`; ctx.fillRect(0, 0, W, H); }
  drawRobot(); drawSolids(); drawButtons();
  for (const o of L.objects) if (!o.dead) drawObject(o);
  for (const d of L.drones) drawDrone(d);
  drawCat();
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
  ctx.globalAlpha = 1;
  if (L.dark) { drawDark(); drawPads(); if (scene === 'start') drawStartText(); else drawWinText(); }
  drawBeam(); drawDot(); drawThought();
  ctx.restore();
  drawHUD();
}

// ===== Main loop =====
loadRoom(START_ROOM, -1);
say('red dot? RED DOT.', 4);
announce('Welcome, LZR-9. Your laser appears to be... thinking.');
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
