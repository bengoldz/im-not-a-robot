<title>Laser Pointer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0f1820; --ink:#eaf4f4; --accent:#f2b134; --laser:#ff2b3a; --mint:#6fe3c1; --panel:#1c2b36;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{display:block;background:#14202b;border-radius:6px;box-shadow:0 0 0 2px #22343f,0 10px 40px #0008}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;padding:10px 12px;justify-content:space-between;pointer-events:none}
#touch .tg{display:flex;gap:8px;pointer-events:auto}
#touch button{width:62px;height:62px;border-radius:50%;border:2px solid #ffffff55;background:#1c2b36cc;color:var(--ink);font:800 18px "Baloo 2","Trebuchet MS",sans-serif;touch-action:none}
#touch button:active{background:var(--laser)}
@media (pointer:coarse){#touch{display:flex}}
</style>
<canvas id="c" width="960" height="540"></canvas>
<div id="touch">
  <div class="tg"><button data-k="l">&#9664;</button><button data-k="r">&#9654;</button></div>
  <div class="tg"><button data-k="d">&#9660;</button><button data-k="x">DASH</button><button data-k="u">&#9650;</button></div>
</div>
<script>
// ===== Setup =====
const W = 960, H = 540, FLOOR = 480;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Baloo 2","Trebuchet MS",system-ui,sans-serif';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ===== Audio =====
let AC = null, master = null;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.2, slide = 0, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, v = 0.3, freq = 1500, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, len = Math.floor(AC.sampleRate * d);
  const buf = AC.createBuffer(1, len, AC.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.7;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  src.connect(f); f.connect(g); g.connect(master); src.start(t);
}
const SFX = {
  jump: () => tone(380, 0.12, 'square', 0.08, 320),
  land: () => noise(0.07, 0.12, 400),
  dash: () => noise(0.18, 0.18, 2600),
  knock: () => tone(520, 0.06, 'triangle', 0.15, -120),
  shatter: () => { noise(0.4, 0.35, 3200); for (let i = 0; i < 5; i++) tone(rand(1800, 3600), 0.09, 'sine', 0.07, 0, i * 0.035); },
  thud: () => { tone(120, 0.18, 'sine', 0.3, -60); noise(0.08, 0.1, 300); },
  clang: () => { tone(240, 0.7, 'triangle', 0.25); tone(611, 0.5, 'square', 0.04); },
  ding: () => { tone(1320, 1.3, 'sine', 0.25); tone(2640, 0.9, 'sine', 0.07); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'square', 0.09, 0, i * 0.1)),
  fail: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'sawtooth', 0.07, 0, i * 0.13)),
  beep: () => tone(rand(800, 1300), 0.05, 'square', 0.04),
  pad: () => { tone(660, 0.08, 'square', 0.08); tone(990, 0.12, 'square', 0.08, 0, 0.07); },
  bonk: () => { tone(180, 0.25, 'square', 0.15, -100); noise(0.15, 0.2, 800); },
  zap: () => { for (let i = 0; i < 6; i++) tone(rand(200, 900), 0.05, 'sawtooth', 0.06, 0, i * 0.04); },
  purr: () => tone(90, 0.3, 'sawtooth', 0.05, 20),
  pop: () => tone(900, 0.1, 'sine', 0.12, 600),
};

// ===== Input =====
const keys = {}, pressed = {};
const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', Space: 'u', ArrowDown: 'd', KeyS: 'd', ShiftLeft: 'x', ShiftRight: 'x' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); initAudio();
  if (!keys[k]) pressed[k] = true; keys[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); if (!keys[k]) pressed[k] = true; keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { keys[k] = false; }));
});
if (matchMedia('(pointer: coarse)').matches) document.getElementById('touch').style.display = 'flex';
const anyPressed = () => pressed.l || pressed.r || pressed.u || pressed.d || pressed.x;

// ===== Live AI =====
let sample = null;
(async () => {
  try { if (window.claude && window.claude.use) sample = await window.claude.use("sample"); } catch (e) { sample = null; }
})();
let aiBusy = false, aiDisabled = false, aiOn = false;
async function askAI(prompt, fallback) {
  if (!sample || aiDisabled || aiBusy) return fallback();
  aiBusy = true;
  try {
    const { text } = await sample(prompt, { modelTier: "quick", cache: false });
    return (text || "").trim() || fallback();
  } catch (e) {
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e && e.code)) aiDisabled = true;
    return fallback();
  } finally { aiBusy = false; }
}
const aiLive = () => aiOn && !!sample && !aiDisabled;
function cleanLine(s) {
  s = String(s).split('\n').find(l => l.trim()) || '';
  s = s.replace(/^["'“”\s]+|["'“”\s]+$/g, '').replace(/^PIP[-\w]*:\s*/i, '');
  return s.length > 80 ? s.slice(0, 79) + '…' : s;
}

// ===== Robot lines (scripted fallback) =====
const LINES = {
  hello: ["Voice module on. Oh! Hello. Sorry. Hello.", "I can talk now. Please do not tell the owner."],
  hellooff: ["Voice module off. Beep only. Sorry.", "Going quiet. Scripted mode. Apologies."],
  start: [
    ["The red dot knows things. Follow the red dot, please.", "Paper above. Ding below. Please make it ding.", "Ding = dinner. Just saying. Politely."],
    ["Small vacuum. Big appetite. Green thing... gravity?", "It ate my charging cable. Plant. Down. Please.", "Shelf. Leaf. Bump. Bzzt. You see?"],
    ["Intruder! Sorry, I mean: intruder!!", "Blue vase, high and lonely. Hat below. Timing...", "He walks slow. The vase waits. So do I."],
    ["Another one. In the kitchen. Oh no oh no.", "Heavy pan, high rack. Very... dropworthy.", "Cheese thief approaching. The pan has opinions."],
  ],
  fail: ["Oh dear. That was... a lot of glass.", "Keys in the door. Hide. I'm a lamp now.", "I will tell them it was the wind. Again.", "Mistakes happen. Mostly to vases.", "Let us try again. I believe in you. Mostly."],
  escaped: ["He got away! I pointed so hard!", "Gone. I will file a very polite report.", "Next time: drop first, apologise later."],
  clear: ["Success! I will log this as an accident.", "Perfect. Nobody saw anything. Especially me.", "Excellent knocking. Ten out of ten. Please stop.", "You are a good cat. A destructive, good cat.", "Mission complete. Reward: one (1) red dot."],
  lost: ["Ah. Wrong spot. I have a spare. Somehow.", "That one did not count. Here, another.", "Close! Please aim at where I point.", "Spare deployed. The owner must never know."],
  mess: ["Please... not THAT one.", "That was not the dot.", "The mess meter grows. I am sweating oil.", "Eep. Collateral."],
};
const lastLine = {};
function pickLine(arr, key) {
  let l = pick(arr); if (arr.length > 1) while (l === lastLine[key]) l = pick(arr);
  lastLine[key] = l; return l;
}

// ===== Levels =====
const OBJ_T = {
  vase: { w: 16, h: 26, brk: 1, c: '#4fb6c9', d: '#2c7f95' },
  mug: { w: 15, h: 12, brk: 1, c: '#f2b134', d: '#c4831b' },
  plant: { w: 20, h: 30, brk: 1, c: '#3fa36b', d: '#2a6b8a' },
  book: { w: 26, h: 8, brk: 0, c: '#d9475b', d: '#8f2638' },
  pan: { w: 30, h: 9, brk: 0, c: '#3a3f48', d: '#1d2026' },
  jar: { w: 14, h: 18, brk: 1, c: '#9fd6e8', d: '#e9a24a' },
};
const START = {
  room: true, name: 'Living Room', kind: 'room', wall: '#26404f', spawn: 40, robot: { x: 830, y: 95 },
  plats: [{ k: 'couch', x: 250, y: 418, w: 130, h: 62, solid: true }, { k: 'shelf', x: 580, y: 360, w: 130 }],
  objs: [{ t: 'mug', x: 610, y: 360 }, { t: 'plant', x: 670, y: 360 }],
  pads: [{ id: 'how', label: 'HOW TO', x: 90, w: 110, c: '#6fe3c1' }, { id: 'ai', label: 'AI ON', x: 430, w: 110, c: '#4fb6c9' }, { id: 'start', label: 'START', x: 790, w: 120, c: '#f2b134' }],
};
const LEVELS = [
  { name: 'The Study', kind: 'bell', goal: 'Knock the BOOK onto the desk bell', mess: 4, wall: '#2d4659', spawn: 60, robot: { x: 830, y: 100 },
    plats: [{ k: 'table', x: 360, y: 400, w: 280 }, { k: 'shelf', x: 190, y: 320, w: 150 }, { k: 'shelf', x: 420, y: 240, w: 140 }, { k: 'shelf', x: 700, y: 310, w: 140 }],
    objs: [{ t: 'book', x: 527, y: 240, target: 1 }, { t: 'mug', x: 452, y: 240 }, { t: 'mug', x: 300, y: 320 }, { t: 'vase', x: 770, y: 310 }, { t: 'jar', x: 420, y: 400 }],
    bell: { x: 602, y: 400 } },
  { name: 'Living Room', kind: 'vacuum', goal: 'Drop the PLANT on the robo-vacuum', mess: 4, wall: '#34505a', spawn: 310, robot: { x: 140, y: 100 },
    plats: [{ k: 'couch', x: 40, y: 410, w: 230, h: 70, solid: true }, { k: 'table', x: 300, y: 395, w: 80 }, { k: 'shelf', x: 390, y: 312, w: 120 }, { k: 'shelf', x: 565, y: 232, w: 175 },
      { k: 'cabinet', x: 790, y: 410, w: 150, h: 70, solid: true }, { k: 'shelf', x: 800, y: 322, w: 130 }],
    objs: [{ t: 'plant', x: 660, y: 232, target: 1 }, { t: 'mug', x: 592, y: 232 }, { t: 'book', x: 455, y: 312 }, { t: 'mug', x: 340, y: 395 }, { t: 'vase', x: 928, y: 410 }, { t: 'jar', x: 885, y: 322 }],
    vacuum: { x: 420, min: 300, max: 770, spd: 1.25 } },
  { name: 'The Hallway', kind: 'burglar', goal: 'Drop the VASE on the burglar', mess: 4, wall: '#3a4560', spawn: 720, robot: { x: 560, y: 90 },
    plats: [{ k: 'table', x: 640, y: 400, w: 180 }, { k: 'shelf', x: 480, y: 322, w: 130 }, { k: 'shelf', x: 300, y: 242, w: 150 }, { k: 'shelf', x: 90, y: 165, w: 180 }],
    objs: [{ t: 'vase', x: 205, y: 165, target: 1 }, { t: 'mug', x: 120, y: 165 }, { t: 'plant', x: 330, y: 242 }, { t: 'jar', x: 425, y: 242 }, { t: 'book', x: 545, y: 322 }, { t: 'mug', x: 680, y: 400 }, { t: 'mug', x: 790, y: 400 }],
    burglar: { x: 1010, goal: 60, spd: 0.42, msg: 'He got away with the TV!' } },
  { name: 'The Kitchen', kind: 'burglar', goal: 'Drop the PAN on the cheese thief', mess: 4, wall: '#2f5a52', spawn: 560, robot: { x: 700, y: 95 },
    plats: [{ k: 'fridge', x: 30, y: 230, w: 92, h: 250, solid: true }, { k: 'counter', x: 122, y: 390, w: 258, h: 90, solid: true }, { k: 'shelf', x: 150, y: 300, w: 200 },
      { k: 'rack', x: 420, y: 220, w: 200 }, { k: 'table', x: 690, y: 400, w: 170 }, { k: 'shelf', x: 770, y: 312, w: 130 }],
    objs: [{ t: 'pan', x: 560, y: 220, target: 1 }, { t: 'mug', x: 455, y: 220 }, { t: 'jar', x: 76, y: 230 }, { t: 'mug', x: 175, y: 390 }, { t: 'jar', x: 335, y: 390 }, { t: 'jar', x: 205, y: 300 }, { t: 'mug', x: 300, y: 300 },
      { t: 'mug', x: 725, y: 400 }, { t: 'plant', x: 825, y: 400 }, { t: 'vase', x: 840, y: 312 }],
    burglar: { x: 1010, goal: 140, spd: 0.52, msg: 'He took the fancy cheese!' } },
];

// ===== World state =====
let cur = START, levelIdx = -1, plats = [], objs = [], parts = [], pads = [];
let mess = 0, state = 'play', stateT = 0, frameN = 0, shake = 0, totalMess = 0, wonAll = false, showHow = 0, startT = -1;
let burglar = null, vac = null, bell = null, best = null;
try { const b = localStorage.getItem('laserpointer_best'); if (b !== null) best = +b; } catch (e) { }
const C = { x: 0, y: 0, w: 30, h: 22, vx: 0, vy: 0, ground: false, coyote: 0, buf: 0, face: 1, dash: 0, dashCd: 0, airDash: true, crouch: false, sx: 1, sy: 1, drop: 0, run: 0, near: false, blink: 0 };
const robot = { ax: 0, ay: 0, x: 0, y: 0, say: '', sayT: 0, sayId: 0, chars: 0 };
const laser = { x: 480, y: 300, ax: 480, ay: 300, phase: 'wander', t: 0, next: 0, path: null };

function makeObj(o) {
  const T = OBJ_T[o.t];
  return { t: o.t, T, w: T.w, h: T.h, x: o.x - T.w / 2, y: o.y - T.h, home: { x: o.x - T.w / 2, y: o.y - T.h }, vx: 0, vy: 0, ground: true, alive: true,
    target: !!o.target, rot: 0, vr: 0, cd: 0, messed: false, respawn: 0 };
}
function loadLevel(i) {
  levelIdx = i; cur = i < 0 ? START : LEVELS[i];
  plats = [{ k: 'floor', x: -60, y: FLOOR, w: W + 120, h: 100, solid: true }, { k: 'wall', x: -40, y: -400, w: 40, h: 1000, solid: true }, { k: 'wall', x: W, y: -400, w: 40, h: 1000, solid: true }];
  cur.plats.forEach(p => plats.push(Object.assign({}, p)));
  objs = cur.objs.map(makeObj); parts = [];
  pads = (cur.pads || []).map(p => Object.assign({ on: false, glow: 0 }, p));
  mess = 0; state = 'play'; stateT = 0; startT = -1; showHow = 0;
  Object.assign(C, { x: cur.spawn, y: FLOOR - 22, h: 22, vx: 0, vy: 0, dash: 0, crouch: false, face: 1, ground: true });
  burglar = cur.burglar ? Object.assign({ ko: false, koT: 0, delay: 150, anim: 0 }, cur.burglar) : null;
  vac = cur.vacuum ? Object.assign({ dir: 1, dead: false, deadT: 0 }, cur.vacuum) : null;
  bell = cur.bell ? Object.assign({ ring: 0 }, cur.bell) : null;
  robot.ax = robot.x = cur.robot.x; robot.ay = robot.y = cur.robot.y;
  Object.assign(laser, { x: robot.x, y: robot.y + 30, phase: 'wander', t: 0, next: 0 });
  if (!cur.room) robotEvent('start');
  else if (wonAll) say(`All rooms safe! Total mess: ${totalMess}. ${best !== null ? 'Best: ' + best + '.' : ''} Thank you!`);
  else say('Hello, cat. Please step on START. Or chase the dot. Both fine.');
}

// ===== Robot speech + AI events =====
function say(text) { robot.say = text; robot.sayT = 0; robot.chars = 0; robot.sayId++; }
function levelDesc() {
  const where = o => {
    const cx = o.x + o.w / 2, cy = o.y + o.h;
    const hz = cx < 320 ? 'left' : cx < 640 ? 'middle' : 'right';
    const vt = cy >= FLOOR - 2 ? 'floor' : cy < 200 ? 'high shelf' : cy < 340 ? 'shelf' : 'table';
    return `${o.t}${o.target ? ' (TARGET)' : ''} on ${vt} ${hz}`;
  };
  const parts2 = objs.filter(o => o.alive).slice(0, 6).map(where);
  if (bell) parts2.push('service bell on desk right');
  if (vac) parts2.push(`robot vacuum patrolling floor, now ${vac.x < 450 ? 'left' : vac.x < 650 ? 'middle' : 'right'}`);
  if (burglar) parts2.push(`burglar ${burglar.ko ? 'knocked out' : burglar.x > 700 ? 'entering right' : burglar.x > 380 ? 'sneaking mid-room' : 'nearly escaping left'}`);
  return `objects: ${parts2.join('; ')}; mess ${mess}/${cur.mess}`;
}
function robotEvent(ev, extra) {
  let fb;
  if (ev === 'start') fb = pickLine(LINES.start[levelIdx], 'start');
  else if (ev === 'clear') fb = pickLine(LINES.clear, 'clear');
  else if (ev === 'escaped') fb = pickLine(LINES.escaped, 'esc');
  else if (ev === 'hello') fb = pickLine(LINES.hello, 'hello');
  else fb = pickLine(LINES.fail, 'fail');
  if (!aiLive()) { say(fb); return; }
  say('…'); const id = robot.sayId;
  const evText = { start: 'the room just started; give a hint', clear: 'the cat just succeeded; react with relief', fail: 'the owner came home to a huge mess; react, then hint for the retry', escaped: 'the burglar escaped; react, then hint for the retry', hello: 'the cat just switched your voice module on in the start room; greet it nervously' }[ev];
  const prompt = `You are PIP-3, an anxious, overly polite hovering home robot. You can only communicate by pointing a red laser dot and saying terse fragments. A cat is your only ally.` +
    (cur.room ? '' : ` Goal: ${cur.goal}. Scene: ${levelDesc()}.`) + ` Event: ${evText}. Reply with ONE line, max 80 characters, cryptic but helpful, in character. No quotes, no emoji.`;
  askAI(prompt, () => fb).then(t => { if (robot.sayId === id) say(cleanLine(t) || fb); });
}

// ===== Particles & effects =====
function burst(x, y, n, c, sp = 3, g = 0.25, life = 40, s = 3, type = 'shard') {
  for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), v = rand(0.5, sp); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.4, g, life: life * rand(0.6, 1.2), max: life, c, s: s * rand(0.6, 1.3), type, rot: rand(0, 6), vr: rand(-0.3, 0.3) }); }
}
function floatText(x, y, text, c) { parts.push({ x, y, vx: 0, vy: -0.8, g: 0, life: 60, max: 60, c, s: 1, type: 'text', text }); }
function addShake(a) { shake = Math.max(shake, a * (reduceMotion ? 0.2 : 1)); }

// ===== Objects =====
function zoneRect() {
  if (bell) return { x: bell.x - 36, y: bell.y - 40, w: 72, h: 40 };
  if (vac && !vac.dead) return { x: vac.x - 28, y: FLOOR - 22, w: 56, h: 22 };
  if (burglar && !burglar.ko) return { x: burglar.x - 16, y: FLOOR - 72, w: 32, h: 72 };
  return null;
}
function targetObj() { return objs.find(o => o.target); }
function shatter(o, counts) {
  o.alive = false;
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  burst(cx, cy, 18, o.T.c, 4.5, 0.3, 50, 4); burst(cx, cy, 6, o.T.d, 3.5, 0.3, 50, 3);
  if (o.t === 'plant') burst(cx, cy, 14, '#5a3b2a', 3, 0.25, 45, 3, 'dust');
  if (o.t === 'jar') burst(cx, cy, 8, '#e9a24a', 3, 0.3, 40, 3);
  SFX.shatter(); addShake(6);
  if (counts) lose(o);
}
function lose(o) {
  if (cur.room) { o.respawn = 120; return; }
  if (state !== 'play') return;
  if (o.target) {
    o.alive = false; o.respawn = 70; mess++;
    floatText(o.x + o.w / 2, o.y - 10, 'MISS +1 MESS', '#ff6b6b'); say(pickLine(LINES.lost, 'lost'));
  } else if (!o.messed) {
    o.messed = true; mess++; floatText(o.x + o.w / 2, o.y - 10, '+1 MESS', '#ffb3b3');
    if (Math.random() < 0.45 && mess < cur.mess) say(pickLine(LINES.mess, 'mess'));
  }
  if (mess >= cur.mess) fail('OWNER IS HOME!', 'fail');
}
function knock(o) {
  const dir = Math.sign((o.x + o.w / 2) - (C.x + C.w / 2)) || C.face;
  const p = C.dash > 0 ? 5.5 : Math.max(2.2, Math.abs(C.vx) * 0.8);
  o.vx = dir * p; o.vy = C.dash > 0 ? -3.5 : -1.3; o.ground = false; o.vr = dir * rand(0.06, 0.16); o.cd = 12;
  SFX.knock(); burst(o.x + o.w / 2, o.y + o.h / 2, 4, '#ffffff', 1.5, 0.05, 15, 2, 'spark');
}
function updObj(o) {
  if (!o.alive) {
    if (o.respawn > 0 && --o.respawn === 0) {
      Object.assign(o, { x: o.home.x, y: o.home.y, vx: 0, vy: 0, rot: 0, vr: 0, alive: true, ground: true, messed: false });
