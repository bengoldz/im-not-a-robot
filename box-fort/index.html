<title>Box Fort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Kalam:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0d171f;
  --ink:#e6eef2;
  --btn:rgba(18,40,52,.6);
  --btn-edge:rgba(255,204,51,.55);
  --btn-on:rgba(255,204,51,.35);
}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;font-family:"Share Tech Mono","Courier New",monospace}
#wrap{position:relative;width:100%;height:100%;max-width:100vw;overflow:hidden}
canvas{display:block;width:100%;height:100%;object-fit:contain;background:var(--bg);touch-action:none}
#touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:10px;pointer-events:none;box-sizing:border-box}
#touch .grp{display:flex;gap:8px;pointer-events:auto}
#touch button{width:58px;height:58px;border-radius:14px;border:2px solid var(--btn-edge);background:var(--btn);color:var(--ink);font:13px "Bungee",monospace;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
#touch button.on{background:var(--btn-on)}
</style>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="touch">
    <div class="grp"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
    <div class="grp"><button data-k="down">SIT</button><button data-k="dash">DASH</button><button data-k="up">JUMP</button></div>
  </div>
</div>
<script>
"use strict";
// ===== Setup =====
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 540, CW = 40, COLS = 12, SX0 = 240, SX1 = SX0 + COLS * CW;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAL = {
  bg:'#0d171f', wall:'#16252f', wall2:'#1c303c', steel:'#5d7383', steelD:'#33454f', hazard:'#ffcc33',
  card:'#c99a5b', cardD:'#8f6634', cardL:'#e2bd84', tape:'#e9d3a3', ink:'#e6eef2', dim:'#7f97a5',
  sky:'#7fe3ff', red:'#ff5a4f', blue:'#4fb7ff', peanut:'#efeadb', peanutD:'#c9c2ad', cat:'#f4f6f8', catP:'#9aa7b2', pink:'#ff9fb5', mint:'#6dffb8'
};
const FONT_T = '"Bungee", "Impact", sans-serif', FONT_M = '"Share Tech Mono", "Courier New", monospace', FONT_H = '"Kalam", "Comic Sans MS", cursive';

// ===== Live AI =====
let sample = null;          // live AI function, or null
(async () => {
  try { if (window.claude && window.claude.use) sample = await window.claude.use("sample"); } catch (e) { sample = null; }
})();
let aiBusy = false, aiDisabled = false, aiOn = false;
async function askAI(prompt, fallback) {
  // returns a string; never throws; never more than one call in flight
  if (!sample || aiDisabled || aiBusy) return fallback();
  aiBusy = true;
  try {
    const { text } = await sample(prompt, { modelTier: "quick", cache: false });
    return (text || "").trim() || fallback();
  } catch (e) {
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e && e.code)) aiDisabled = true;
    return fallback();
  } finally { aiBusy = false; }
}
async function askJSON(prompt, fallback) {
  if (!sample || aiDisabled || aiBusy || typeof sample.json !== 'function') return fallback();
  aiBusy = true;
  try {
    const r = await sample.json(prompt, { modelTier: "quick", cache: false });
    return r == null ? fallback() : r;
  } catch (e) {
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e && e.code)) aiDisabled = true;
    return fallback();
  } finally { aiBusy = false; }
}
const aiLive = () => aiOn && !!sample && !aiDisabled;

// ===== Content: box types, manifests, lines =====
const TYPES = {
  small:  { w:1, h:1, col:'#c99a5b', label:'' },
  medium: { w:2, h:1, col:'#bf8f52', label:'' },
  wide:   { w:3, h:1, col:'#b98a4e', label:'' },
  open:   { w:2, h:1, col:'#d2a565', label:'OPEN' },
  fragile:{ w:1, h:1, col:'#d9b98a', label:'!' },
  bouncy: { w:1, h:1, col:'#5fa8d8', label:'' },
  heavy:  { w:3, h:2, col:'#8a6a45', label:'HEAVY' },
  slider: { w:2, h:1, col:'#c7a04c', label:'' }
};
const TYPE_NAMES = Object.keys(TYPES);
const FALLBACK_MANIFESTS = [
  { tier:1, customer:'Sir Reginald Whiskerton', note:'Leave it by the door. Or on the cat.', boxes:['small','medium','open','small','wide','bouncy','small','medium','open','small'] },
  { tier:1, customer:'Mrs. Pawsworth', note:'Fragile heirloom yarn. Do not sit on.', boxes:['medium','small','open','small','fragile','wide','small','bouncy','medium'] },
  { tier:1, customer:'Box Enjoyer #4417', note:'I ordered the boxes. Not what is in them.', boxes:['open','small','medium','small','open','wide','small','small','medium','bouncy'] },
  { tier:2, customer:'Dr. Mittens, PhD', note:'Research materials. Mostly boxes.', boxes:['small','wide','open','fragile','medium','bouncy','small','slider','medium','open','small'] },
  { tier:2, customer:'Unit 7 (Vacuum)', note:'Please stop delivering cats to me.', boxes:['medium','slider','small','open','wide','fragile','small','bouncy','medium','small','open'] },
  { tier:2, customer:'Grandma Biscuit', note:'Bubble wrap inside. Pop responsibly.', boxes:['wide','small','open','medium','bouncy','fragile','small','medium','slider','open','small'] },
  { tier:3, customer:'Chairman Meow', note:'Express. Extremely express.', boxes:['heavy','small','open','slider','medium','fragile','bouncy','wide','small','open','medium','small'] },
  { tier:3, customer:'The Cardboard Collector', note:'Every size. Every shape. Every day.', boxes:['medium','wide','heavy','open','small','slider','bouncy','fragile','small','medium','open','small'] },
  { tier:4, customer:'Lord Fluffington III', note:'Fort upgrade kit. Assembly by cat.', boxes:['heavy','slider','open','fragile','medium','wide','bouncy','small','heavy','open','slider','small','medium'] },
  { tier:4, customer:'Toaster Rebellion HQ', note:'Contains: 1 (one) suspicious toaster.', boxes:['wide','heavy','fragile','slider','open','small','bouncy','medium','fragile','heavy','open','small','medium'] },
  { tier:5, customer:'Agent Purrkins', note:'Classified. Shake well before sitting.', boxes:['heavy','slider','fragile','open','heavy','bouncy','wide','slider','fragile','open','medium','small','heavy','small'] },
  { tier:5, customer:'The Last Box On Earth', note:'Final shipment. Make it count, kitty.', boxes:['heavy','fragile','slider','heavy','open','wide','bouncy','fragile','slider','open','heavy','medium','small','small'] }
];
const SQUISH_LINES = [
  'Oops. Signature required: one flat cat.', 'Delivered! To your head.', 'Package received. Cat compressed.',
  'That one was marked THIS SIDE UP.', 'Recalculating route around the cat...', 'My sensors did say "lump".',
  'Sorry! My claw has a mind of its own.', 'Tip: the shadow means "move", kitty.', 'Cat detected. Too late. Again.',
  'Box 1, Cat 0.', 'I will log this as "soft landing".', 'Customer satisfaction: questionable.',
  'Have you tried NOT being under it?', 'Flat-pack cat. Very IKEA.', 'Beep. Boop. Bonk.', 'Refund denied. Cat intact-ish.',
  'Gravity is a feature, not a bug.', 'I deliver. You dodge. That is the deal.'
];
const BURY_LINES = ['Peanut avalanche! Climb, kitty!', 'Packing peanuts: 1, cat: 0.', 'You were packed for shipping.', 'Ahh, the peanut tide comes for all.'];
const DRONE_IDLE = ['Hello, small furry obstacle!', 'Step on START. I have boxes.', 'I am DROP-E. I drop. It is my whole thing.', 'Please sign here. With a paw.'];
const CLEAR_LINES = ['Skylight reached! Next bay!', 'Delivery complete. Fort: impressive.', 'Cat on roof. Logging as delivered.', 'Wow. You climbed my whole order.'];

// ===== Audio =====
let actx = null;
function audioInit() { if (actx) return; try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
function tone(f1, f2, dur, type = 'square', vol = 0.12, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.15, hp = 400) {
  if (!actx) return;
  const n = Math.floor(actx.sampleRate * dur), b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = hp; s.buffer = b; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start();
}
const SFX = {
  jump(){ tone(320, 640, 0.11, 'square', 0.07); }, land(){ tone(140, 70, 0.07, 'triangle', 0.12); },
  wall(){ tone(420, 760, 0.1, 'square', 0.07); }, dash(){ noise(0.12, 0.1, 1500); tone(700, 250, 0.12, 'sawtooth', 0.05); },
  drop(){ tone(520, 260, 0.18, 'sine', 0.08); }, thud(){ tone(110, 45, 0.18, 'triangle', 0.25); noise(0.08, 0.08, 200); },
  heavy(){ tone(80, 30, 0.35, 'triangle', 0.35); noise(0.2, 0.15, 100); }, boing(){ tone(180, 900, 0.25, 'sine', 0.18); },
  squish(){ tone(500, 60, 0.4, 'sawtooth', 0.12); noise(0.15, 0.1, 300); },
  sit(){ tone(660, 880, 0.08, 'triangle', 0.1); tone(880, 1320, 0.12, 'triangle', 0.08, 0.08); },
  meow(){ tone(650, 900, 0.12, 'sine', 0.09); tone(900, 520, 0.22, 'sine', 0.09, 0.12); },
  crack(){ noise(0.18, 0.18, 2500); tone(1200, 300, 0.1, 'square', 0.04); }, pad(){ tone(520, 1040, 0.1, 'square', 0.06); },
  clear(){ [523, 659, 784, 1046].forEach((f, i) => tone(f, f * 1.01, 0.16, 'square', 0.08, i * 0.09)); },
  safe(){ tone(990, 1480, 0.12, 'triangle', 0.1); }, slip(){ noise(0.25, 0.06, 3000); }
};

// ===== Input =====
const keys = {}, pressed = {};
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'up', KeyW:'up', Space:'up', ArrowDown:'down', KeyS:'down', ShiftLeft:'dash', ShiftRight:'dash' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; audioInit();
  if (!k) return; e.preventDefault();
  if (!keys[k]) pressed[k] = true; keys[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { keys[k] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
if (matchMedia('(pointer: coarse)').matches) {
  const tc = document.getElementById('touch'); tc.style.display = 'flex';
  tc.querySelectorAll('button').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); audioInit(); if (!keys[k]) pressed[k] = true; keys[k] = true; b.classList.add('on'); };
    const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });
}

// ===== Helpers =====
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hov = (ax, aw, bx, bw) => Math.min(ax + aw, bx + bw) - Math.max(ax, bx);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
let best = 0; try { best = +(localStorage.getItem('boxfort_best') || 0) || 0; } catch (e) {}
function saveBest() { if (score > best) { best = score; try { localStorage.setItem('boxfort_best', String(best)); } catch (e) {} } }

// ===== State =====
const WAVE_ROWS = [6, 8, 10, 12, 14];
let scene = 'menu';           // menu | play
let wave = 0, score = 0, lives = 3, phase = 'intro', phaseT = 0;
let boxes = [], parts = [], texts = [], shake = 0, camY = -480, time = 0;
let skyY = -240, peanutY = 30, peanutDelay = 6, maxRow = 0;
let manifest = null, dropIdx = 0, slipT = 0, menuMsg = '', menuSub = '', winFx = 0;
const manifestFor = {};
let bubble = { text: DRONE_IDLE[0], t: 99 };
const drone = { x: 480, y: -400, vx: 140, held: null, target: null, dropT: 2, claw: 0, rot: 0 };
const cat = { x: 470, y: -20, w: 22, h: 20, vx: 0, vy: 0, face: 1, ground: null, coyote: 0, buf: 0, dashT: 0, dashDir: 1, dashCD: 0, canDash: true,
  wallDir: 0, wallT: 0, wallLock: 0, crouch: false, sit: null, inv: 0, dead: 0, sx: 1, sy: 1, anim: 0, prevGround: null, sitCD: 0 };
let pads = [];
function say(t, dur = 3.5) { bubble = { text: String(t).slice(0, 90), t: dur }; }
function addText(x, y, s, col = PAL.hazard) { texts.push({ x, y, s, col, t: 1.2 }); }
function burst(x, y, n, col, sp = 160, g = 500, size = 3) {
  for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), v = rand(sp * 0.3, sp); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.3, life: rand(0.4, 0.9), max: 0.9, col, g, size: rand(size * 0.6, size * 1.3) }); }
}
function addShake(v) { shake = Math.max(shake, REDUCED ? v * 0.25 : v); }

// ===== Manifests =====
function validateManifest(o) {
  try {
    if (typeof o === 'string') { const m = o.match(/\{[\s\S]*\}/); o = m ? JSON.parse(m[0]) : null; }
    if (!o || typeof o !== 'object') return null;
    if (!Array.isArray(o.boxes) && o.data && typeof o.data === 'object') o = o.data;
    let bx = Array.isArray(o.boxes) ? o.boxes.map(s => String(s).toLowerCase().trim()).filter(s => TYPES[s]) : [];
    if (bx.length < 4) return null;
    bx = bx.slice(0, 14);
    while (bx.length < 8) bx.push(bx.length % 2 ? 'small' : 'medium');
    const clean = s => String(s == null ? '' : s).replace(/[\u0000-\u001f"]/g, ' ').replace(/\s+/g, ' ').trim();
    return { customer: clean(o.customer).slice(0, 28) || 'Valued Customer', note: clean(o.note).slice(0, 60) || 'Handle with paws.', boxes: bx, src: 'AI' };
  } catch (e) { return null; }
}
function fallbackManifest(w) {
  const pool = FALLBACK_MANIFESTS.filter(m => Math.abs(m.tier - w) <= (w >= 4 ? 1 : 0));
  const m = pick(pool.length ? pool : FALLBACK_MANIFESTS);
  return { customer: m.customer, note: m.note, boxes: m.boxes.slice(), src: 'scripted' };
}
function requestManifest(w) {
  manifestFor[w] = null;
  if (!aiLive()) return;
  const prompt = `You dispatch boxes for DROP-E, a delivery drone in a cat-and-robot platformer. A cat climbs the boxes you drop. ` +
    `This is wave ${w} of 5; ramp difficulty: wave 1 gentle (mostly small, medium, open, a bouncy), wave 5 nasty (heavy, fragile, slider, few open). ` +
    `Reply with ONLY JSON: {"customer":"<funny customer name, max 28 chars>","note":"<funny delivery note, max 60 chars>","boxes":[${8 + Math.min(6, w)} strings, each one of: small, medium, wide, open, fragile, bouncy, heavy, slider]}`;
  askJSON(prompt, () => null).then(r => {
    const m = validateManifest(r);
    if (!m) return;
    manifestFor[w] = m;
    if (scene === 'play' && wave === w && dropIdx === 0 && manifest && manifest.src !== 'AI') { manifest = m; slipT = 0; SFX.slip(); say(m.note, 4.5); }
  });
}

// ===== Scenes =====
function roomBounds() { return scene === 'menu' ? [20, 940] : [SX0, SX1]; }
function makePads() {
  pads = [
    { x: 110, w: 130, label: 'AI ON', t: 0, done: false, act() {
      if (!sample) { say('No AI link in this copy. Scripted mode it is!'); return; }
      aiOn = true; aiDisabled = false; say('Connecting to dispatch...', 6);
      askAI('You are DROP-E, a cheerful but clumsy warehouse delivery drone. Greet the cat who will climb your boxes. One line, max 80 chars.',
        () => 'Dispatch offline. Using my paper notes!').then(t => { if (scene === 'menu') say(t.replace(/^"|"$/g, ''), 5); });
    } },
    { x: 720, w: 130, label: 'START', t: 0, done: false, act() { startRun(); } }
  ];
}
function toMenu(msg = '', sub = '') {
  scene = 'menu'; menuMsg = msg; menuSub = sub; boxes = []; peanutY = 30; skyY = -470;
  Object.assign(cat, { x: 470, y: -20, vx: 0, vy: 0, sit: null, dead: 0, inv: 0, dashT: 0 });
  drone.x = 480; drone.y = -440; drone.held = null; makePads(); camY = -480;
  if (!msg) say(pick(DRONE_IDLE), 99);
}
function startRun() {
  score = 0; lives = 3; wave = 0; SFX.meow();
  requestManifest(1); startWave(1);
}
function startWave(w) {
  wave = w; scene = 'play'; phase = 'intro'; phaseT = 2.2; boxes = []; maxRow = 0;
  skyY = -WAVE_ROWS[w - 1] * CW; peanutY = 30; peanutDelay = 7; dropIdx = 0; slipT = 0;
  manifest = manifestFor[w] || fallbackManifest(w);
  drone.y = skyY - 70; drone.x = SX0 + 40; drone.vx = 150; drone.held = null; drone.target = null; drone.dropT = 0.4;
  Object.assign(cat, { x: 480 - 11, y: -20, vx: 0, vy: 0, sit: null, dead: 0, inv: 1, dashT: 0, h: 20 });
  camY = -480; SFX.slip();
  say(manifest.note, 4.5);
}
function clearWave() {
  phase = 'clear'; phaseT = 2.6; SFX.clear(); burst(cat.x + 11, cat.y, 40, PAL.sky, 260, 300, 4);
  const bonus = 500 * wave; score += bonus; addText(cat.x, cat.y - 20, 'SKYLIGHT! +' + bonus, PAL.sky);
  say(pick(CLEAR_LINES), 3); if (wave < 5) requestManifest(wave + 1);
}
function loseLife(kind) {
  if (cat.dead > 0 || phase === 'clear') return;
  lives--; cat.dead = 0.8; cat.sit = null; SFX.squish(); addShake(10);
  burst(cat.x + 11, cat.y + 15, 20, kind === 'bury' ? PAL.peanut : PAL.cat, 200, 600, 3);
  const fb = () => kind === 'bury' ? pick(BURY_LINES) : pick(SQUISH_LINES);
  say(fb(), 3.5);
  if (aiLive() && lives > 0 && dropIdx > 0) {
    askAI(`You are DROP-E, a clumsy delivery drone. You just ${kind === 'bury' ? 'buried the cat in packing peanuts' : 'dropped a box on the cat'} (wave ${wave}, ${lives} lives left). One teasing line, max 80 chars, no quotes.`, fb)
      .then(t => { if (scene === 'play') say(t.replace(/^"|"$/g, ''), 3.5); });
  }
}
function respawn() {
  if (lives <= 0) { saveBest(); toMenu('RUN OVER', 'Score ' + score + '  ·  Best ' + best); say('Return to sender. Try again?', 99); return; }
  let top = Math.min(0, peanutY);
  const cx = cat.x;
  for (const b of boxes) if (hov(cx, cat.w, b.x, b.w) > 0) top = Math.min(top, b.y);
  Object.assign(cat, { y: top - cat.h - 2, vx: 0, vy: 0, dead: 0, inv: 1.6, h: 20 });
}

// ===== Boxes =====
function makeBox(type, col) {
  const T = TYPES[type];
  return { type, x: SX0 + col * CW, y: drone.y + 22, w: T.w * CW, h: T.h * CW, vy: 0, state: 'fall', crack: 0, used: false, slideDir: Math.random() < 0.5 ? -1 : 1, slideT: 1.2, tx: null, squash: 0 };
}
function supportY(b) {
  let s = 0;
  for (const o of boxes) if (o !== b && hov(b.x, b.w, o.x, o.w) > 1 && o.y >= b.y + b.h - 1 && o.y < s) s = o.y;
  return s;
}
function hasOnTop(b) { for (const o of boxes) if (o !== b && hov(b.x, b.w, o.x, o.w) > 1 && Math.abs(o.y + o.h - b.y) < 2) return true; return false; }
function cellFree(x, y, w, h, ignore) {
  if (x < SX0 || x + w > SX1) return false;
  const r = { x: x + 1, y: y + 1, w: w - 2, h: h - 2 };
  for (const o of boxes) if (o !== ignore && overlap(r, o)) return false;
  if (overlap(r, cat) && !cat.sit) return false;
  return true;
}
function updateBoxes(dt) {
  boxes.sort((a, b) => (b.y + b.h) - (a.y + a.h));
  for (const b of boxes) {
    b.squash = Math.max(0, b.squash - dt * 4);
    if (b.tx !== null) { // sliding
      const d = b.tx - b.x, st = 90 * dt;
      const ox = b.x; b.x = Math.abs(d) <= st ? b.tx : b.x + Math.sign(d) * st;
      if (b.x === b.tx) b.tx = null;
      if (cat.ground === b && !cat.sit) cat.x += b.x - ox;
    }
    const s = supportY(b);
    if (b.state === 'rest' && Math.abs(b.y + b.h - s) < 0.5) {
      if (b.type === 'slider' && b.tx === null) {
        b.slideT -= dt;
        if (b.slideT <= 0) {
          b.slideT = 0.9;
          if (!hasOnTop(b)) {
            if (cellFree(b.x + b.slideDir * CW, b.y, b.w, b.h, b)) b.tx = b.x + b.slideDir * CW;
            else b.slideDir *= -1;
          }
        }
      }
      if (b.crack > 0) { b.crack -= dt; if (b.crack <= 0) b.dead = true; }
      continue;
    }
    b.state = 'fall'; b.vy = Math.min(b.vy + 1400 * dt, 720);
    const ny = b.y + b.vy * dt;
    if (ny + b.h >= s) {

function drawCat() {

function drawCatHead(hx, hy, f, front) {

function drawDrone() {

function drawBubble(x, y, text) {

// ===== Drawing: HUD & menu =====
function drawSlip() {

function drawHUD() {

function wrapText(t, x, y, mw, lh, max) {

function drawMenu() {
  ctx.textAlign = 'center';

function render() {

  if (scene === 'menu') drawMenu();
  drawShadows();

  drawCat();
  if (scene === 'play') drawPeanuts();
  drawDrone();
  for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - camY - p.size / 2, p.size, p.size); }

// ===== Main loop =====
toMenu();
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  while (dt > 0) { const s = Math.min(dt, 1 / 120); update(s); dt -= s; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
