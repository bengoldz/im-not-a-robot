<script>
// ===== SETUP =====

// ===== LIVE AI =====
let sample = null;          // live AI function, or null
(async () => {

})();

// ===== LEXICON =====

adj:heavy/heavy,falling/heavy,light/light,floating/light,angry/wind,wild/wind,calm,sleepy,soft,hungry,electric,cold/ice,frozen/ice,icy/ice,hot/fire,burning/fire,tiny/tiny,small/tiny,giant/giant,huge/giant

  hurt: () => { tone(700, 0.18, { type: 'sawtooth', slide: 0.5, vol: 0.06 }); tone(940, 0.14, { type: 'square', slide: 0.6, vol: 0.03 }); },

// ===== INPUT =====
const K = { left: 0, right: 0, jump: 0, down: 0, dash: 0 }, KP = {};

  ArrowDown:'down', KeyS:'down', ShiftLeft:'dash', ShiftRight:'dash', KeyK:'dash' };
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); if (!K[k]) KP[k] = 1; K[k] = 1; initAudio(); } });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); K[k] = 0; } });
addEventListener('blur', () => { for (const k in K) K[k] = 0; });

// ===== STATE =====
let mode = 'room', spec = null, dreamIdx = 0, words = [], worldW = W, camX = 0, T = 0;

  dvx: 0, dvy: 0, kneadT: 0, kneadLock: false, inv: 0, sq: 0, heat: 0, crouch: false, run: 0, check: 0, checkU: 0.5, wrapT: 0 };

// ===== WORDS & LAYOUT =====

  if (floorY < 600) {
    ctx.save(); ctx.strokeStyle = groundIce ? COL.ice : COL.sand; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = groundIce ? 'rgba(143,216,255,0.10)' : 'rgba(232,195,122,0.07)'; ctx.fillRect(0, floorY, W, H - floorY);
    ctx.globalAlpha = 0.3; ctx.fillStyle = ctx.strokeStyle; ctx.font = `12px ${FH}`;
    for (let i = 0; i < 40; i++) { const x = ((i * 53 - camX) % W + W) % W; ctx.fillText(groundIce ? '*' : '.', x, floorY + 12 + (i % 4) * 14); }
    ctx.restore();
  }
}

// ===== HUD =====
function drawHUD() {
  ctx.save(); ctx.textBaseline = 'top';
  // AI tag
  ctx.font = `18px ${FH}`; ctx.textAlign = 'right'; ctx.fillStyle = aiOn && !aiDisabled ? COL.lime : COL.slate;
  ctx.fillText(aiOn && !aiDisabled ? (aiBusy ? 'AI: live …' : 'AI: live') : 'AI: scripted', W - 14, 10);
  if (mode === 'dream' || mode === 'clear') {
    // stability
    const bw = 170, bx = W - 14 - bw, by = 34;
    ctx.fillStyle = 'rgba(138,255,208,0.12)'; rr(bx, by, bw, 10, 5); ctx.fill();
    const fr = clamp(stab / 100, 0, 1); ctx.fillStyle = fr < 0.25 ? COL.coral : COL.mint; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(bx, by + 10);
    for (let x = 0; x <= bw * fr; x += 4) ctx.lineTo(bx + x, by + 2 + Math.sin(x * 0.2 + T * 5) * 1.5);
    ctx.lineTo(bx + bw * fr, by + 10); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = COL.slate; ctx.font = `15px ${FH}`; ctx.fillText('dream stability', W - 14, 47);
    // dream title & sentence
    ctx.textAlign = 'left'; ctx.font = `18px ${FH}`; ctx.fillStyle = COL.slate;
    ctx.fillText(`DREAM ${Math.min(dreamIdx + 1, 5)}/5${spec && spec.ai ? '  ✦ AI-written' : ''}`, 14, 10);
    let x = 14; ctx.font = `26px ${FH}`;
    words.forEach(w => { if (w.zz) return; const s = (w.scr ? '▒'.repeat(w.str.length) : w.str); ctx.fillStyle = colorOf(w); ctx.globalAlpha = P.on === w ? 1 : 0.75;
      ctx.fillText(s, x, 28); const ww = ctx.measureText(s).width; if (P.on === w && P.grounded) ctx.fillRect(x, 54, ww, 2); x += ww + 10; });
    ctx.globalAlpha = 1; ctx.font = `18px ${FH}`; ctx.fillStyle = COL.gold;
    const ex = words.find(w => w.eff.has('exit'));
    const goal = (needPrey ? (collected >= needPrey ? '✓ fish caught · ' : 'catch a FISH · then ') : '') + 'reach the ' + (ex ? ex.str.toUpperCase() : 'EXIT');
    ctx.fillText('◇ ' + goal, 14, 60);
    if (dreamIdx === 0 && mode === 'dream' && modeT < 20 && stats.kneads === 0) { ctx.fillStyle = COL.mint; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 4); ctx.fillText('hold ↓ on a word to KNEAD it into another word', 14, 80); ctx.globalAlpha = 1; }
  }
  if (mode === 'room') {
    ctx.textAlign = 'center'; ctx.font = `46px ${FW}`; ctx.shadowColor = COL.mint; ctx.shadowBlur = 20; ctx.fillStyle = COL.mint;
    ctx.fillText('DREAMS OF', W / 2, 40); ctx.fillStyle = COL.amber; ctx.shadowColor = COL.amber; ctx.fillText('ELECTRIC CATS', W / 2 + Math.sin(T * 1.3) * 3, 90); ctx.shadowBlur = 0;
    ctx.font = `20px ${FH}`; ctx.fillStyle = COL.ink;
    ctx.fillText('← → walk   ↑ / space jump   SHIFT dash through words   hold ↓ on a word: KNEAD it', W / 2, 150, W - 40);
    ctx.fillStyle = COL.slate; ctx.fillText('the world is a sentence. every word is a platform. what it means is what it does.', W / 2, 174, W - 40);
    const ai = words.find(w => w.pad === 'ai');
    if (ai) { ctx.font = `20px ${FH}`; ctx.fillStyle = aiOn ? COL.lime : COL.slate; ctx.fillText(sample && !aiDisabled ? (aiOn ? 'AI: ON' : 'AI: OFF') : 'AI: n/a', ai.x + ai.w / 2 - camX, ai.py - 30); }
    const st = words.find(w => w.pad === 'start'); if (st) { ctx.fillStyle = COL.gold; ctx.fillText('▼ land here', st.x + st.w / 2 - camX, st.py - 30 + Math.sin(T * 4) * 3); }
    const sl = words.find(w => w.pad === 'sleep'); if (sl) { ctx.fillStyle = COL.mint; ctx.globalAlpha = 0.7; ctx.fillText('try kneading me', sl.x + sl.w / 2 - camX, sl.py - 30); ctx.globalAlpha = 1; }
  }
  if (mode === 'ending') {
    ctx.textAlign = 'center'; ctx.font = `42px ${FW}`; ctx.fillStyle = COL.gold; ctx.shadowColor = COL.gold; ctx.shadowBlur = 20;
    ctx.fillText('THE ROBOT WAKES UP', W / 2, 40); ctx.shadowBlur = 0;
    ctx.font = `22px ${FH}`; ctx.fillStyle = COL.ink;
    ctx.fillText(`5 dreams · ${stats.kneads} words kneaded · ${stats.ai} dreamt by AI · ${stats.reshuffles} half-wakes · ${((T - stats.t0) / 60).toFixed(1)} min`, W / 2, 96);
    const ag = words.find(w => w.pad === 'again'); if (ag) { ctx.fillStyle = COL.gold; ctx.fillText('▼ land on AGAIN to sleep once more', ag.x + ag.w / 2 - camX, ag.py - 34 + Math.sin(T * 4) * 3); }
  }
  // message
  if (msg.t > 0) { ctx.textAlign = 'center'; ctx.font = `26px ${FH}`; ctx.globalAlpha = Math.min(1, msg.t * 2); ctx.fillStyle = msg.col; ctx.shadowColor = msg.col; ctx.shadowBlur = 10;
    ctx.fillText(msg.text, W / 2, mode === 'room' ? 210 : 104); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
  // robot corner + bubbles + mumble
  const awake = robotWake > 0, rx = 62, ry = H - 34;
  if (mode === 'ending') drawRobot(W - 130, 215, 2.4, true); else drawRobot(rx, ry, 1, awake);
  if (!awake || mode !== 'ending') {
    ctx.font = `${16}px ${FW}`; ctx.fillStyle = COL.slate; ctx.textAlign = 'center';
    for (let i = 0; i < 3; i++) { const ph = (T * 0.5 + i / 3) % 1; ctx.globalAlpha = Math.sin(ph * Math.PI) * 0.8; ctx.font = `${(10 + ph * 14) | 0}px ${FW}`; ctx.fillText(i % 2 ? 'z' : 'Z', rx + 18 + ph * 30, ry - 40 - ph * 50); }
    ctx.globalAlpha = 0.5; ctx.strokeStyle = COL.slate; ctx.lineWidth = 1.5;
    [[100, H - 70, 4], [118, H - 88, 6], [142, H - 104, 8]].forEach(([bx, by, br]) => { ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.stroke(); });
    ctx.globalAlpha = 1;
  }
  if (mumble.t > 0 && mumble.text) {
    ctx.font = `19px ${FH}`; ctx.textAlign = 'left'; const tw = Math.min(ctx.measureText(mumble.text).width, 560); const n = Math.min(mumble.text.length, Math.floor((6 - mumble.t) * 40));
    ctx.globalAlpha = Math.min(1, mumble.t); const bx = mode === 'ending' ? 20 : 150, by = mode === 'ending' ? H - 44 : H - 120;
    ctx.fillStyle = 'rgba(10,20,32,0.82)'; rr(bx, by, tw + 20, 28, 12); ctx.fill();
    ctx.strokeStyle = COL.slate; ctx.lineWidth = 1; ctx.stroke(); ctx.fillStyle = COL.ink; ctx.fillText(mumble.text.slice(0, n), bx + 10, by + 5, 560); ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ===== MAIN LOOP =====
function render() {
  ctx.save();
  const sk = shake * (RM ? 0.2 : 1); if (sk > 0) ctx.translate((Math.random() - 0.5) * sk, (Math.random() - 0.5) * sk);
  drawBG();
  ctx.save(); ctx.translate(-Math.round(camX), 0);
  for (const w of words) drawWord(w);
  for (const w of words) drawExtras(w);
  for (const p of particles) {
    const a = Math.max(0, p.life / (p.max || 1)); ctx.globalAlpha = Math.min(1, a);
    if (p.ghost) { ctx.globalAlpha = a * 0.35; ctx.fillStyle = COL.mint; ctx.beginPath(); ctx.ellipse(p.x, p.y, 12, 7, 0, 0, 7); ctx.fill(); }
    else if (p.streak) { ctx.strokeStyle = p.col; ctx.globalAlpha = 0.35; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.05, p.y); ctx.stroke(); }
    else if (p.ch) { ctx.fillStyle = p.col; ctx.font = `${p.size | 0}px ${FW}`; ctx.textAlign = 'center'; ctx.save(); ctx.translate(p.x, p.y); if (p.rot) ctx.rotate(p.rot); ctx.fillText(p.ch, 0, 0); ctx.restore(); }
    else if (p.bubble) { ctx.strokeStyle = p.col; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.stroke(); }
    else { ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  }
  ctx.globalAlpha = 1;
  if (mode !== 'clear') drawCat();
  else { ctx.globalAlpha = Math.max(0, 1 - modeT); drawCat(); ctx.globalAlpha = 1; }
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life); ctx.fillStyle = f.col; ctx.font = `20px ${FH}`; ctx.textAlign = 'center'; ctx.fillText(f.text, f.x, f.y); }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawWater();
  drawHUD();
  if (mode === 'clear') { ctx.fillStyle = `rgba(255,229,138,${Math.min(0.5, modeT * 0.2)})`; ctx.font = `40px ${FW}`; ctx.textAlign = 'center'; ctx.fillStyle = COL.gold; ctx.globalAlpha = Math.min(1, modeT); ctx.shadowColor = COL.gold; ctx.shadowBlur = 20;
    ctx.fillText(dreamIdx + 1 >= DREAMS.length ? 'the dream is ending...' : 'the dream dissolves...', W / 2, H / 2); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
  // CRT
  ctx.fillStyle = scanPat; ctx.globalAlpha = 0.6 + Math.sin(T * 60) * 0.05; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  ctx.drawImage(vig, 0, 0);
  if (flash > 0) { ctx.fillStyle = robotWake > 0 && mode === 'dream' ? `rgba(255,107,107,${flash * 0.4})` : `rgba(234,252,255,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
  if (robotWake > 0 && robotWake < 50 && mode === 'dream') { ctx.globalAlpha = Math.min(0.5, robotWake * 0.3); for (let i = 0; i < 6; i++) { const y = Math.random() * H; ctx.drawImage(cv, 0, y, W, 12, (Math.random() - 0.5) * 40, y, W, 12); } ctx.globalAlpha = 1; }
  ctx.restore();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
enterRoom();
requestAnimationFrame(frame);
</script>
