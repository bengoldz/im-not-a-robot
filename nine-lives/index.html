  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);

let AC = null, master = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'square', vol = 0.06, f2 = null, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.1, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, len = Math.floor(AC.sampleRate * dur);
  const b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = b; g.gain.value = vol; s.connect(g); g.connect(master); s.start(t);
}

// ===== Live AI =====

async function askAI(prompt, fallback) {
  // returns a string; never throws; never more than one call in flight
  if (!sample || aiDisabled || aiBusy) return fallback();
  aiBusy = true;
  try {
    const { text } = await sample(prompt, { modelTier: "quick", cache: false });

  } catch (e) {
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e && e.code)) aiDisabled = true;
    return fallback();
  } finally { aiBusy = false; }
}

// ===== Input =====

// ===== World state =====
let state = 'garage', L = null, LI = 0, grid = [];
let pads = [], bowls = [], roombas = [], dock = null, gpads = [], startPos = { x: 60, y: 510 };
let battery = 60, dispBat = 60, lives = 9, checkpoint = null, levelTime = 0, levelDeaths = 0, dayTime = 0;

// ===== Tiles & collision =====
function tileAt(c, r) { if (c < 0 || c >= COLS || r < 0) return '#'; if (r >= ROWS) return '.'; return grid[r][c]; }
const solid = (c, r) => tileAt(c, r) === '#';
function collideX(o) {
  const t = Math.floor((o.y + 1) / T), b = Math.floor((o.y + o.h - 1) / T);
  if (o.vx > 0) { const c = Math.floor((o.x + o.w) / T); for (let r = t; r <= b; r++) if (solid(c, r)) { o.x = c * T - o.w - 0.001; o.vx = 0; return; } }
  else if (o.vx < 0) { const c = Math.floor(o.x / T); for (let r = t; r <= b; r++) if (solid(c, r)) { o.x = (c + 1) * T; o.vx = 0; return; } }
}
function collideY(o, prevBottom) {
  const l = Math.floor((o.x + 1) / T), rgt = Math.floor((o.x + o.w - 1) / T);
  if (o.vy >= 0) {
    const r = Math.floor((o.y + o.h + 0.01) / T);
    for (let c = l; c <= rgt; c++) { const t = tileAt(c, r); if (t === '#' || (t === '-' && prevBottom <= r * T + 1)) { o.y = r * T - o.h; o.vy = 0; return true; } }
  } else {
    const r = Math.floor(o.y / T);
    for (let c = l; c <= rgt; c++) if (tileAt(c, r) === '#') { o.y = (r + 1) * T; o.vy = 0; break; }
  }
  return false;
}
const overlap = (a, bx, by, bw, bh) => a.x < bx + bw && a.x + a.w > bx && a.y < by + bh && a.y + a.h > by;

// ===== Sunbeams =====
const NSTRIP = 16;
function sunInfo() {
  const s = L.sun, p = ((dayTime / s.period) % 1 + 1) % 1;
  return { p, dx: s.from + (s.to - s.from) * p, inten: clamp(Math.min(p, 1 - p) / 0.07, 0, 1) };
}
function lightBlock(px, py) {
  const c = Math.floor(px / T), r = Math.floor(py / T);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
  const t = grid[r][c];
  return t === '#' || (t === '-' && py - r * T < 8);
}
function computeBeams() {
  SUN = sunInfo();
  beams = L.windows.map(w => {
    const Hb = H - w.y, len = Math.hypot(SUN.dx, Hb), step = 5 / len, strips = [];
    for (let i = 0; i < NSTRIP; i++) {
      const x0 = w.x + w.w * (i + 0.5) / NSTRIP; let t = 1;
      for (let s = 0.02; s <= 1; s += step) if (lightBlock(x0 + SUN.dx * s, w.y + Hb * s)) { t = s; break; }
      strips.push(t);
    }
    return { w, Hb, strips };
  });
}
function inSun(px, py) {
  for (const b of beams) {
    const w = b.w, s = (py - w.y) / b.Hb;
    if (s < 0 || s > 1) continue;
    const f = (px - (w.x + SUN.dx * s)) / w.w;
    if (f < 0 || f >= 1) continue;
    if (b.strips[Math.floor(f * NSTRIP)] >= s) return SUN.inten;
  }
  return 0;
}

// ===== Particles =====
function burst(x, y, n, color, spd = 120, life = 0.6, type = 'dot', g = 300) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random() * 0.7);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, life, max: life, color, type, g, s: 2 + Math.random() * 2 });
  }
}
function updateParts(arr, dt) {
  for (let i = arr.length - 1; i >= 0; i--) {
    const p = arr[i]; p.life -= dt;

// ===== Update =====
function update(dt) {

    const ctrl = state !== 'dying';
    if (ctrl) {

      if (P.inX && P.dashT <= 0) P.face = P.inX;
      if (edges.jump) P.buffer = 0.13;
      if (edges.jumpRel && P.vy < 0 && P.dashT <= 0) P.vy *= 0.45;

      physPlayer(h);

        for (const rb of roombas) if (P.ride !== rb && overlap(P, rb.x + 3, rb.y + 3, rb.w - 6, rb.h - 3)) die('roomba');
